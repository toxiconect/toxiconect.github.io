/* ===== AUTO CREDIT MISSED DAYS ===== */
async function autoCreditMissedDays(){
  if(!S.user) return;
  var totalCredited=0;
  var now=Date.now();
  for(var i=0;i<S.plans.length;i++){
    var pl=S.plans[i];
    if(pl.status==='completed') continue;
    var days=Number(pl.days_collected)||0;
    if(days>=40){ pl.status='completed'; continue; }
    var started=new Date(pl.started_at).getTime();
    var daysPassed=Math.floor((now-started)/DAY);
    var maxPossible=Math.min(daysPassed+1,40);
    var pending=maxPossible-days;
    if(pending>0){
      pl.days_collected=days+pending;
      var reward=pending*Number(pl.daily);
      S.user.balance=Number(S.user.balance||0)+reward;
      S.user.earned=Number(S.user.earned||0)+reward;
      totalCredited+=reward;
      if(pl.days_collected>=40) pl.status='completed';
      S.transactions.unshift({
        type:'daily_collect', amount:reward, status:'approved',
        method:pl.plan_name+' x'+pending, date:new Date().toISOString()
      });
      if(sb){
        try{ await sb.from("user_plans").update({days_collected:pl.days_collected,status:pl.status}).eq("id",pl.id); }catch(e){}
      }
    }
  }
  if(totalCredited>0){
    save();
    if(sb){
      try{ await sb.from("users").update({balance:S.user.balance,earned:S.user.earned}).eq("user_id",S.user.user_id); }catch(e){}
    }
    setTimeout(function(){ toast('💰 +$'+fmt(totalCredited)+' Auto-Credited!'); },1200);
  }
}

  for(var i=6;i>=0;i--){
    var d=new Date(today.getTime()-i*DAY);
    days.push({date:d, total:0});
  }
  S.transactions.forEach(function(tx){
    if(tx.type!=='daily_collect') return;
    var txDate=new Date(tx.date);
    txDate.setHours(0,0,0,0);
    var txTime=txDate.getTime();
    for(var i=0;i<days.length;i++){
      if(days[i].date.getTime()===txTime) days[i].total+=Number(tx.amount);
    }
  });
  return days;
}

function renderPortfolioChart(){
  var data=getPortfolioData();
  var max=Math.max.apply(null, data.map(function(d){return d.total}));
  if(max===0) max=1;
  var dayNames=['S','M','T','W','T','F','S'];
  var bars=data.map(function(d,i){
    var pct=(d.total/max)*100;
    if(pct<5 && d.total>0) pct=5;
    var isToday=i===data.length-1;
    return '<div class="flex flex-col items-center gap-1 flex-1">'
      +'<div class="w-full flex items-end justify-center" style="height:80px">'
      +'<div class="chart-bar rounded-t w-full" style="height:'+pct+'%;background:'+(isToday?'linear-gradient(180deg,#00FF66,#10B981)':'linear-gradient(180deg,rgba(0,255,102,0.6),rgba(0,255,102,0.15))')+';box-shadow:'+(isToday?'0 0 15px rgba(0,255,102,0.6)':'none')+'"></div>'
      +'</div>'
      +'<span class="text-[9px] '+(isToday?'text-toxic font-black':'text-gray-500')+'">'+dayNames[d.date.getDay()]+'</span>'
      +'</div>';
  }).join('');
  var totalWeek=data.reduce(function(a,b){return a+b.total},0);
  return '<div class="glass-card mb-3">'
    +'<div class="flex justify-between items-center mb-3">'
    +'<p class="text-[10px] text-gray-500 font-bold tracking-[0.2em]">📊 '+t('portfolio').toUpperCase()+'</p>'
    +'<p class="text-[10px] text-toxic font-bold mono">+$'+fmt(totalWeek)+'</p>'
    +'</div>'
    +'<div class="chart-wrap"><div class="flex items-end gap-1.5" style="min-width:100%">'+bars+'</div></div>'
    +'</div>';
}

function updateDynamic(){
  if(!S.user) return;
  document.querySelectorAll('[data-timer]').forEach(function(el){
    var planId=el.getAttribute('data-timer');
    var plan=S.plans.find(function(p){return String(p.id)===String(planId)});
    if(!plan) return;
    var nextCollect=getNextCollect(plan);
    var rem=nextCollect-Date.now();
    if(rem<=0){ el.textContent='READY NOW'; el.classList.add('text-toxic'); }
    else{
      var h=Math.max(0,Math.floor(rem/3600000));
      var m=Math.max(0,Math.floor((rem%3600000)/60000));
      var s=Math.max(0,Math.floor((rem%60000)/1000));
      el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.classList.remove('text-toxic');
    }
  });
  document.querySelectorAll('[data-collect]').forEach(function(btn){
    var planId=btn.getAttribute('data-collect');
    var plan=S.plans.find(function(p){return String(p.id)===String(planId)});
    if(!plan) return;
    var ready=Date.now()>=getNextCollect(plan) && Number(plan.days_collected)<40;
    btn.disabled=!ready;
    if(ready) btn.textContent='💰 COLLECT $'+Number(plan.daily).toFixed(2);
    else if(Number(plan.days_collected)>=40) btn.textContent='✅ COMPLETED';
    else btn.textContent='⏳ '+t('waiting');
  });
  if($('bal-val')) $('bal-val').textContent='$'+fmt(S.user.balance);
  if($('ref-val')) $('ref-val').textContent='$'+fmt(S.user.referral_balance);
  if($('plans-count')) $('plans-count').textContent=S.plans.filter(function(p){return Number(p.days_collected)<40}).length;
}
setInterval(updateDynamic,1000);

async function syncUserData(){
  if(!sb || !S.user || !S.user.user_id) return;
  try{
    var u=await sb.from("users").select("*").eq("user_id",S.user.user_id).limit(1);
    if(u.data && u.data.length>0){
      var f=u.data[0];
      S.user.balance=Number(f.balance||0);
      S.user.referral_balance=Number(f.referral_balance||0);
      S.user.invested=Number(f.invested||0);
      S.user.earned=Number(f.earned||0);
      S.user.is_banned=f.is_banned;
      save();
    }
    var p=await sb.from("user_plans").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false});
    if(p.data) S.plans=p.data;
    var d=await sb.from("deposits").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false});
    var w=await sb.from("withdrawals").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false});
    S.transactions=[];
    if(d.data) d.data.forEach(function(x){S.transactions.push({type:'deposit',amount:Number(x.amount),method:x.method,status:x.status,date:x.created_at})});
    if(w.data) w.data.forEach(function(x){S.transactions.push({type:'withdrawal',amount:Number(x.amount),method:'USDT',status:x.status,date:x.created_at})});
    S.transactions.sort(function(a,b){return new Date(b.date)-new Date(a.date)});
    save();
  }catch(e){}
}

  var oldPw=$('oldPw').value,newPw=$('newPw').value,newPw2=$('newPw2').value;
  if(!oldPw||!newPw||!newPw2) return alert('Fill all fields');
  if(newPw.length<4) return alert('Min 4 chars');
  if(newPw!==newPw2) return alert('Passwords do not match');
  var stored=localStorage.getItem('toxic_pwd_'+S.user.user_id);
  if(stored && stored!==oldPw) return alert('❌ Wrong current password');
  localStorage.setItem('toxic_pwd_'+S.user.user_id,newPw);
  $('oldPw').value=''; $('newPw').value=''; $('newPw2').value='';
  alert('✅ Password updated!');
}

  if(n===3){
    S.signupData.firstName=$('fn').value;
    S.signupData.lastName=$('ln').value;
    S.signupData.email=$('em').value;
    S.signupData.phone=$('ph').value;
    if(!S.signupData.firstName || !S.signupData.email) return alert('Fill Name and Email');
  }
  S.signupStep=n;
  render();
}

async function finishSignup(){
  var un=$('un').value.trim(), pw=$('pw').value, pw2=$('pw2').value;
  if(!un || un.length<3) return alert('Username 3+ chars');
  if(!pw || pw.length<4) return alert('Password 4+ chars');
  if(pw!==pw2) return alert('Passwords do not match');

  var userId='TG'+Date.now();
  var refCode='TOXIC'+Math.floor(1000+Math.random()*9000);

  S.user={user_id:userId,username:un,email:S.signupData.email||'',phone:S.signupData.phone||'',balance:0,referral_balance:0,invested:0,activated:0,earned:0,ceiling:0,referral_code:refCode,referred_by:S.signupData.referredBy,is_banned:false,joined_at:new Date().toISOString()};
  S.plans=[];
  localStorage.setItem('toxic_pwd_'+userId,pw);

  if(sb){
    try{
      await sb.from("users").insert([{user_id:userId,username:un,email:S.signupData.email||'',phone:S.signupData.phone||'',balance:0,referral_balance:0,invested:0,referral_code:refCode,referred_by:S.signupData.referredBy,is_banned:false}]);
      // Referral bonus
      if(S.signupData.referredBy){
        try{
          var refUser=await sb.from("users").select("*").eq("referral_code",S.signupData.referredBy).limit(1);
          if(refUser.data && refUser.data.length>0){
            var referrer=refUser.data[0];
            var newRefBal=Number(referrer.referral_balance||0)+CONFIG.refBonus;
            await sb.from("users").update({referral_balance:newRefBal}).eq("user_id",referrer.user_id);
          }
        }catch(e){}
      }
    }catch(e){}
  }
  S.tab='dashboard';
  save();
  render();
}

async function doSignIn(){
  var u=$('signinUser').value.trim(), p=$('signinPass').value;
  if(!u||!p) return alert('Enter username and password');
  var existing=JSON.parse(localStorage.getItem('toxic_user')||'null');
  if(existing && existing.username===u){
    var stored=localStorage.getItem('toxic_pwd_'+existing.user_id);
    if(stored && stored!==p) return alert('❌ Incorrect password');
    S.user=existing;
    S.plans=JSON.parse(localStorage.getItem('toxic_plans')||'[]');
    S.tab='dashboard'; save();
    await syncUserData();
    await autoCreditMissedDays();
    render();
    return;
  }
  if(sb){
    try{
      var result=await sb.from("users").select("*").eq("username",u).limit(1);
      if(result.data && result.data.length>0){
        S.user=result.data[0];
        S.tab='dashboard'; save();
        await syncUserData();
        await autoCreditMissedDays();
        render();
        return;
      }
    }catch(e){}
  }
  alert('⚠️ User not found. Sign up first.');
}

function doLogout(){
  if(!confirm('Logout from TOXIC?')) return;
  localStorage.removeItem('toxic_user');
  localStorage.removeItem('toxic_plans');
  S.user=null; S.plans=[]; S.showProfile=false; S.tab='signin';
  render();
}

async function invest(id){
  var p=PLANS.find(function(x){return x.id===id});
  if(!p) return;
  if(isPlanActive(id)) return alert('🔒 Already active.');
  if(Number(S.user.balance)<p.deposit) return alert('💰 Insufficient balance.');
  var now=new Date();
  var newPlan={user_id:S.user.user_id,username:S.user.username,plan_id:p.id,plan_name:p.name,deposit:p.deposit,daily:p.daily,total:p.total,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*DAY).toISOString()};
  S.user.balance=Number(S.user.balance)-p.deposit;
  S.user.invested=Number(S.user.invested||0)+p.deposit;
  if(sb){
    try{
      var r=await sb.from("user_plans").insert([newPlan]).select();
      if(r.data && r.data[0]) newPlan=r.data[0];
      await sb.from("users").update({balance:S.user.balance,invested:S.user.invested}).eq("user_id",S.user.user_id);
    }catch(e){}
  }
  S.plans.unshift(newPlan);
  save(); render();
  alert('🎉 INVESTMENT SUCCESSFUL!\n\nPlan: '+p.name+'\nInvested: $'+p.deposit.toFixed(2)+'\n\n💰 Collect daily reward now!');
}

async function collectPlan(planId){
  var pl=S.plans.find(function(x){return String(x.id)===String(planId)});
  if(!pl) return;
  var plan=PLANS.find(function(x){return x.id===pl.plan_id})||{daily:pl.daily,name:pl.plan_name};
  if(Date.now()<getNextCollect(pl)) return alert('⏳ Not ready yet.');
  if((Number(pl.days_collected)||0)>=40) return alert('Completed!');
  var reward=Number(pl.daily);
  S.user.balance=Number(S.user.balance||0)+reward;
  S.user.earned=Number(S.user.earned||0)+reward;
  pl.days_collected=(Number(pl.days_collected)||0)+1;
  var completed=pl.days_collected>=40;
  if(completed) pl.status='completed';
  S.transactions.unshift({type:'daily_collect',amount:reward,status:'approved',method:plan.name,date:new Date().toISOString()});
  if(sb){
    try{
      await sb.from("user_plans").update({days_collected:pl.days_collected,status:pl.status}).eq("id",pl.id);
      await sb.from("users").update({balance:S.user.balance,earned:S.user.earned}).eq("user_id",S.user.user_id);
    }catch(e){}
  }
  save(); render();
  if(completed) alert('🎉 PLAN COMPLETED!\n\nCollected $'+reward.toFixed(2));
  else alert('💰 COLLECTED $'+reward.toFixed(2)+'!\n\nDay '+pl.days_collected+' / 40');
}

async function submitDeposit(){
  var amt=parseFloat($('depAmt').value);
  var isCrypto=selM!==0;
  var utr=$('depUtr')?$('depUtr').value.trim():'';
  var tx=$('depTx')?$('depTx').value.trim():'';
  var ref=isCrypto?tx:utr;
  if(!amt || amt<CONFIG.minDeposit) return alert('Min deposit $'+CONFIG.minDeposit);
  if(isCrypto && !ref) return alert('Enter TxHash');
  if(!isCrypto && utr.length!==12) return alert('Enter valid 12-digit UTR');
  var method=['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][selM];
  S.transactions.unshift({type:'deposit',amount:amt,ref:ref,status:'pending',method:method,date:new Date().toISOString()});
  if(sb){
    try{ await sb.from("deposits").insert([{user_id:S.user.user_id,username:S.user.username,amount:amt,method:method,ref:ref,status:'pending'}]); }catch(e){}
  }
  save();
  $('depAmt').value='';
  if($('depUtr')) $('depUtr').value='';
  if($('depTx')) $('depTx').value='';
  alert('✅ Deposit submitted! Admin will verify within 24 hours.');
}

async function submitWithdraw(){
  var amt=parseFloat($('wdAmt').value);
  var addr=$('wdAddr').value.trim();
  if(!amt || amt<CONFIG.minWithdraw) return alert('Min $'+CONFIG.minWithdraw);
  if(!addr) return alert('Enter USDT address');
  if(Number(S.user.balance)<amt) return alert('Insufficient balance');
  var fee=amt*CONFIG.withdrawFee;
  S.user.balance-=amt;
  S.transactions.unshift({type:'withdrawal',amount:amt-fee,status:'pending',method:'USDT',date:new Date().toISOString()});
  if(sb){
    try{
      await sb.from("withdrawals").insert([{user_id:S.user.user_id,username:S.user.username,amount:amt-fee,address:addr,status:'pending'}]);
      await sb.from("users").update({balance:S.user.balance}).eq("user_id",S.user.user_id);
    }catch(e){}
  }
  save(); render();
  alert('✅ Withdrawal requested! Amount: $'+fmt(amt-fee));
}

function copyText(text){
  navigator.clipboard.writeText(text).then(function(){alert('✅ Copied!')}).catch(function(){
    var el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);alert('✅ Copied!');
  });
}
