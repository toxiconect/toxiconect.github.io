function haptic(type='light'){
  try{if(window.Telegram?.WebApp?.HapticFeedback){
    if(['success','warning','error'].includes(type)) window.Telegram.WebApp.HapticFeedback.notificationOccurred(type);
    else window.Telegram.WebApp.HapticFeedback.impactOccurred(type==='medium'?'medium':'light');
  }}catch(e){}
  try{if(navigator?.vibrate){navigator.vibrate(type==='success'?[45,50,45]:type==='medium'?55:40);}}catch(e){}
}

function animateCount(elem,start,end,duration=700,prefix='$'){
  if(!elem)return; const range=end-start; let startTime=null;
  function step(t){
    if(!startTime)startTime=t; const progress=Math.min((t-startTime)/duration,1);
    elem.textContent=prefix+fmt(start+(range*progress));
    if(progress<1)requestAnimationFrame(step); else elem.textContent=prefix+fmt(end);
  }
  requestAnimationFrame(step);
}

async function autoCredit(){
  if(!S.user)return; let tot=0; const now=Date.now();
  for(const pl of S.plans){
    if(pl.status==='completed')continue;
    let days=Number(pl.days_collected)||0;
    if(days>=40){pl.status='completed';continue;}
    const st=new Date(pl.started_at).getTime();
    const passed=Math.floor((now-st)/DAY);
    const max=Math.min(passed+1,40);
    const pend=max-days;
    if(pend>0){
      pl.days_collected=days+pend;
      const rw=pend*Number(pl.dly||pl.daily);
      S.user.balance=Number(S.user.balance||0)+rw;
      S.user.earned=Number(S.user.earned||0)+rw;
      tot+=rw;
      if(pl.days_collected>=40){ pl.status='completed'; launchConfetti(); }
      S.tx.unshift({type:'daily_collect',amount:rw,status:'approved',method:pl.plan_name+' x'+pend,date:new Date().toISOString(),plan_id:pl.plan_id});
      if(sb){try{await sb.from('user_plans').update({days_collected:pl.days_collected,status:pl.status}).eq('id',pl.id);}catch(e){}}
    }
  }
  if(tot>0){
    save();
    if(sb){try{await sb.from('users').update({balance:S.user.balance,earned:S.user.earned}).eq('user_id',S.user.user_id);}catch(e){}}
    setTimeout(()=>toast('💰 +$'+fmt(tot)+' Auto-Credited!'),1200);
  }
}

function updateDyn(){
  if(!S.user)return;
  document.querySelectorAll('[data-timer]').forEach(el=>{
    const pid=el.getAttribute('data-timer'); const p=S.plans.find(x=>String(x.id)===String(pid)); if(!p)return;
    const rem=nextC(p)-Date.now();
    if(rem<=0){el.textContent='READY';el.classList.add('text-toxic');}
    else{
      const h=Math.max(0,Math.floor(rem/3600000));
      const m=Math.max(0,Math.floor((rem%3600000)/60000));
      const s=Math.max(0,Math.floor((rem%60000)/1000));
      el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.classList.remove('text-toxic');
    }
  });
  document.querySelectorAll('[data-collect]').forEach(btn=>{
    const pid=btn.getAttribute('data-collect'); const p=S.plans.find(x=>String(x.id)===String(pid)); if(!p)return;
    const ready=Date.now()>=nextC(p)&&Number(p.days_collected)<40;
    btn.disabled=!ready;
    if(ready) btn.textContent='💰 COLLECT $'+Number(p.dly||p.daily).toFixed(2);
    else if(Number(p.days_collected)>=40) btn.textContent='✅ COMPLETED';
    else btn.textContent='⏳ WAITING FOR DAILY COLLECT';
  });
  const b=$('nb'); const un=unread();
  if(b){if(un>0){b.textContent=un;b.style.display='flex';}else b.style.display='none';}
}

function chartUI(){
  const days=[]; const today=new Date(); today.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){ days.push({d:new Date(today.getTime()-i*DAY),e:0,count:0}); }
  S.plans.forEach(pl=>{
    const start=new Date(pl.started_at); start.setHours(0,0,0,0);
    const dailyEarn=Number(pl.dly||pl.daily)||0; const maxDays=Math.min(Number(pl.days_collected)||0,40);
    days.forEach(day=>{
      const diff=Math.floor((day.d.getTime()-start.getTime())/DAY);
      if(diff>=0 && diff<maxDays){ day.e+=dailyEarn; day.count+=1; }
    });
  });
  const max=Math.max(...days.map(x=>x.e),0.01); const dayNames=['S','M','T','W','T','F','S'];
  const bars=days.map((d,i)=>{
    const pct=(d.e/max)*100; const h=pct<8&&d.e>0?8:pct; const isToday=i===6;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:36px">
      <div style="width:100%;display:flex;align-items:flex-end;justify-content:center;height:80px">
        <div class="chart-bar ${isToday?'today':'other'}" style="width:80%;height:${h}%"></div>
      </div>
      <span style="font-size:9px;${isToday?'color:#00FF66;font-weight:900':'color:#666'}">${dayNames[d.d.getDay()]}</span>
      <span class="mono" style="font-size:8px;color:#00FF66;font-weight:700">$${d.e.toFixed(2)}</span>
    </div>`;
  }).join('');
  return `<div class="glass-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <p style="font-size:10px;color:#888;font-weight:800;margin:0;letter-spacing:1.5px">📊 PORTFOLIO · LAST 7 DAYS</p>
      <p class="mono text-toxic" style="font-size:10px;font-weight:800;margin:0">+$${fmt(days.reduce((a,b)=>a+b.e,0))}</p>
    </div>
    <div style="display:flex;align-items:flex-end;gap:8px;min-width:100%;padding:0 4px">${bars}</div>
  </div>`;
}

  S.user.balance=Number(S.user.balance)-p.d; S.user.invested=Number(S.user.invested||0)+p.d;
  
  if(sb){
    try{
      const r=await sb.from('user_plans').insert([np]).select(); if(r.data&&r.data[0]) np=r.data[0];
      await sb.from('users').update({balance:S.user.balance,invested:S.user.invested}).eq('user_id',S.user.user_id);
      if(S.user.referred_by){
        const refUserRes=await sb.from('users').select('*').eq('referral_code', S.user.referred_by).limit(1);
        if(refUserRes.data&&refUserRes.data[0]){
          const parent=refUserRes.data[0]; const comm=p.d*0.10;
          await sb.from('users').update({referral_balance:Number(parent.referral_balance||0)+comm}).eq('user_id',parent.user_id);
        }
      }
    }catch(e){}
  }
  S.plans.unshift(np); haptic('success'); save(); render();
  customAlert('Investment Successful!', `Plan: ${p.n}\nInvested: $${p.d.toFixed(2)}\n\nDaily return starts in 24 hours!`, '🎉');
}

async function collect(pid){
  const pl=S.plans.find(x=>String(x.id)===String(pid)); if(!pl)return;
  if(Date.now()<nextC(pl)) return customAlert('Wait', 'Daily reward not ready yet.', '⏳');
  const rw=Number(pl.dly||pl.daily);
  S.user.balance=Number(S.user.balance||0)+rw; S.user.earned=Number(S.user.earned||0)+rw;
  pl.days_collected=(Number(pl.days_collected)||0)+1; const done=pl.days_collected>=40;
  if(done) pl.status='completed';
  S.tx.unshift({type:'daily_collect',amount:rw,status:'approved',method:pl.plan_name,date:new Date().toISOString(),plan_id:pl.plan_id});
  if(sb){try{await sb.from('user_plans').update({days_collected:pl.days_collected,status:pl.status}).eq('id',pl.id);await sb.from('users').update({balance:S.user.balance,earned:S.user.earned}).eq('user_id',S.user.user_id);}catch(e){}}
  haptic('success'); if(done){launchConfetti(); customAlert('Completed!', `Total return collected: $${rw.toFixed(2)}`, '🎉');} else {customAlert('Collected!', `+$${rw.toFixed(2)} added!`, '💰');}
  save(); render();
}

async function subDep(){
  const amt=parseFloat($('depAmt').value), utr=$('depUtr').value.trim();
  if(!amt) return customAlert('Missing', 'Enter amount.', '⚠️');
  if(utr.length!==12) return customAlert('Invalid UTR', 'Enter valid 12-digit UTR.', '⚠️');
  if(sb) try{await sb.from('deposits').insert([{user_id:S.user.user_id,username:S.user.username,amount:amt/CFG.inrRate,method:'UPI',ref:utr,status:'pending'}]);}catch(e){}
  await syncUser(); render(); $('depAmt').value='';$('depUtr').value=''; haptic('success');
  customAlert('Submitted!', 'Deposit submitted for verification.', '✅');
}

/* INSTANT BALANCE DEDUCTION UPON WITHDRAWAL */
async function subWd(){
  const amt=parseFloat($('wdAmt').value), addr=$('wdAddr').value.trim();
  if(!amt||amt<CFG.minWd) return customAlert('Limit', 'Minimum withdrawal is $'+CFG.minWd, '⚠️');
  if(!addr) return customAlert('Address', 'Enter payout destination.', '⚠️');
  if(Number(S.user.balance)<amt) return customAlert('Low Balance', 'Insufficient balance.', '⚠️');
  
  S.user.balance=Number(S.user.balance)-amt; save(); render();
  if(sb){
    try{
      await sb.from('withdrawals').insert([{user_id:S.user.user_id,username:S.user.username,amount:amt,address:addr,method:'UPI/USDT',status:'pending'}]);
      await sb.from('users').update({balance:S.user.balance}).eq('user_id',S.user.user_id);
    }catch(e){}
  }
  await syncUser(); render(); haptic('success');
  customAlert('Requested!', `Withdrew $${fmt(amt)}. Balance deducted instantly!`, '✅');
}
