let audioCtx=null;
function sound(type){
  if(!S.soundOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const ctx=audioCtx;
    const now=ctx.currentTime;
    const tone=(freq,start,dur,vol)=>{
      vol=vol||0.12;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.value=freq;
      osc.connect(gain);gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0,now+start);
      gain.gain.linearRampToValueAtTime(vol,now+start+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001,now+start+dur);
      osc.start(now+start);osc.stop(now+start+dur);
    };
    if(type==='coin'){tone(880,0,0.1,0.15);tone(1320,0.08,0.15,0.12);}
    else if(type==='success'){tone(523,0,0.1);tone(659,0.09,0.1);tone(784,0.18,0.2,0.15);}
    else if(type==='error'){tone(300,0,0.15,0.12);tone(200,0.12,0.2,0.12);}
    else if(type==='notif'){tone(660,0,0.08,0.1);tone(880,0.08,0.15,0.12);}
    else if(type==='spin'){for(let i=0;i<8;i++)tone(400+i*80,i*0.06,0.05,0.08);}
    else if(type==='tap'){tone(500,0,0.04,0.06);}
    else if(type==='ref'){tone(700,0,0.08,0.12);tone(900,0.08,0.08,0.12);tone(1100,0.16,0.15,0.15);}
  }catch(e){}
}

function animateCount(elem,start,end,duration=700,prefix='$'){
  if(!elem)return;
  const range=end-start;let startTime=null;
  function step(ts){
    if(!startTime)startTime=ts;
    const p=Math.min((ts-startTime)/duration,1);
    elem.textContent=prefix+fmt(start+range*p);
    if(p<1)requestAnimationFrame(step);else elem.textContent=prefix+fmt(end);
  }
  requestAnimationFrame(step);
}

async function spinWheel(){
  if(!S.user)return;
  if(!canSpin())return customAlert('Wait','Come back later to spin again.','⏳');
  const idx=pickPrize();
  const prize=SPIN_PRIZES[idx];
  const sliceAngle=360/SPIN_PRIZES.length;
  const targetAngle=360*5+(360-sliceAngle*idx-sliceAngle/2);
  const wheel=$('spinWheel');
  if(wheel){
    wheel.style.transition='transform 4.5s cubic-bezier(0.15,0.9,0.25,1)';
    wheel.style.transform=`rotate(${targetAngle}deg)`;
  }
  haptic('medium');sound('spin');
  setTimeout(async()=>{
    S.spin.lastSpin=Date.now();
    S.spin.totalSpins=(S.spin.totalSpins||0)+1;
    if(prize.value>0){
      S.user.balance=Number(S.user.balance||0)+prize.value;

      haptic('success');sound('coin');

function updateDyn(){
  if(!S.user)return;
  document.querySelectorAll('[data-timer]').forEach(el=>{
    const pid=el.getAttribute('data-timer');
    const p=S.plans.find(x=>String(x.id)===String(pid));
    if(!p)return;
    const rem=nextC(p)-Date.now();
    if(rem<=0){el.textContent='READY';el.classList.add('text-toxic');}
    else{
      const h=Math.max(0,Math.floor(rem/3600000));
      const m=Math.max(0,Math.floor((rem%3600000)/60000));
      const s=Math.max(0,Math.floor((rem%60000)/1000));
      el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }
  });
  document.querySelectorAll('[data-collect]').forEach(btn=>{
    const pid=btn.getAttribute('data-collect');
    const p=S.plans.find(x=>String(x.id)===String(pid));
    if(!p)return;
    const ready=Date.now()>=nextC(p)&&Number(p.days_collected)<40;
    btn.disabled=!ready;
    if(ready)btn.textContent='💰 COLLECT $'+Number(p.dly||p.daily).toFixed(2);
    else if(Number(p.days_collected)>=40)btn.textContent='✅ COMPLETED';
    else btn.textContent='⏳ WAITING FOR DAILY COLLECT';
  });
  const sb=$('spinBtn');
  if(sb&&!canSpin()){
    const tmr=timeUntilSpin();
    if(tmr)sb.textContent='⏳ Next Spin: '+tmr;
  }
  const b=$('nb');const un=unread();
  if(b){if(un>0){b.textContent=un;b.style.display='flex';}else b.style.display='none';}
}
setInterval(updateDyn,1000);

          S.tab='signin';render();
        },3000);
        return;
      }
      const oldB=Number(S.user.balance||0);
      S.user.balance=Number(f.balance||0);
      S.user.referral_balance=Number(f.referral_balance||0);
      S.user.invested=Number(f.invested||0);
      S.user.earned=Number(f.earned||0);
      if(f.avatar)S.user.avatar=f.avatar;

      if(S.user.referral_balance > 0){
        const rb=S.user.referral_balance;
        S.user.balance = Number(S.user.balance||0) + rb;
        S.user.referral_balance = 0;
        save();
        try{await sb.from('users').update({balance:S.user.balance,referral_balance:0}).eq('user_id',S.user.user_id);}catch(e){}
        setTimeout(()=>{
          haptic('success');sound('ref');launchConfetti();
          customAlert('💎 Referral Bonus Credited!',`+$${fmt(rb)} auto-transferred to your main balance!`,'🎉');
        },500);
      }
      save();
      if($('bal')&&oldB!==S.user.balance)animateCount($('bal'),oldB,S.user.balance);
    }
    const p=await sb.from('user_plans').select('*').eq('user_id',S.user.user_id).order('id',{ascending:false});
    if(p.data)S.plans=p.data;
    const d=await sb.from('deposits').select('*').eq('user_id',S.user.user_id).order('id',{ascending:false});
    const w=await sb.from('withdrawals').select('*').eq('user_id',S.user.user_id).order('id',{ascending:false});

    const sbList=[];
    if(d.data)d.data.forEach(x=>{
      sbList.push({id:'sb_dep_'+x.id,type:'deposit',amount:Number(x.amount),method:x.method||'',ref:x.ref||'',status:(x.status||'pending'),date:x.created_at||new Date().toISOString(),_akey:'deposit_'+Number(x.amount).toFixed(2)});
    });
    if(w.data)w.data.forEach(x=>{
      let cm=x.method;let ca=x.address||'';
      if(!cm){cm=ca.includes(':')?ca.split(':')[0].trim():'USDT';}
      if(ca.includes(':')){ca=ca.split(':')[1].trim();}
      sbList.push({id:'sb_wd_'+x.id,type:'withdrawal',amount:Number(x.amount),method:cm,address:ca,status:(x.status||'pending'),date:x.created_at||new Date().toISOString(),_akey:'withdrawal_'+Number(x.amount).toFixed(2)});
    });

    const sbKeys=new Set(sbList.map(x=>x._akey));
    const finalList=[...sbList];
    S.tx.forEach(local=>{
      const lid=String(local.id||'');
      if(lid.startsWith('sb_dep_')||lid.startsWith('sb_wd_'))return;
      if(local.type==='deposit'||local.type==='withdrawal'){
        const key=local.type+'_'+Number(local.amount).toFixed(2);
        if(sbKeys.has(key))return;
      }
      if(!finalList.find(x=>String(x.id)===lid))finalList.push({...local});
    });
    finalList.forEach(x=>delete x._akey);
    finalList.sort((a,b)=>new Date(b.date)-new Date(a.date));

    S.tx.forEach(old=>{
      if(old.type!=='withdrawal')return;
      const updated=finalList.find(n=>String(n.id)===String(old.id));
      if(!updated)return;
      const oldSt=(old.status||'').toLowerCase();
      const newSt=(updated.status||'').toLowerCase();
      if(oldSt==='pending' && (newSt==='approved'||newSt==='paid'||newSt==='success')){
        haptic('success');sound('notif');
        setTimeout(()=>{launchConfetti();customAlert('✅ Withdrawal Approved!',`$${fmt(updated.amount)} withdrawal has been approved and processed!`,'💰');},800);
      } else if(oldSt==='pending' && (newSt==='rejected'||newSt==='failed')){
        haptic('warning');sound('error');
        setTimeout(()=>{customAlert('❌ Withdrawal Rejected',`Your withdrawal of $${fmt(updated.amount)} was rejected.\n\nBalance refunded. Contact support if needed.`,'⚠️');},800);
      }
    });

    S.tx=finalList;

    if(S.user.referral_code){
      const tm=await sb.from('users').select('username, joined_at, invested, balance').eq('referred_by',S.user.referral_code).order('joined_at',{ascending:false});
      if(tm.data)S.team=tm.data;
    }
    await loadNotifs();
    save();
  }catch(e){console.warn('Sync note:',e);}
  S.syncing=false;
}

  reader.onload=async function(e){

  reader.readAsDataURL(file);
}

function chartUI(){
  const days=[];
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){const d=new Date(today.getTime()-i*DAY);days.push({d:d,e:0,count:0});}
  S.plans.forEach(pl=>{
    const start=new Date(pl.started_at);start.setHours(0,0,0,0);
    const dailyEarn=Number(pl.dly||pl.daily)||0;
    const maxDays=Math.min(Number(pl.days_collected)||0,40);
    days.forEach(day=>{
      const diff=Math.floor((day.d.getTime()-start.getTime())/DAY);
      if(diff>=0 && diff<maxDays){day.e+=dailyEarn;day.count+=1;}
    });
  });
  const max=Math.max(...days.map(x=>x.e),0.01);
  const dayNames=['S','M','T','W','T','F','S'];
  const bars=days.map((d,i)=>{
    const pct=(d.e/max)*100;
    const h=pct<8&&d.e>0?8:pct;
    const isToday=i===6;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:36px">
      <div style="width:100%;display:flex;align-items:flex-end;justify-content:center;height:80px">
        <div class="chart-bar ${isToday?'today':'other'}" style="width:80%;height:${h}%"></div>
      </div>
      <span style="font-size:9px;${isToday?'color:#00FF66;font-weight:900':'color:#666'}">${dayNames[d.d.getDay()]}</span>
      <span class="mono" style="font-size:8px;color:#00FF66;font-weight:700">$${d.e.toFixed(2)}</span>
    </div>`;
  }).join('');
  const todayE=days[6].e;
  const weekE=days.reduce((a,b)=>a+b.e,0);
  return `<div class="glass-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <p style="font-size:10px;color:#888;font-weight:800;margin:0;letter-spacing:1.5px">📊 PORTFOLIO · LAST 7 DAYS</p>
      <p class="mono text-toxic" style="font-size:10px;font-weight:800;margin:0">+$${fmt(weekE)}</p>
    </div>
    <div style="display:flex;align-items:flex-end;gap:8px;min-width:100%;padding:0 4px">${bars}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
      <div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:12px;text-align:center"><p style="font-size:9px;color:#888;margin:0 0 4px">TODAY'S EARNING</p><p class="mono text-toxic" style="font-size:17px;font-weight:900;margin:0">+$${fmt(todayE)}</p></div>
      <div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:12px;text-align:center"><p style="font-size:9px;color:#888;margin:0 0 4px">WEEK EARNING</p><p class="mono" style="font-size:17px;font-weight:900;margin:0;color:#FFD700">+$${fmt(weekE)}</p></div>
    </div>
  </div>`;
}

async function invest(id){
  const p=PLANS.find(x=>x.id===id);if(!p)return;
  if(isActive(id))return customAlert('Plan Active','This plan is already active.','🔒');
  if(Number(S.user.balance)<p.d)return customAlert('Low Balance','Insufficient balance.\n\nRequired: $'+p.d.toFixed(2)+'\nCurrent: $'+fmt(S.user.balance),'💰');
  const now=new Date();
  let np={user_id:S.user.user_id,username:S.user.username,plan_id:p.id,plan_name:p.n,deposit:p.d,daily:p.dly,total:p.t,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*DAY).toISOString()};
  S.user.balance=Number(S.user.balance)-p.d;
  S.user.invested=Number(S.user.invested||0)+p.d;
  if(sb){
    try{
      const r=await sb.from('user_plans').insert([np]).select();
      if(r.data&&r.data[0])np=r.data[0];
      await sb.from('users').update({balance:S.user.balance,invested:S.user.invested}).eq('user_id',S.user.user_id);
      await distributeReferralCommissions(p.d,p.n);
    }catch(e){console.warn('Invest error:',e);}
  }
  S.tx.unshift({type:'deposit',amount:p.d,status:'success',method:'INVEST · '+p.n,date:new Date().toISOString()});
  S.plans.unshift(np);
  haptic('success');sound('success');save();render();
  customAlert('Investment Successful!',`Plan: ${p.n}\nInvested: $${p.d.toFixed(2)}\n\nCollect your daily profit in 24 hours!`,'🎉');
  setTimeout(()=>checkVIPBadgeChange(),1500);
}

async function distributeReferralCommissions(planAmount,planName){
  if(!sb||!S.user||!S.user.referred_by)return;
  const COMMISSIONS=[0.10,0.05,0.02,0.01,0.01,0.01,0.01,0.01,0.01,0.01];
  let currentRefCode=S.user.referred_by;
  let level=1;const visited=[];
  while(currentRefCode && level<=10){
    try{
      const res=await sb.from('users').select('user_id,username,referral_code,referral_balance,referred_by').eq('referral_code',currentRefCode).limit(1);
      if(!res.data||!res.data[0])break;
      const upline=res.data[0];
      if(visited.includes(upline.user_id))break;
      visited.push(upline.user_id);
      const pct=COMMISSIONS[level-1]||0;
      const comm=planAmount*pct;
      if(comm>0){
        await sb.from('users').update({referral_balance:Number(upline.referral_balance||0)+comm}).eq('user_id',upline.user_id);
        try{await sb.from('notifications').insert([{user_id:upline.user_id,title:`💎 Level ${level} Commission!`,message:`You earned $${comm.toFixed(2)} (${(pct*100).toFixed(0)}%) from ${S.user.username}'s ${planName} plan investment of $${planAmount.toFixed(2)}`,type:'bonus',is_read:false}]);}catch(e){}
      }
      currentRefCode=upline.referred_by;
      level++;
    }catch(e){break;}
  }
}

async function collect(pid){
  const pl=S.plans.find(x=>String(x.id)===String(pid));if(!pl)return;
  if(Date.now()<nextC(pl))return customAlert('Wait','Your daily reward is not ready yet.\n\nPlease wait for the timer to complete.','⏳');
  if(Number(pl.days_collected)>=40)return customAlert('Done','This plan cycle is completed.','✅');
  const rw=Number(pl.dly||pl.daily);
  S.user.balance=Number(S.user.balance||0)+rw;
  S.user.earned=Number(S.user.earned||0)+rw;
  pl.days_collected=(Number(pl.days_collected)||0)+1;
  const done=pl.days_collected>=40;
  if(done)pl.status='completed';
  S.tx.unshift({type:'daily_collect',amount:rw,status:'success',method:pl.plan_name,date:new Date().toISOString(),plan_id:pl.plan_id});
  if(sb){try{await sb.from('user_plans').update({days_collected:pl.days_collected,status:pl.status}).eq('id',pl.id);await sb.from('users').update({balance:S.user.balance,earned:S.user.earned}).eq('user_id',S.user.user_id);}catch(e){}}
  haptic('success');sound('coin');
  if(done){launchConfetti();customAlert('Plan Completed!',`Congratulations! Total return collected: $${rw.toFixed(2)}`,'🎉');}
  else customAlert('Reward Collected!',`Collected: $${rw.toFixed(2)}\nDay: ${pl.days_collected} / 40`,'💰');
  save();render();
}

async function redeemCode(){
  const inp=$('promoInput');
  if(!inp)return;
  const code=inp.value.trim().toUpperCase();
  if(!code)return customAlert('Enter Code','Please enter a promo code.','⚠️');
  if(!sb)return customAlert('Offline','Cannot connect to server. Try again.','⚠️');

  try{
    const dup=await sb.from('promo_redemptions').select('id').eq('code',code).eq('user_id',S.user.user_id).limit(1);
    if(dup.data && dup.data.length>0){
      sound('error');
      return customAlert('Already Used','You have already redeemed this code.\n\nEach code can be used only once per user.','ℹ️');
    }
  }catch(e){}

  let promo=null;
  try{
    const r=await sb.from('promo_codes').select('*').eq('code',code).eq('is_active',true).limit(1);
    if(r.data && r.data[0])promo=r.data[0];
  }catch(e){}

  if(!promo){
    sound('error');
    return customAlert('Invalid Code','This promo code is not valid or has expired.\n\nPlease check and try again.','❌');
  }

  if(Number(promo.used_count||0) >= Number(promo.max_uses||100)){
    sound('error');
    return customAlert('Code Expired','This promo code has reached its maximum uses.','⏳');
  }

  const amt=Number(promo.amount||0);
  S.user.balance=Number(S.user.balance||0)+amt;
  S.tx.unshift({type:'bonus',amount:amt,status:'success',method:'Promo · '+code,date:new Date().toISOString()});

  try{
    await sb.from('promo_redemptions').insert([{code:code,user_id:S.user.user_id,amount:amt}]);
    await sb.from('promo_codes').update({used_count:Number(promo.used_count||0)+1}).eq('id',promo.id);
    await sb.from('users').update({balance:S.user.balance}).eq('user_id',S.user.user_id);
  }catch(e){console.warn('Redeem save error:',e);}

  save();
  inp.value='';
  haptic('success');sound('coin');launchConfetti();
  customAlert('🎉 Code Redeemed!',`Code: ${code}\n${promo.label?('Label: '+promo.label+'\n'):''}Bonus: +$${amt.toFixed(2)}\n\nCredited to your balance!`,'🎁');
  await loadPromoCodes();
  render();
}

async function subDep(){
  const amt=parseFloat($('depAmt').value);
  const isC=sM!==0;
  const utr=$('depUtr')?$('depUtr').value.trim():'';
  const tx=$('depTx')?$('depTx').value.trim():'';
  const ref=isC?tx:utr;
  if(!amt)return customAlert('Missing Info','Please enter deposit amount.','⚠️');
  const method=['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][sM];
  const usdAmt=isC?amt:(amt/CFG.inrRate);
  if(usdAmt < CFG.minDep)return customAlert('Minimum Limit',`Minimum deposit is $${CFG.minDep} USD (₹${CFG.minDep*CFG.inrRate} INR).\n\nYour amount: $${usdAmt.toFixed(2)}`,'⚠️');
  if(isC&&!ref)return customAlert('Missing Info','Please enter Transaction Hash.','⚠️');
  if(!isC&&utr.length!==12)return customAlert('Invalid UTR','Please enter a valid 12-digit UTR Number.\n\nExample: 123456789012','⚠️');

  const localId='dep_'+Date.now();
  S.tx.unshift({id:localId,type:'deposit',amount:usdAmt,method:method,ref:ref,status:'pending',date:new Date().toISOString()});
  save();render();

  if(sb){
    try{
      let ins=await sb.from('deposits').insert([{user_id:S.user.user_id,username:S.user.username,amount:usdAmt,method:method,ref:ref,status:'pending'}]);
      if(ins.error && String(ins.error.message||'').toLowerCase().includes('method')){
        ins=await sb.from('deposits').insert([{user_id:S.user.user_id,username:S.user.username,amount:usdAmt,ref:ref,status:'pending'}]);
      }
      if(ins.error) throw ins.error;
    }catch(e){
      console.error('Deposit error:',e);
      S.tx=S.tx.filter(x=>x.id!==localId);
      save();render();
      haptic('error');sound('error');
      showDetailedError('Deposit Failed','Server error: '+(e.message||e),'Please check your internet and try again.','❌');
      return;
    }
  }
  await syncUser();render();
  $('depAmt').value='';if($('depUtr'))$('depUtr').value='';if($('depTx'))$('depTx').value='';$('convBox').style.display='none';
  haptic('success');sound('success');
  customAlert('Deposit Submitted!','Your payment request has been sent for admin verification.\n\nProcessing time: 1-24 hours.','✅');
}

function getTodayWdCount(){
  const today=new Date();today.setHours(0,0,0,0);
  return S.tx.filter(x=>x.type==='withdrawal' && new Date(x.date||x.created_at||0).getTime() >= today.getTime()).length;
}

async function subWd(){
  const amt=parseFloat($('wdAmt').value);
  const addr=$('wdAddr').value.trim();
  const method=S.wdMethod||'USDT';
  if(!amt||amt<CFG.minWd)return customAlert('Minimum Limit',`Minimum withdrawal is $${CFG.minWd}.\n\nYour amount: $${(amt||0).toFixed(2)}`,'⚠️');
  if(!addr)return customAlert('Required',method==='UPI'?'Please enter your UPI ID.\n\nExample: name@upi':'Please enter USDT address.\n\nExample: 0x...','⚠️');
  if(Number(S.user.balance)<amt)return customAlert('Insufficient Funds',`Your balance: $${fmt(S.user.balance)}\nRequired: $${amt.toFixed(2)}\n\nPlease deposit or earn more.`,'⚠️');

  const todayCount=getTodayWdCount();
  if(todayCount >= CFG.maxDailyWd){
    return customAlert('Daily Limit Reached',`You can only make ${CFG.maxDailyWd} withdrawal requests per day.\n\nToday: ${todayCount}/${CFG.maxDailyWd}\n\nPlease try again tomorrow.`,'⏳');
  }

  const fee=amt*CFG.fee/100;const net=amt-fee;
  S.user.balance-=amt;

  const localId='wd_'+Date.now();
  S.tx.unshift({id:localId,type:'withdrawal',amount:net,method:method,address:addr,status:'pending',date:new Date().toISOString()});
  save();render();

  if(sb){
    try{
      let ins=await sb.from('withdrawals').insert([{user_id:S.user.user_id,username:S.user.username,amount:net,address:`${method}: ${addr}`,method:method,status:'pending'}]);
      if(ins.error && String(ins.error.message||'').toLowerCase().includes('method')){
        ins=await sb.from('withdrawals').insert([{user_id:S.user.user_id,username:S.user.username,amount:net,address:`${method}: ${addr}`,status:'pending'}]);
      }
      if(ins.error) throw ins.error;
      const upd=await sb.from('users').update({balance:S.user.balance}).eq('user_id',S.user.user_id);
      if(upd.error) console.warn('Balance sync warning:', upd.error);
    }catch(e){
      console.error('Withdrawal error:',e);
      S.user.balance+=amt;
      S.tx=S.tx.filter(x=>x.id!==localId);
      save();render();
      haptic('error');sound('error');
      showDetailedError('Withdrawal Failed','Server error: '+(e.message||e),'Your balance has been refunded. Please try again.','❌');
      return;
    }
  }
  await syncUser();render();
  haptic('success');sound('success');
  const note=method==='UPI'?`₹${(net*CFG.inrRate).toFixed(2)} INR`:`$${fmt(net)}`;
  const remaining=CFG.maxDailyWd-(todayCount+1);
  customAlert('Withdrawal Requested!',`Method: ${method}\nAmount: $${amt.toFixed(2)}\nFee: $${fee.toFixed(2)}\nNet Receive: ${note}\n\nToday remaining: ${remaining}/${CFG.maxDailyWd}\nProcessing: 1-24 hours`,'✅');
}

function pRow(l,v,green){
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:13px;background:rgba(0,0,0,0.45);border-radius:12px"><span style="font-size:12px;color:#888">${l}</span><span class="mono" style="font-size:12px;font-weight:${green?'900':'500'};color:${green?'#00FF66':'#fff'}">${esc(v)}</span></div>`;

function setLang(l){S.lang=l;save();sound('tap');render();}

function changePw(){
  const o=$('oldPw').value,n=$('newPw').value,n2=$('newPw2').value;
  if(!o||!n||!n2)return customAlert('Required','Please fill all fields','⚠️');
  if(n.length<4)return customAlert('Too Short','Password must be 4+ characters','⚠️');
  if(n!==n2)return customAlert('Mismatch','Passwords do not match','⚠️');
  const st=localStorage.getItem('t_pwd_'+S.user.user_id);
  if(st&&st!==o)return customAlert('Error','Current password is incorrect','❌');
  localStorage.setItem('t_pwd_'+S.user.user_id,n);
  $('oldPw').value='';$('newPw').value='';$('newPw2').value='';
  haptic('success');sound('success');
  customAlert('Success','Password updated successfully!','✅');
}

function copy(text){
  navigator.clipboard.writeText(text).then(()=>{haptic('success');sound('tap');toast('✅ Copied to Clipboard!');}).catch(()=>{
    const el=document.createElement('textarea');el.value=text;
    document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);
    haptic('success');sound('tap');toast('✅ Copied to Clipboard!');
  });
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  if(!localStorage.getItem('t_pwa_dismissed')){
    setTimeout(()=>{const b=$('pwaBanner');if(b)b.classList.add('show');},5000);
  }
});
function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{deferredPrompt=null;dismissPWA();});
  } else {
    customAlert('Install Manually','Tap browser menu (3 dots) → "Add to Home Screen" to install TOXIC as an app.','📲');
    dismissPWA();
  }
}
function dismissPWA(){
  const b=$('pwaBanner');if(b)b.classList.remove('show');
  localStorage.setItem('t_pwa_dismissed','1');
}

let pullStartY=0;
let pulling=false;
let pullDist=0;
const PULL_THRESHOLD=80;
document.addEventListener('touchstart',(e)=>{
  if(window.scrollY<=2 && !S.showProfile && !S.showNotifs && !S.page && S.user){
    pullStartY=e.touches[0].clientY;
    pulling=true;pullDist=0;
  }
},{passive:true});
document.addEventListener('touchmove',(e)=>{
  if(!pulling)return;
  pullDist=e.touches[0].clientY-pullStartY;
  if(pullDist>0 && pullDist<200){
    const ind=$('pullIndicator');
    if(ind){
      ind.classList.add('active');
      const offset=Math.min(pullDist-30,50);
      ind.style.transform=`translateX(-50%) translateY(${offset}px) rotate(${pullDist*3}deg)`;
    }
  }
},{passive:true});
document.addEventListener('touchend',async()=>{
  if(!pulling)return;
  pulling=false;
  const ind=$('pullIndicator');
  if(pullDist>=PULL_THRESHOLD && S.user){
    if(ind){ind.classList.add('spin');ind.textContent='⟳';ind.style.transform='translateX(-50%) translateY(60px)';}
    haptic('medium');sound('tap');
    await loadSiteConfig();await loadPlansFromDB();await syncUser();await loadPromoCodes();await loadCryptoPrices();
    render();
    setTimeout(()=>{
      if(ind){ind.classList.remove('spin','active');ind.textContent='↓';ind.style.transform='translateX(-50%) translateY(-80px)';}
      toast('✅ Updated!');
    },700);
  } else {
    if(ind){ind.classList.remove('active');ind.style.transform='translateX(-50%) translateY(-80px)';}
  }
  pullDist=0;
});
