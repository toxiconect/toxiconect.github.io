<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { background: #050907; background-image: radial-gradient(ellipse at top, rgba(0,255,102,0.08), transparent 50%), radial-gradient(ellipse at bottom right, rgba(16,185,129,0.05), transparent 50%); background-attachment: fixed; color: #fff; font-family: Inter, sans-serif; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
.mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'tnum'; }
.glass-card { background: linear-gradient(145deg, rgba(10,20,15,0.98), rgba(5,10,8,0.99)); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 18px; padding: 16px; box-shadow: 0 20px 40px -20px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
.text-3d { text-shadow: 0 2px 0 rgba(0,255,102,0.4), 0 0 30px rgba(0,255,102,0.5); }
.text-toxic { color: #00FF66; }
.bg-toxic { background: #00FF66; }
.glow { box-shadow: 0 0 30px rgba(0,255,102,0.35); }
.btn-green { background: linear-gradient(135deg, #00FF66, #10B981); color: #000; font-weight: 800; letter-spacing: 0.3px; transition: all 0.15s; border: none; cursor: pointer; }
.btn-green:active { transform: scale(0.97); }
.btn-green:disabled { opacity: 0.5; cursor: not-allowed; }
.card-gradient { background: linear-gradient(160deg, rgba(0,255,102,0.14), rgba(9,14,11,0.99) 65%); }
.inp { background: rgba(0,0,0,0.45); border: 1.5px solid rgba(16, 185, 129, 0.2); border-radius: 12px; padding: 11px 14px; color: #fff; outline: none; width: 100%; font-size: 14px; font-family: inherit; transition: all 0.2s; }
.inp:focus { border-color: rgba(0, 255, 102, 0.6); box-shadow: 0 0 0 3px rgba(0, 255, 102, 0.08); }
.inp::placeholder { color: #4B5563; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 448px; margin: 0 auto; z-index: 50; background: rgba(5,9,7,0.98); backdrop-filter: blur(30px); border-top: 1px solid rgba(0,255,102,0.1); padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 14px; cursor: pointer; color: #6B7280; transition: all 0.2s; position: relative; }
.nav-item.active { color: #00FF66; }
.nav-item.active::before { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 28px; height: 3px; background: #00FF66; border-radius: 0 0 3px 3px; box-shadow: 0 0 12px #00FF66; }
.plan-card { background: linear-gradient(160deg, rgba(0,0,0,0.75), rgba(9,18,14,0.98)); border: 1.5px solid rgba(0,255,102,0.12); border-radius: 20px; padding: 16px; position: relative; overflow: hidden; cursor: pointer; transition: all 0.25s; }
.plan-card:active { transform: scale(0.97); }
.plan-card.locked { opacity: 0.65; cursor: default; }
.plan-card.locked::after { content: '✓ ACTIVE'; position: absolute; top: 12px; right: 12px; background: linear-gradient(135deg, #00FF66, #10B981); color: #000; font-size: 9px; font-weight: 900; padding: 5px 10px; border-radius: 20px; box-shadow: 0 0 20px rgba(0,255,102,0.7); z-index: 10; letter-spacing: 0.5px; }
.plan-active { position: relative; overflow: hidden; border-radius: 18px; padding: 16px; background: linear-gradient(145deg, rgba(0,255,102,0.12), rgba(7,14,10,0.99) 75%); border: 1.5px solid rgba(0,255,102,0.4); box-shadow: 0 0 24px rgba(0,255,102,0.12); margin-bottom: 12px; }
.plan-active::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(0,255,102,0.22), transparent 70%); pointer-events: none; }
.plan-active::after { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent); animation: shine 3.5s infinite; pointer-events: none; }
@keyframes shine { 0% { left: -100%; } 60%, 100% { left: 200%; } }
.avatar { background: linear-gradient(135deg, #00FF66, #10B981); padding: 2px; border-radius: 50%; position: relative; }

.avatar-in img { width: 100%; height: 100%; object-fit: cover; }
.btn-invest { background: linear-gradient(180deg, #00FF66, #10B981); color: #000; font-weight: 900; border-radius: 12px; border: none; padding: 11px; width: 100%; cursor: pointer; font-size: 11px; box-shadow: 0 4px 0 #0a5c3a, 0 6px 20px rgba(0,255,102,0.4); transition: all 0.1s; position: relative; z-index: 20; }

.btn-invest.locked { background: linear-gradient(180deg, #2a2a2a, #1a1a1a); color: #666; cursor: not-allowed; box-shadow: 0 4px 0 #0a0a0a; }
.collect-btn { background: linear-gradient(135deg, #00FF66, #10B981); color: #000; font-weight: 900; box-shadow: 0 0 35px rgba(0,255,102,0.55); animation: cpa 2s infinite; transition: all 0.2s; }
@keyframes cpa { 0%,100% { box-shadow: 0 0 20px rgba(0,255,102,0.4); } 50% { box-shadow: 0 0 50px rgba(0,255,102,0.9); } }

.timer-glow { text-shadow: 0 0 30px rgba(0,255,102,0.8); }
.modal-in { animation: min 0.35s cubic-bezier(0.34,1.56,0.64,1); }

.loading { position: fixed; inset: 0; background: #050907; background-image: radial-gradient(circle at center, rgba(0,255,102,0.10), transparent 65%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s, visibility 0.6s; overflow: hidden; }
.loading.hide { opacity: 0; visibility: hidden; }

.l-logo-wrap { position: relative; display: inline-block; }
.l-logo { animation: ll 2s infinite; }
@keyframes ll { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(0,255,102,0.5)); } 50% { transform: scale(1.04); filter: drop-shadow(0 0 40px rgba(0,255,102,0.8)); } }
.l-bar { width: 220px; height: 4px; background: rgba(0,255,102,0.15); border-radius: 4px; margin-top: 26px; overflow: hidden; position: relative; }

.l-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: sweepBar 1.2s infinite; }
@keyframes sweepBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.l-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #00FF66; margin-top: 12px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0,255,102,0.8); }
.live-b { position: fixed; bottom: 100px; left: 12px; right: 12px; max-width: 420px; margin: 0 auto; background: linear-gradient(135deg, rgba(9,18,14,0.98), rgba(5,12,8,0.99)); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,102,0.45); border-radius: 16px; padding: 12px 16px; z-index: 45; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; transform: translateY(180%); opacity: 0; display: flex; align-items: center; gap: 12px; box-shadow: 0 15px 40px rgba(0,255,102,0.25); }
.live-b.show { transform: translateY(0); opacity: 1; }
.l-av { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #00FF66, #10B981); display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; font-size: 15px; flex-shrink: 0; }
.l-tx { font-size: 11px; color: #ddd; line-height: 1.4; flex: 1; }

.toast { position: fixed; bottom: 165px; left: 50%; transform: translateX(-50%) translateY(40px); background: linear-gradient(135deg, #00FF66, #10B981); color: #000; font-weight: 800; padding: 12px 24px; border-radius: 14px; font-size: 13px; z-index: 70; transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 15px 45px rgba(0,255,102,0.6); opacity: 0; pointer-events: none; max-width: 88%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.nbadge { position: absolute; top: -5px; right: -5px; background: #EF4444; color: #fff; font-size: 9px; font-weight: 900; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid #050907; box-shadow: 0 0 10px rgba(239,68,68,0.6); }
.nitem { padding: 16px; background: rgba(0,0,0,0.4); border-radius: 14px; margin-bottom: 10px; border-left: 3px solid #10B981; }
.nitem.warning { border-left-color: #FBBF24; background: rgba(251,191,36,0.07); }

.nitem.update { border-left-color: #60A5FA; background: rgba(96,165,250,0.07); }
.nitem.unread { box-shadow: 0 0 20px rgba(0,255,102,0.18); }
.chart-bar { border-radius: 6px 6px 0 0; transition: all 0.3s ease; position: relative; min-height: 3px; }
.chart-bar.today { background: linear-gradient(180deg, #00FF66, #10B981); box-shadow: 0 0 20px rgba(0,255,102,0.7); }
.chart-bar.other { background: linear-gradient(180deg, rgba(0,255,102,0.5), rgba(0,255,102,0.1)); }
.news-scroll { white-space: nowrap; display: inline-block; animation: newsAnim 22s linear infinite; }
@keyframes newsAnim { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
.hide-scroll::-webkit-scrollbar { display: none; }
.hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
.page-overlay { position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,0.95); backdrop-filter: blur(14px); overflow-y: auto; padding: 20px; }
.page-content { max-width: 640px; margin: 0 auto; background: linear-gradient(145deg, rgba(13,24,18,0.98), rgba(7,13,10,0.99)); border: 1px solid rgba(0,255,102,0.2); border-radius: 24px; padding: 24px; }
.page-content h1 { font-size: 24px; font-weight: 900; color: #00FF66; margin: 0 0 6px; }

.page-content p, .page-content li { font-size: 13px; color: #ccc; line-height: 1.7; margin: 6px 0; }

.skel { background: linear-gradient(90deg, rgba(0,255,102,0.05) 25%, rgba(0,255,102,0.15) 50%, rgba(0,255,102,0.05) 75%); background-size: 200% 100%; animation: shim 1.4s infinite; border-radius: 14px; }
@keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
#pullIndicator { position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-80px); width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #00FF66, #10B981); display: flex; align-items: center; justify-content: center; color: #000; font-size: 22px; font-weight: 900; z-index: 999; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; box-shadow: 0 0 30px rgba(0,255,102,0.6); opacity: 0; pointer-events: none; }
#pullIndicator.active { opacity: 1; }
#pullIndicator.spin { animation: spinR 0.9s linear infinite; }
@keyframes spinR { to { transform: translateX(-50%) rotate(360deg); } }
.cyber-ticker { position: relative; background: linear-gradient(135deg, rgba(0,20,10,0.95), rgba(0,10,5,0.98)); border: 1px solid rgba(0,255,102,0.35); border-radius: 14px; padding: 9px 0; overflow: hidden; box-shadow: 0 0 20px rgba(0,255,102,0.12), inset 0 0 20px rgba(0,255,102,0.04); }
.cyber-ticker::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent 3px, rgba(0,255,102,0.04) 3px, rgba(0,255,102,0.04) 4px); pointer-events: none; z-index: 1; }
.cyber-ticker::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,102,0.8), transparent); animation: scan 3s linear infinite; }
@keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.cyber-ticker > div { display: flex; white-space: nowrap; animation: scrollL 32s linear infinite; position: relative; z-index: 2; }
.cyber-ticker > div > div { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-right: 1px solid rgba(0,255,102,0.12); }
@keyframes scrollL { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.combined-ticker { position: relative; background: linear-gradient(135deg, rgba(30,20,0,0.75), rgba(5,10,5,0.98) 50%, rgba(0,20,10,0.75)); border: 1px solid rgba(255,215,0,0.35); border-radius: 14px; padding: 10px 14px; overflow: hidden; box-shadow: 0 0 22px rgba(255,215,0,0.12); }
.combined-row { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; }
.winner-scroll { white-space: nowrap; display: inline-flex; animation: winnerAnim 45s linear infinite; }
@keyframes winnerAnim { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.emoji-3d { display: inline-block; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.7)) drop-shadow(0 0 6px rgba(0,255,102,0.25)); transform: translateY(-1px); }
.ach-btn { padding: 5px 3px; border-radius: 9px; font-size: 8px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; border-width: 1px; border-style: solid; }

.ach-card.unlocked { background: linear-gradient(135deg, rgba(0,255,102,0.12), rgba(0,0,0,0.5)); border-color: rgba(0,255,102,0.35); box-shadow: 0 0 20px rgba(0,255,102,0.1); }

.switch.on { background: linear-gradient(135deg, #00FF66, #10B981); border-color: #00FF66; }

.netbtn { padding: 10px; font-weight: 800; text-align: center; cursor: pointer; border-radius: 12px; font-size: 11px; transition: all 0.2s; border: 1.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #888; }

.lang-btn.active { background: linear-gradient(135deg, #00FF66, #10B981); color: #000; border-color: #00FF66; }

.promo-card::before { content: '🎁'; position: absolute; top: -10px; right: -10px; font-size: 60px; opacity: 0.08; }

function safeBtoa(s) {
  try {
    const bytes = new TextEncoder().encode(String(s));
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin);
  } catch(e) { return ''; }

function safeAtob(s) {

function isValidUTR(utr) {
  if (!utr || utr.length !== 12) return false;
  if (!/^\d{12}$/.test(utr)) return false;
  if (/^(\d)\1{11}$/.test(utr)) return false;
  if (utr === '000000000000') return false;
  const asc = '0123456789012345678901234567890123456789';
  const desc = '9876543210987654321098765432109876543210';
  if (asc.includes(utr) || desc.includes(utr)) return false;
  return true;
}

let audioCtx = null;
function sound(type) {
  if (!S.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx; const now = ctx.currentTime;
    const tone = (freq, start, dur, vol) => {
      vol = vol || 0.12;
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0, now + start);
      gain.gain.linearRampToValueAtTime(vol, now + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
      osc.start(now + start); osc.stop(now + start + dur);
    };
    if (type === 'coin') { tone(880, 0, 0.1, 0.15); tone(1320, 0.08, 0.15, 0.12); }
    else if (type === 'success') { tone(523, 0, 0.1); tone(659, 0.09, 0.1); tone(784, 0.18, 0.2, 0.15); }
    else if (type === 'error') { tone(300, 0, 0.15, 0.12); tone(200, 0.12, 0.2, 0.12); }
    else if (type === 'notif') { tone(660, 0, 0.08, 0.1); tone(880, 0.08, 0.15, 0.12); }
    else if (type === 'spin') { for (let i=0; i<8; i++) tone(400 + i*80, i*0.06, 0.05, 0.08); }
    else if (type === 'tap') { tone(500, 0, 0.04, 0.06); }
    else if (type === 'ref') { tone(700, 0, 0.08, 0.12); tone(900, 0.08, 0.08, 0.12); tone(1100, 0.16, 0.15, 0.15); }
  } catch(e) {}
}

  function step(ts) {

function rotateCombinedTicker() {
  if (TICKER_ACTIVE) return;
  TICKER_ACTIVE = true;
  const run = () => {
    if (!S.user) { TICKER_ACTIVE = false; return; }
    if (S.tab !== 'dashboard' || S.showProfile || S.showNotifs || S.page) { setTimeout(run, 3000); return; }
    const w = $('cRowWinner'), n = $('cRowNews');
    if (!w || !n) { setTimeout(run, 3000); return; }
    w.style.display = 'flex'; n.style.display = 'none';
    setTimeout(() => {
      const w2 = $('cRowWinner'), n2 = $('cRowNews');
      if (!w2 || !n2) { setTimeout(run, 3000); return; }
      w2.style.display = 'none'; n2.style.display = 'flex';
      setTimeout(run, 5000);
    }, 10000);
  };
  run();
}

async function checkTeamMilestones() {
  if (!S.user || !S.team) return;
  const count = S.team.filter(t => Number(t.invested||0) > 0).length;
  for (let i = 0; i < TEAM_MILESTONES.length; i++) {
    const m = TEAM_MILESTONES[i];
    if (count >= m.size && !S.milestones.claimed.includes(i)) {
      if (sb) {
        try {
          const chk = await sb.from('users').select('milestones_claimed').eq('user_id', S.user.user_id).limit(1);
          if (chk.data && chk.data[0] && chk.data[0].milestones_claimed) {
            const remote = JSON.parse(chk.data[0].milestones_claimed);
            if (Array.isArray(remote) && remote.includes(i)) { S.milestones.claimed = remote; continue; }
          }
        } catch(e) {}
      }
      S.milestones.claimed.push(i);
      S.user.balance = Number(S.user.balance||0) + m.reward;
      S.tx.unshift({type:'milestone', amount:m.reward, status:'success', method:`Team Milestone · ${m.label}`, date:new Date().toISOString()});
      save();
      if (sb) {
        try { await sb.from('users').update({balance:S.user.balance, milestones_claimed: JSON.stringify(S.milestones.claimed)}).eq('user_id', S.user.user_id); } catch(e) {}
      }
      setTimeout(() => { launchConfetti(); sound('success'); customAlert('🏆 Milestone Achieved!', `Team Size: ${m.label}\nBonus: +$${m.reward.toFixed(2)}`, '🎉'); }, 800);
      break;
    }
  }
}

function canSpin() { if (!S.spin.lastSpin) return true; return Date.now() - S.spin.lastSpin >= DAY; }
function timeUntilSpin() {
  if (canSpin()) return null;
  const rem = DAY - (Date.now() - S.spin.lastSpin);
  const h = Math.floor(rem / 3600000); const m = Math.floor((rem % 3600000) / 60000); const s = Math.floor((rem % 60000) / 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function pickPrize() {
  const total = SPIN_PRIZES.reduce((a,b) => a + b.w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SPIN_PRIZES.length; i++) { r -= SPIN_PRIZES[i].w; if (r <= 0) return i; }
  return 0;
}
async function spinWheel() {
  if (!S.user) return;
  if (SPIN_LOCK) return;
  if (!canSpin()) return customAlert('Wait', 'Come back later to spin again.', '⏳');
  SPIN_LOCK = true;
  const idx = pickPrize(); const prize = SPIN_PRIZES[idx];
  const sliceAngle = 360 / SPIN_PRIZES.length;
  const targetAngle = 360 * 5 + (360 - sliceAngle * idx - sliceAngle / 2);
  const wheel = $('spinWheel');
  if (wheel) { wheel.style.transition = 'transform 4.5s cubic-bezier(0.15,0.9,0.25,1)'; wheel.style.transform = `rotate(${targetAngle}deg)`; }
  haptic('medium'); sound('spin');
  setTimeout(async () => {
    S.spin.lastSpin = Date.now(); S.spin.totalSpins = (S.spin.totalSpins||0) + 1;
    if (prize.value > 0) {
      S.user.balance = Number(S.user.balance||0) + prize.value;
      S.tx.unshift({type:'spin', amount:prize.value, status:'success', method:'Spin & Win', date:new Date().toISOString()});
      save();
      if (sb) { try { await sb.from('users').update({balance:S.user.balance}).eq('user_id', S.user.user_id); } catch(e) {} }
      haptic('success'); sound('coin'); showCoinAnim(prize.value);
      if (prize.value >= 0.20) { launchConfetti(); customAlert('🎉 YOU WON!', `+$${prize.value.toFixed(2)} added to your balance!`, '🏆'); }
      else customAlert('🎊 You Won!', `+$${prize.value.toFixed(2)} added!`, '💰');
    } else { save(); customAlert('Try Again', 'Better luck next time!', '😅'); }
    SPIN_LOCK = false;
    render();
  }, 4600);
}
function spinUI() {
  if (!S.user) return '';
  const can = canSpin();
  const size = 180;
  const sliceAngle = 360 / SPIN_PRIZES.length;
  let stops = [];
  SPIN_PRIZES.forEach((p, i) => { const start = i * sliceAngle, end = (i + 1) * sliceAngle; stops.push(`${p.c} ${start}deg ${end}deg`); });
  const conic = `conic-gradient(${stops.join(',')})`;
  let labels = '';
  SPIN_PRIZES.forEach((p, i) => {
    const angle = i * sliceAngle + sliceAngle / 2 - 90;
    const rad = angle * Math.PI / 180;
    const r = size * 0.32;
    const x = size / 2 + Math.cos(rad) * r;
    const y = size / 2 + Math.sin(rad) * r;
    labels += `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none">${p.label}</div>`;
  });
  const tmr = timeUntilSpin();
  return `<div class="glass-card" style="border:1.5px solid rgba(255,215,0,0.35);box-shadow:0 0 25px rgba(255,215,0,0.12)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><p style="font-size:10px;color:#FFD700;font-weight:800;margin:0;letter-spacing:1.5px">🎡 SPIN & WIN</p><p style="font-size:11px;color:#888;margin:3px 0 0">1 free spin every 24 hours</p></div>
      <div style="background:rgba(255,215,0,0.15);border:1px solid rgba(255,215,0,0.4);padding:5px 12px;border-radius:20px"><p style="font-size:9px;color:#FFD700;font-weight:900;margin:0">🎯 $0.01 - $0.50</p></div>
    </div>
    <div style="display:flex;justify-content:center;padding:10px 0 16px">
      <div style="position:relative;width:${size}px;height:${size}px">
        <div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:28px;z-index:5;filter:drop-shadow(0 0 10px #00FF66)">▼</div>
        <div id="spinWheel" style="width:100%;height:100%;border-radius:50%;background:${conic};position:relative;border:4px solid #FFD700;box-shadow:0 0 40px rgba(255,215,0,0.6),inset 0 0 20px rgba(0,0,0,0.5)">${labels}<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#FFD700,#B8860B);border:3px solid #fff;box-shadow:0 0 15px rgba(255,215,0,0.9)"></div></div>
      </div>
    </div>
    <button onclick="spinWheel()" ${can?'':'disabled'} class="btn-green" style="width:100%;padding:14px;border-radius:14px;font-size:13px">${can ? '🎡 SPIN NOW (FREE)' : '⏳ Next Spin: ' + (tmr || '00:00:00')}</button>
    ${S.spin.totalSpins > 0 ? `<p style="font-size:10px;color:#888;text-align:center;margin:10px 0 0">Total Spins: ${S.spin.totalSpins}</p>` : ''}
  </div>`;
}

async function checkAchievements() {
  if (!S.user) return;
  const unlocked = [];
  for (const a of ACHIEVEMENTS) {
    if (S.achievements.includes(a.id)) continue;
    try { if (a.check(S.user, S.team || [], S.plans || [])) { S.achievements.push(a.id); unlocked.push(a); } } catch(e) {}
  }
  if (unlocked.length > 0) {
    save();
    if (sb) { try { await sb.from('users').update({achievements: JSON.stringify(S.achievements)}).eq('user_id', S.user.user_id); } catch(e) {} }
    unlocked.forEach((a, idx) => {
      setTimeout(() => { launchConfetti(); sound('success'); customAlert(`${a.icon} Achievement Unlocked!`, `${a.name}\n\n${a.desc}`, '🏆'); }, 800 + idx * 1500);
    });
  }
}

function updateDyn() {
  if (!S.user) return;
  document.querySelectorAll('[data-timer]').forEach(el => {
    const pid = el.getAttribute('data-timer');
    const p = S.plans.find(x => String(x.id) === String(pid));
    if (!p) return;
    const rem = nextC(p) - Date.now();
    if (rem <= 0) { el.textContent = 'READY'; el.classList.add('text-toxic'); }
    else { const h = Math.max(0, Math.floor(rem / 3600000)); const m = Math.max(0, Math.floor((rem % 3600000) / 60000)); const s = Math.max(0, Math.floor((rem % 60000) / 1000)); el.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
  });
  document.querySelectorAll('[data-collect]').forEach(btn => {
    const pid = btn.getAttribute('data-collect');
    const p = S.plans.find(x => String(x.id) === String(pid));
    if (!p) return;
    const ready = Date.now() >= nextC(p) && Number(p.days_collected) < 40;
    btn.disabled = !ready;
    const rem = nextC(p) - Date.now();
    const h = Math.max(0, Math.floor(rem / 3600000)); const m = Math.max(0, Math.floor((rem % 3600000) / 60000)); const s = Math.max(0, Math.floor((rem % 60000) / 1000));
    const tmrStr = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (ready) btn.textContent = '💰 COLLECT $' + Number(p.dly || p.daily).toFixed(2);
    else if (Number(p.days_collected) >= 40) btn.textContent = '✅ COMPLETED';

}

      }

      S.user.referral_balance = Number(f.referral_balance||0);
      S.user.invested = Number(f.invested||0);
      S.user.earned = Number(f.earned||0);

      if (f.email) S.user.email = f.email;
      if (f.milestones_claimed) { try { const p = JSON.parse(f.milestones_claimed); if (Array.isArray(p)) S.milestones.claimed = p; } catch(e) {} }
      if (f.achievements) { try { const p = JSON.parse(f.achievements); if (Array.isArray(p)) S.achievements = p; } catch(e) {} }
      if (f.auto_renew !== undefined && f.auto_renew !== null) { S.autoRenew = !!f.auto_renew; localStorage.setItem('t_autorenew', S.autoRenew ? '1' : '0'); }
      save();
      if ($('bal') && oldB !== S.user.balance) animateCount($('bal'), oldB, S.user.balance);
    }
    const p = await sb.from('user_plans').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    if (p.data && Array.isArray(p.data)) {
      S.plans = p.data.map(pl => {
        const days = Number(pl.days_collected) || 0;
        const started = new Date(pl.started_at).getTime();
        const expired = Date.now() >= started + 40 * DAY;
        if ((days >= 40 || expired) && pl.status !== 'completed') {
          try { sb.from('user_plans').update({status:'completed'}).eq('id', pl.id); } catch(e) {}
          return {...pl, status:'completed'};
        }
        return pl;
      });
      if (S.autoRenew) {
        const renewedIds = JSON.parse(localStorage.getItem('t_renewed_plans') || '[]');
        const completedPlans = S.plans.filter(pl => pl.status === 'completed' && !renewedIds.includes(String(pl.id)) && Number(S.user.balance) >= Number(pl.deposit));
        if (completedPlans.length > 0) setTimeout(() => autoRenewCombined(completedPlans), 1500);
      }
    }
    const d = await sb.from('deposits').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    const w = await sb.from('withdrawals').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    const sbList = [];
    if (d.data) d.data.forEach(x => {
      const created = x.created_at || new Date().toISOString();
      let status = x.status || 'pending';
      if (status === 'pending' && Date.now() - new Date(created).getTime() > DAY) status = 'expired';
      sbList.push({ id:'sb_dep_'+x.id, type:'deposit', amount:Number(x.amount), method:x.method||'', ref:x.ref||'', status, date:created, _akey: 'deposit_' + Number(x.amount).toFixed(2) + '_' + created.slice(0, 16) + '_' + (x.method||'') });
    });
    if (w.data) w.data.forEach(x => {
      let cm = x.method; let ca = x.address || '';
      if (!cm) cm = ca.includes(':') ? ca.split(':')[0].trim() : 'USDT';
      if (ca.includes(':')) ca = ca.split(':')[1].trim();
      const created = x.created_at || new Date().toISOString();
      sbList.push({ id:'sb_wd_'+x.id, type:'withdrawal', amount:Number(x.amount), method:cm, address:ca, status:(x.status||'pending'), date:created, _akey: 'withdrawal_' + Number(x.amount).toFixed(2) + '_' + created.slice(0, 16) + '_' + cm });
    });
    const sbKeys = new Set(sbList.map(x => x._akey));
    const finalList = [...sbList];
    S.tx.forEach(local => {
      const lid = String(local.id || '');
      if (lid.startsWith('sb_dep_') || lid.startsWith('sb_wd_')) return;
      if (local.type === 'deposit' || local.type === 'withdrawal') {
        const created = local.date || new Date().toISOString();
        const key = local.type + '_' + Number(local.amount).toFixed(2) + '_' + created.slice(0, 16) + '_' + (local.method || '');
        if (sbKeys.has(key)) return;
      }
      if (!finalList.find(x => String(x.id) === lid)) finalList.push({...local});
    });
    finalList.forEach(x => delete x._akey);
    finalList.sort((a,b) => new Date(b.date) - new Date(a.date));
    S.tx.forEach(old => {
      if (old.type !== 'withdrawal' && old.type !== 'deposit') return;
      const updated = finalList.find(n => String(n.id) === String(old.id));
      if (!updated) return;
      const oldSt = (old.status || '').toLowerCase(); const newSt = (updated.status || '').toLowerCase();
      const label = old.type === 'withdrawal' ? 'Withdrawal' : 'Deposit';

      } else if (oldSt === 'pending' && ['rejected','failed'].includes(newSt)) {
        haptic('warning'); sound('error');
        setTimeout(() => { customAlert(`❌ ${label} Rejected`, `$${fmt(updated.amount)} was rejected.`, '⚠️'); }, 800);
        sendPush(`❌ ${label} Rejected`, `$${fmt(updated.amount)} was rejected`);
      }
    });
    S.tx = finalList;
    if (S.user.referral_code) {
      const tm = await sb.from('users').select('username, joined_at, invested, balance').eq('referred_by', S.user.referral_code).order('joined_at', {ascending:false});

        localStorage.setItem('t_last_team', String(currentCount));
      }
    }
    await loadNotifs();
    save();
    checkTeamMilestones();
    checkAchievements();
  } catch(e) { console.warn('Sync note:', e); }
  S.syncing = false; SYNC_LOCK = false;
  updateDyn();
}

async function autoRenewCombined(completedPlans) {
  if (!S.autoRenew || !S.user || completedPlans.length === 0) return;
  const totalCost = completedPlans.reduce((s, p) => s + Number(p.deposit), 0);
  const bal = Number(S.user.balance || 0);
  if (bal < totalCost) {
    if (sb) { try { await sb.from('notifications').insert([{user_id:S.user.user_id, title:'⚠️ Auto-Renew Skipped', message:`${completedPlans.length} completed plan(s) could not auto-renew due to insufficient balance.`, type:'warning', is_read:false}]); } catch(e) {} }
    const renewedIds = JSON.parse(localStorage.getItem('t_renewed_plans') || '[]');
    completedPlans.forEach(p => { if (!renewedIds.includes(String(p.id))) renewedIds.push(String(p.id)); });
    localStorage.setItem('t_renewed_plans', JSON.stringify(renewedIds));
    return;
  }
  const planNames = completedPlans.map(p => p.plan_name).join(', ');
  customConfirm('🔄 Auto-Renew Plans?', `${completedPlans.length} completed plan(s) can be renewed:\n\n${planNames}\n\nTotal: $${fmt(totalCost)}\nBalance: $${fmt(bal)}`, async () => {
    let renewedCount = 0;
    const renewedIds = JSON.parse(localStorage.getItem('t_renewed_plans') || '[]');
    for (const cp of completedPlans) {
      const planDef = PLANS.find(x => x.id === cp.plan_id);
      if (!planDef) continue;
      if (Number(S.user.balance) < Number(cp.deposit)) continue;
      const now = new Date();
      const np = { user_id:S.user.user_id, username:S.user.username, plan_id:planDef.id, plan_name:planDef.n, deposit:planDef.d, daily:planDef.dly, total:planDef.t, days_collected:0, status:'active', started_at:now.toISOString(), expires_at:new Date(now.getTime() + 40 * DAY).toISOString(), last_collect_at: null };
      S.user.balance -= planDef.d;
      S.user.invested = Number(S.user.invested||0) + planDef.d;
      S.tx.unshift({type:'deposit', amount:planDef.d, status:'success', method:'AUTO-RENEW · ' + planDef.n, date:new Date().toISOString()});
      try {
        if (sb) {
          const r = await sb.from('user_plans').insert([np]).select();
          if (r.data && r.data[0]) S.plans.unshift(r.data[0]); else S.plans.unshift({...np, id: 'local_' + Date.now()});
          await sb.from('users').update({balance:S.user.balance, invested:S.user.invested}).eq('user_id', S.user.user_id);
        } else S.plans.unshift({...np, id: 'local_' + Date.now()});
        if (!renewedIds.includes(String(cp.id))) renewedIds.push(String(cp.id));
        renewedCount++;
      } catch(e) { console.warn('Renew err:', e); }
    }
    localStorage.setItem('t_renewed_plans', JSON.stringify(renewedIds));
    save(); render();
    if (renewedCount > 0) { haptic('success'); sound('success'); launchConfetti(); customAlert('🔄 Plans Renewed!', `${renewedCount} plan(s) have been auto-renewed!`, '🎉'); }
  }, '🔄');
  setTimeout(() => {
    const ids = JSON.parse(localStorage.getItem('t_renewed_plans') || '[]');
    completedPlans.forEach(p => { if (!ids.includes(String(p.id))) ids.push(String(p.id)); });
    localStorage.setItem('t_renewed_plans', JSON.stringify(ids));
  }, 30000);
}

function handleAvatarUpload(event) {
  const file = event.target.files[0]; if (!file) return;
  if (file.size > 2.5 * 1024 * 1024) return customAlert('File Too Large', 'Photo must be less than 2.5MB.', '⚠️');
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 200; const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
      S.user.avatar = compressedBase64; save();
      haptic('success'); sound('success'); toast('✅ Profile Photo Updated!'); render();
      if (sb && S.user) { try { await sb.from('users').update({avatar: compressedBase64}).eq('user_id', S.user.user_id); } catch(err) {} }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// FIX #5: show error if server insert fails (no silent ghost account)
async function finishSignup() {
  const un = $('un').value.trim(), pw = $('pw').value, pw2 = $('pw2').value;
  if (!un || un.length < 3) return customAlert('Invalid Username', 'Username must be at least 3 characters.', '⚠️');
  if (!pw || pw.length < 4) return customAlert('Weak Password', 'Password must be at least 4 characters.', '⚠️');
  if (pw !== pw2) return customAlert('Mismatch', 'Passwords do not match.', '⚠️');
  if (!S.otpVerified) return customAlert('Email Not Verified', 'Please verify your email first.', '⚠️');
  if (sb) {
    try {
      const checkUser = await sb.from('users').select('username').eq('username', un).limit(1);
      if (checkUser.data && checkUser.data.length > 0) { sound('error'); return customAlert('Username Taken', 'This username is already registered.\n\nPlease choose another.', '⚠️'); }
      const checkEmail = await sb.from('users').select('user_id').eq('email', S.sd.email).limit(1);
      if (checkEmail.data && checkEmail.data.length > 0) { sound('error'); return customAlert('Email Already Registered', 'This Gmail is already linked.\n\nPlease use another Gmail or login.', '⚠️'); }
    } catch(e) {}
  }
  const uid = 'TG' + Date.now();
  const rc = 'TOXIC' + Math.floor(1000 + Math.random() * 9000);
  const newUser = {user_id:uid, username:un, email:S.sd.email, phone:'', avatar:'', balance:0, referral_balance:0, invested:0, earned:0, referral_code:rc, referred_by:S.sd.referredBy, is_banned:false, joined_at:new Date().toISOString()};

  // FIX #5: require successful server insert (if sb is available)
  if (sb) {
    let insertOk = false, lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await sb.from('users').insert([{user_id:uid, username:un, email:S.sd.email, phone:'', balance:0, referral_balance:0, invested:0, referral_code:rc, referred_by:S.sd.referredBy, is_banned:false, password_hash: safeBtoa(pw)}]);
        if (!r.error) { insertOk = true; break; }
        lastErr = r.error;
      } catch(e) { lastErr = e; }
      await new Promise(res => setTimeout(res, 800));
    }
    if (!insertOk) {
      sound('error');
      return customAlert('Signup Failed', 'Could not create your account on server.\n\nPlease check your internet and try again.\n\n' + (lastErr?.message || ''), '❌');
    }
  }

  S.user = newUser;
  S.plans = [];
  localStorage.setItem('t_pwd_' + uid, pw);
  localStorage.removeItem('t_locked_ref'); localStorage.removeItem('t_locked_ref_time');
  S.otpVerified = false; S.otp = {code:'', email:'', expiry:0};
  haptic('success'); sound('success'); S.tab = 'dashboard'; save(); render();
  setTimeout(() => applySignupBonus(), 800);
  setTimeout(() => showTour(), 3500);
}

async function doLogin() {
  if (!navigator.onLine && !localStorage.getItem('t_user')) return customAlert('Offline', 'You are offline. Please check your internet connection.', '📡');
  const u = $('lu').value.trim(), p = $('lp').value;
  if (!u || !p) return customAlert('Required', 'Please enter your username/email and password.', '⚠️');
  const ex = JSON.parse(localStorage.getItem('t_user') || 'null');
  if (ex && (ex.username === u || (ex.email && ex.email.toLowerCase() === u.toLowerCase()))) {
    const st = localStorage.getItem('t_pwd_' + ex.user_id);
    if (st && st !== p) { sound('error'); return customAlert('Access Denied', 'Wrong password entered.\n\nPlease check or use Forgot Password.', '❌'); }
    S.user = ex;
    S.plans = JSON.parse(localStorage.getItem('t_plans') || '[]');
    S.tab = 'dashboard'; save();
    haptic('success'); sound('success');
    await syncUser(); render();
    setTimeout(() => showTour(), 2000);
    return;
  }
  if (sb) {
    try {
      const r = await sb.from('users').select('*').or(`username.eq.${u},email.eq.${u}`).limit(1);
      if (r.data && r.data[0]) {
        const dbUser = r.data[0];
        let dbPwd = dbUser.password_hash ? safeAtob(dbUser.password_hash) : null;
        if (dbPwd && dbPwd !== p) { sound('error'); return customAlert('Access Denied', 'Wrong password entered.', '❌'); }
        if (!dbPwd) {
          const localPwd = localStorage.getItem('t_pwd_' + dbUser.user_id);
          if (localPwd && localPwd !== p) { sound('error'); return customAlert('Access Denied', 'Wrong password.', '❌'); }
          try { await sb.from('users').update({ password_hash: safeBtoa(p) }).eq('user_id', dbUser.user_id); } catch(e) {}
        }
        S.user = dbUser; S.tab = 'dashboard'; save();
        haptic('success'); sound('success');
        await syncUser(); render();
        setTimeout(() => showTour(), 2000);
        return;
      }
    } catch(e) {}
  }
  sound('error');
  customAlert('User Not Found', 'No account found.\n\nPlease create a new account first.', '⚠️');
}

function chartUI() {
  const days = []; const today = new Date(); today.setUTCHours(0, 0, 0, 0);
  for (let i = 6; i >= 0; i--) { const d = new Date(today.getTime() - i * DAY); days.push({d:d, e:0, count:0}); }
  S.plans.forEach(pl => {
    const start = new Date(pl.started_at); start.setUTCHours(0, 0, 0, 0);
    const dailyEarn = Number(pl.dly || pl.daily) || 0;
    const maxDays = Math.min(Number(pl.days_collected) || 0, 40);
    days.forEach(day => { const diff = Math.floor((day.d.getTime() - start.getTime()) / DAY); if (diff >= 0 && diff < maxDays) { day.e += dailyEarn; day.count += 1; } });
  });
  const max = Math.max(...days.map(x => x.e), 0.01);
  const dayNames = ['S','M','T','W','T','F','S'];
  const bars = days.map((d, i) => {
    const pct = (d.e / max) * 100;
    const h = pct < 8 && d.e > 0 ? 8 : pct;
    const isToday = i === 6;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:36px"><div style="width:100%;display:flex;align-items:flex-end;justify-content:center;height:80px"><div class="chart-bar ${isToday?'today':'other'}" style="width:80%;height:${h}%"></div></div><span style="font-size:9px;${isToday?'color:#00FF66;font-weight:900':'color:#666'}">${dayNames[d.d.getDay()]}</span><span class="mono" style="font-size:8px;color:#00FF66;font-weight:700">$${d.e.toFixed(2)}</span></div>`;
  }).join('');
  const todayE = days[6].e;
  const weekE = days.reduce((a, b) => a + b.e, 0);
  return `<div class="glass-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><p style="font-size:10px;color:#888;font-weight:800;margin:0;letter-spacing:1.5px">📊 PORTFOLIO · LAST 7 DAYS</p><p class="mono text-toxic" style="font-size:10px;font-weight:800;margin:0">+$${fmt(weekE)}</p></div>

}

async function invest(id) {
  if (INVEST_LOCK) { haptic('warning'); toast('⏳ Please wait...'); return; }
  if (!navigator.onLine) return customAlert('Offline', 'You are offline. Please check your internet connection.', '📡');
  const p = PLANS.find(x => x.id === id); if (!p) return;
  if (isActive(id)) return customAlert('Plan Active', 'Already active.', '🔒');
  if (Number(S.user.balance) < p.d) return customAlert('Low Balance', 'Required: $' + p.d.toFixed(2) + '\nCurrent: $' + fmt(S.user.balance), '💰');
  INVEST_LOCK = true; render();
  const now = new Date();
  // FIX #1: always give a local id (fallback if offline / insert fails)
  let np = {id: 'local_' + Date.now(), user_id:S.user.user_id, username:S.user.username, plan_id:p.id, plan_name:p.n, deposit:p.d, daily:p.dly, total:p.t, days_collected:0, status:'active', started_at:now.toISOString(), expires_at:new Date(now.getTime() + 40 * DAY).toISOString(), last_collect_at: null};
  S.user.balance = Number(S.user.balance) - p.d;
  S.user.invested = Number(S.user.invested||0) + p.d;
  try {
    if (sb) {
      const insertPayload = {...np};
      delete insertPayload.id; // let DB assign its own
      const r = await sb.from('user_plans').insert([insertPayload]).select();
      if (r.error) {
        if (r.error.code === '23505' || String(r.error.message||'').toLowerCase().includes('unique')) {
          S.user.balance += p.d; S.user.invested -= p.d;
          INVEST_LOCK = false; render();
          return customAlert('Already Active', 'Plan already running.', '🔒');
        }
        // fallback: continue with local id
        console.warn('Plan insert failed, using local id:', r.error);
      } else if (r.data && r.data[0]) {
        np = r.data[0];
      }
      try { await sb.from('users').update({balance:S.user.balance, invested:S.user.invested}).eq('user_id', S.user.user_id); } catch(e) {}
      try { await distributeReferralCommissions(p.d, p.n, np.id); } catch(e) {}
    }
    S.tx.unshift({type:'deposit', amount:p.d, status:'success', method:'INVEST · ' + p.n, date:new Date().toISOString()});
    S.plans.unshift(np);
    haptic('success'); sound('success'); save();
    INVEST_LOCK = false; // FIX #3: clear lock BEFORE render so buttons re-enable
    render();
    customAlert('Investment Successful!', `Plan: ${p.n}\nInvested: $${p.d.toFixed(2)}\n\nCollect daily profit in 24 hours!`, '🎉');
    setTimeout(() => { checkVIPBadgeChange(); checkAchievements(); }, 1500);
  } catch(e) {
    S.user.balance += p.d; S.user.invested -= p.d;
    save(); haptic('error'); sound('error');
    showDetailedError('Investment Failed', (e.message || String(e)), 'Balance restored.', '❌');
    INVEST_LOCK = false;
    render();
  }
}

    try {
      const queryPromise = sb.from('users').select('user_id,username,referral_code,referral_balance,referred_by').eq('referral_code', currentRefCode).limit(1);
      const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), QUERY_TIMEOUT));
      const res = await Promise.race([queryPromise, timeoutPromise]);
      if (!res.data || !res.data[0]) break;
      const upline = res.data[0];
      if (visited.has(upline.user_id) || visited.has(upline.referral_code)) break;
      visited.add(upline.user_id); visited.add(upline.referral_code);
      const pct = COMMISSIONS[level-1] || 0;
      const comm = planAmount * pct;
      if (comm > 0) {
        const idempotencyKey = `comm_${txKey}_L${level}_${upline.user_id}`;
        try {
          const existing = await sb.from('notifications').select('id').eq('user_id', upline.user_id).ilike('message', `%[${idempotencyKey}]%`).limit(1);
          if (!(existing.data && existing.data.length > 0)) {
            await sb.from('users').update({referral_balance:Number(upline.referral_balance||0) + comm}).eq('user_id', upline.user_id);
            await sb.from('notifications').insert([{user_id:upline.user_id, title:`💎 Level ${level} Commission!`, message:`You earned $${comm.toFixed(2)} (${(pct*100).toFixed(0)}%) from ${S.user.username}'s ${planName} plan investment of $${planAmount.toFixed(2)} [${idempotencyKey}]`, type:'bonus', is_read:false}]);
          }
        } catch(e) {}
      }
      currentRefCode = upline.referred_by;
      level++;
    } catch(e) { break; }
  }
}

async function collect(pid) {
  const pl = S.plans.find(x => String(x.id) === String(pid));
  if (!pl) return;
  if (!navigator.onLine) return customAlert('Offline', 'You are offline. Please check your internet connection.', '📡');
  if (Date.now() < nextC(pl)) return customAlert('Wait', 'Your daily reward is not ready yet.\n\nWait for the timer to complete.', '⏳');
  if (Number(pl.days_collected) >= 40) return customAlert('Done', 'This plan cycle is completed.', '✅');
  const rw = Number(pl.dly || pl.daily);
  const nowIso = new Date().toISOString();
  S.user.balance = Number(S.user.balance||0) + rw;
  S.user.earned = Number(S.user.earned||0) + rw;
  pl.days_collected = (Number(pl.days_collected)||0) + 1;
  pl.last_collect_at = nowIso;
  const done = pl.days_collected >= 40;
  if (done) pl.status = 'completed';
  S.tx.unshift({type:'daily_collect', amount:rw, status:'success', method:pl.plan_name, date:nowIso, plan_id:pl.plan_id});
  if (sb && !String(pl.id).startsWith('local_')) {
    try {
      await sb.from('user_plans').update({days_collected:pl.days_collected, status:pl.status, last_collect_at: nowIso}).eq('id', pl.id);
      await sb.from('users').update({balance:S.user.balance, earned:S.user.earned}).eq('user_id', S.user.user_id);
    } catch(e) {}
  } else if (sb && String(pl.id).startsWith('local_')) {
    // try to find by matching (offline plan that was created locally)
    try {
      const findRes = await sb.from('user_plans').select('id').eq('user_id', S.user.user_id).eq('plan_id', pl.plan_id).eq('status', 'active').order('id', {ascending:false}).limit(1);
      if (findRes.data && findRes.data[0]) {
        pl.id = findRes.data[0].id;
        await sb.from('user_plans').update({days_collected:pl.days_collected, status:pl.status, last_collect_at: nowIso}).eq('id', pl.id);
      }
      await sb.from('users').update({balance:S.user.balance, earned:S.user.earned}).eq('user_id', S.user.user_id);
    } catch(e) {}
  }
  haptic('success'); sound('coin');
  showCoinAnim(rw);
  if (done) {
    launchConfetti();
    sendPush('🎉 Plan Completed', `Your ${pl.plan_name} plan completed! Total: $${rw.toFixed(2)}`);
    customAlert('Plan Completed!', `Total return collected: $${rw.toFixed(2)}`, '🎉');
  }
  else customAlert('Reward Collected!', `Collected: $${rw.toFixed(2)}\nDay: ${pl.days_collected} / 40`, '💰');
  save(); render();
  checkAchievements();
}

async function handleShareScreenshot(event) {
  const file = event.target.files[0]; if (!file) return;
  if (file.size > 2 * 1024 * 1024) return customAlert('File Too Large', 'Max 2MB.', '⚠️');
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const MAX = 600; const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const b64 = canvas.toDataURL('image/jpeg', 0.6);
      toast('📤 Sending...');
      const tgResult = await sendScreenshotToTelegram(b64, S.user.username, S.user.user_id);
      if (sb) {
        try {
          await sb.from('share_bonus').insert([{ user_id: S.user.user_id, username: S.user.username, screenshot: b64, status: 'pending', created_at: new Date().toISOString() }]);
          await sb.from('notifications').insert([{ user_id: S.user.user_id, title: '📸 Share Bonus Submitted', message: `Your share bonus screenshot is under review. +$${CFG.shareBonus.toFixed(2)} will be credited once approved.`, type: 'update', is_read: false }]);
          localStorage.setItem('x_last_share_' + S.user.user_id, Date.now().toString());
          haptic('success'); sound('success');
          S.showShare = false; render();
          if (tgResult.ok) customAlert('✅ Submitted!', 'Screenshot sent.\n\n+$0.10 after approval.', '🎉');
          else customAlert('⚠️ Partial', `Saved but Telegram failed:\n\n${tgResult.error||'Unknown'}`, '⚠️');
        } catch(err) { customAlert('Submission Failed', 'Try again.\n\n' + (err.message || ''), '❌'); }
      } else customAlert('Offline', 'Check internet.', '⚠️');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

    ${all.map((w, i) => { const rank = i + 1; const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`; return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,0.4);margin-bottom:5px;border:1px solid ${rank<=3?'rgba(255,215,0,0.4)':'transparent'}"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;width:26px;color:${rank===1?'#FFD700':rank===2?'#C0C0C0':rank===3?'#CD7F32':'#666'};font-weight:900">${medal}</span><span style="font-size:11px;font-weight:800;color:#fff">${esc(w.name)}</span><span style="font-size:10px">${w.country}</span></div><div style="text-align:right"><p class="mono" style="font-size:11px;font-weight:900;color:#FFD700;margin:0">$${fmt(w.amount)}</p><p style="font-size:8px;color:#888;margin:1px 0 0">${w.period}</p></div></div>`; }).join('')}
  </div></div>`;
}
function qrModal() {
  if (!S.showQR) return '';
  const rl = refLink();

  return `<div style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px" onclick="S.showQR=false;render()"><div class="glass-card modal-in" onclick="event.stopPropagation()" style="max-width:400px;width:100%;text-align:center">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:16px;font-weight:900;margin:0">📱 Referral QR</h2><button onclick="S.showQR=false;render()" style="background:none;border:none;color:#888;font-size:26px;cursor:pointer">×</button></div>
    <div style="background:#fff;padding:14px;border-radius:20px;display:inline-block;box-shadow:0 0 40px rgba(0,255,102,0.4)"><img src="${qr}" style="width:250px;height:250px;display:block" alt="QR"></div>
    <p style="font-size:10px;color:#888;margin:14px 0 6px;letter-spacing:1px">YOUR LINK</p>
    <p class="mono" style="font-size:11px;color:#00FF66;word-break:break-all;margin:0 0 14px">${rl}</p>
    <button onclick="copy('${rl}')" class="btn-green" style="width:100%;padding:12px;border-radius:14px;font-size:12px;margin-bottom:8px">📋 COPY LINK</button>
    <button onclick="shareTg()" style="width:100%;padding:12px;border-radius:14px;font-size:12px;font-weight:800;background:rgba(0,166,237,0.15);border:1px solid rgba(0,166,237,0.4);color:#00A6ED;cursor:pointer">📤 SHARE</button>
  </div></div>`;
}

function profileModal() {
  if (!S.showProfile || !S.user) return '';
  const u = S.user, lang = S.lang || 'en';
  const badge = getVIPBadge(Number(u.invested||0));
  const langs = [{code:'en', label:'🇬🇧 English'},{code:'hi', label:'🇮🇳 हिंदी'},{code:'ur', label:'🇵🇰 اردو'},{code:'ar', label:'🇸🇦 العربية'}];
  const unlockedCount = ACHIEVEMENTS.filter(a => S.achievements.includes(a.id)).length;
  return `<div style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);overflow-y:auto" onclick="S.showProfile=false;render()"><div class="glass-card modal-in" onclick="event.stopPropagation()" style="max-width:440px;margin:20px auto;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><span style="font-size:10px;color:#888;font-weight:800;letter-spacing:1.5px">MY PROFILE</span><button onclick="S.showProfile=false;render()" style="background:none;border:none;color:#888;font-size:26px;cursor:pointer">×</button></div>
    <div style="text-align:center;margin-bottom:24px">
      <div style="position:relative;display:inline-block"><div class="avatar" style="width:84px;height:84px;cursor:pointer" onclick="$('avatarFileInput').click()">${userAvatar(u, 80, 30)}</div><button onclick="$('avatarFileInput').click()" style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:#00FF66;color:#000;border:2px solid #050907;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;box-shadow:0 0 10px rgba(0,255,102,0.6)">📷</button><input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)"></div>
      <h2 style="font-size:22px;font-weight:900;margin:14px 0 4px">${esc(u.username)}</h2>
      <div style="display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:5px 14px;border-radius:20px;background:${badge.c}25;border:1px solid ${badge.c}66"><span style="font-size:14px" class="emoji-3d">${badge.icon}</span><span style="font-size:11px;font-weight:900;color:${badge.c}">${badge.name}</span></div>
      <p style="font-size:10px;color:#888;margin:8px 0 0">ID: ${esc(u.user_id)}</p>
      <p style="font-size:10px;color:#00FF66;margin:6px 0 0">🏆 ${unlockedCount}/${ACHIEVEMENTS.length} achievements</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
      ${pRow('📧 Email', u.email||'—')}
      ${pRow('🎫 Referral', u.referral_code||'—', 1)}
      ${pRow('💰 Balance', '$' + fmt(u.balance), 1)}
      ${pRow('👥 Pending Ref', '$' + fmt(u.referral_balance), 1)}
      ${pRow('📊 Invested', '$' + fmt(u.invested), 1)}
      ${pRow('🎡 Spins', (S.spin.totalSpins||0))}
      ${pRow('📅 Joined', u.joined_at ? String(u.joined_at).slice(0,10) : '—')}
    </div>
    <div style="height:1px;background:rgba(255,255,255,0.08);margin:18px 0"></div>
    <p style="font-size:10px;color:#888;font-weight:800;margin:0 0 12px;letter-spacing:1.5px">🔄 AUTO-RENEW</p>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.45);border-radius:12px;margin-bottom:18px"><div><span style="font-size:12px;color:#ccc;font-weight:700">Auto-Renew</span><p style="font-size:9px;color:#888;margin:3px 0 0">Auto restart plans after 40 days</p></div><div onclick="toggleAutoRenew()" class="switch ${S.autoRenew?'on':''}"></div></div>
    <div style="height:1px;background:rgba(255,255,255,0.08);margin:18px 0"></div>
    <p style="font-size:10px;color:#888;font-weight:800;margin:0 0 12px;letter-spacing:1.5px">🔔 PUSH NOTIFICATIONS</p>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.45);border-radius:12px;margin-bottom:18px"><div><span style="font-size:12px;color:#ccc;font-weight:700">Enable Push</span><p style="font-size:9px;color:#888;margin:3px 0 0">Get notified on approvals</p></div><div onclick="requestPushPermission().then(g=>{toast(g?'✅ Push enabled':'❌ Denied')})" class="switch ${('Notification' in window) && Notification.permission==='granted'?'on':''}"></div></div>
    <div style="height:1px;background:rgba(255,255,255,0.08);margin:18px 0"></div>
    <p style="font-size:10px;color:#888;font-weight:800;margin:0 0 12px;letter-spacing:1.5px">🔊 SOUND</p>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.45);border-radius:12px;margin-bottom:18px"><span style="font-size:12px;color:#ccc">App Sounds</span><div onclick="toggleSound()" class="switch ${S.soundOn?'on':''}"></div></div>
    <div style="height:1px;background:rgba(255,255,255,0.08);margin:18px 0"></div>
    <p style="font-size:10px;color:#888;font-weight:800;margin:0 0 12px;letter-spacing:1.5px">🌐 ${t().langName}</p>
    <div class="lang-grid" style="margin-bottom:18px">${langs.map(l => `<button onclick="setLang('${l.code}')" class="lang-btn ${lang===l.code?'active':''}">${l.label}</button>`).join('')}</div>
    <div style="height:1px;background:rgba(255,255,255,0.08);margin:18px 0"></div>
    <p style="font-size:10px;color:#888;font-weight:800;margin:0 0 12px;letter-spacing:1.5px">📄 LEGAL & INFO</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <button onclick="S.showProfile=false;openPage('about')" style="padding:11px;border-radius:12px;background:rgba(0,255,102,0.08);border:1px solid rgba(0,255,102,0.2);color:#fff;font-size:11px;font-weight:700;cursor:pointer">ℹ️ About Us</button>
      <button onclick="S.showProfile=false;openPage('faq')" style="padding:11px;border-radius:12px;background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.25);color:#fff;font-size:11px;font-weight:700;cursor:pointer">❓ FAQ</button>
      <button onclick="S.showProfile=false;openPage('analytics')" style="padding:11px;border-radius:12px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.25);color:#fff;font-size:11px;font-weight:700;cursor:pointer">📊 Analytics</button>
      <button onclick="S.showProfile=false;openPage('tnc')" style="padding:11px;border-radius:12px;background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.25);color:#fff;font-size:11px;font-weight:700;cursor:pointer">📜 Terms</button>
    </div>
    <div style="height:1px;background:rgba(255,255,255,0.08);margin:18px 0"></div>
    <p style="font-size:10px;color:#888;font-weight:800;margin:0 0 12px;letter-spacing:1.5px">🔐 CHANGE PASSWORD</p>
    <input type="password" id="oldPw" class="inp" placeholder="Current Password" style="margin-bottom:10px">
    <input type="password" id="newPw" class="inp" placeholder="New Password" style="margin-bottom:10px">
    <input type="password" id="newPw2" class="inp" placeholder="Confirm New Password" style="margin-bottom:16px">
    <button onclick="changePw()" class="btn-green glow" style="width:100%;padding:13px;border-radius:16px;font-size:14px;margin-bottom:12px">UPDATE PASSWORD</button>
    <button onclick="S.showProfile=false;logout()" style="width:100%;padding:13px;border-radius:16px;font-size:12px;font-weight:800;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#EF4444;cursor:pointer">🚪 Logout</button>
  </div></div>`;
}
function pRow(l, v, green) { return `<div style="display:flex;justify-content:space-between;align-items:center;padding:13px;background:rgba(0,0,0,0.45);border-radius:12px"><span style="font-size:12px;color:#888">${l}</span><span class="mono" style="font-size:12px;font-weight:${green?'900':'500'};color:${green?'#00FF66':'#fff'}">${esc(v)}</span></div>`; }
function setLang(l) { S.lang = l; save(); sound('tap'); render(); }
function changePw() {
  const o = $('oldPw').value, n = $('newPw').value, n2 = $('newPw2').value;
  if (!o || !n || !n2) return customAlert('Required', 'Please fill all fields', '⚠️');
  if (n.length < 4) return customAlert('Too Short', 'Min 4 chars', '⚠️');
  if (n !== n2) return customAlert('Mismatch', 'Passwords do not match', '⚠️');
  const st = localStorage.getItem('t_pwd_' + S.user.user_id);
  if (st && st !== o) return customAlert('Error', 'Current password is incorrect', '❌');
  localStorage.setItem('t_pwd_' + S.user.user_id, n);
  if (sb && S.user) { try { sb.from('users').update({password_hash: safeBtoa(n)}).eq('user_id', S.user.user_id); } catch(e) {} }
  $('oldPw').value = ''; $('newPw').value = ''; $('newPw2').value = '';
  haptic('success'); sound('success');
  customAlert('Success', 'Password updated!', '✅');
}
function copy(text) {
  navigator.clipboard.writeText(text).then(() => { haptic('success'); sound('tap'); toast('✅ Copied!'); }).catch(() => {
    const el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
    haptic('success'); sound('tap'); toast('✅ Copied!');
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (!localStorage.getItem('t_pwa_dismissed')) { setTimeout(() => { const b = $('pwaBanner'); if (b) b.classList.add('show'); }, 5000); }
});
function installPWA() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; dismissPWA(); }); } else { customAlert('Install Manually', 'Tap browser menu → "Add to Home Screen".', '📲'); dismissPWA(); } }
function dismissPWA() { const b = $('pwaBanner'); if (b) b.classList.remove('show'); localStorage.setItem('t_pwa_dismissed', '1'); }

let pullStartY = 0; let pulling = false; let pullDist = 0;
const PULL_THRESHOLD = 80;
document.addEventListener('touchstart', (e) => {
  if (window.scrollY <= 2 && !S.showProfile && !S.showNotifs && !S.page && !S.showForgot && !S.showBadges && !S.showShare && !S.showWinner && !S.showQR && !S.showSeeAllLb && !S.showSeeAllTeam && S.user) { pullStartY = e.touches[0].clientY; pulling = true; pullDist = 0; }
}, {passive:true});
document.addEventListener('touchmove', (e) => {
  if (!pulling) return;
  pullDist = e.touches[0].clientY - pullStartY;
  if (pullDist > 0 && pullDist < 200) { const ind = $('pullIndicator'); if (ind) { ind.classList.add('active'); const offset = Math.min(pullDist - 30, 50); ind.style.transform = `translateX(-50%) translateY(${offset}px) rotate(${pullDist*3}deg)`; } }
}, {passive:true});
document.addEventListener('touchend', async () => {
  if (!pulling) return;
  pulling = false;
  const ind = $('pullIndicator');
  if (pullDist >= PULL_THRESHOLD && S.user) {
    if (ind) { ind.classList.add('spin'); ind.textContent = '⟳'; ind.style.transform = 'translateX(-50%) translateY(60px)'; }
    haptic('medium'); sound('tap');
    await loadSiteConfig(); await loadPlansFromDB(); await syncUser(); await loadPromoCodes(); await loadCryptoPrices();
    S.leaderboardLoaded = false; LB_CACHE = [];
    render();
    setTimeout(() => { if (ind) { ind.classList.remove('spin', 'active'); ind.textContent = '↓'; ind.style.transform = 'translateX(-50%) translateY(-80px)'; } toast('✅ Updated!'); }, 700);
  } else { if (ind) { ind.classList.remove('active'); ind.style.transform = 'translateX(-50%) translateY(-80px)'; } }
  pullDist = 0;
});

function pushBackState() { try { history.pushState({t:Date.now()}, '', '#'); } catch(e) {} }
window.addEventListener('popstate', () => {
  let closed = false;
  if ($('cModal') && $('cModal').style.display === 'flex') { closeCModal(); closed = true; }
  else if ($('tourOverlay') && $('tourOverlay').classList.contains('show')) { skipTour(); closed = true; }
  else if (S.showSeeAllLb) { S.showSeeAllLb = false; closed = true; }
  else if (S.showSeeAllTeam) { S.showSeeAllTeam = false; closed = true; }
  else if (S.showProfile) { S.showProfile = false; closed = true; }
  else if (S.showNotifs) { S.showNotifs = false; closed = true; }
  else if (S.selPlan) { S.selPlan = null; closed = true; }
  else if (S.page) { S.page = null; closed = true; }
  else if (S.showForgot) { S.showForgot = false; closed = true; }
  else if (S.showBadges) { S.showBadges = false; closed = true; }
  else if (S.showShare) { S.showShare = false; closed = true; }
  else if (S.showWinner) { S.showWinner = false; closed = true; }
  else if (S.showQR) { S.showQR = false; closed = true; }
  if (closed) { render(); pushBackState(); }
  else { pushBackState(); }
});
pushBackState();

try { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } } catch(e) {}
if (!S.user) S.tab = 'signup';

let loadingHidden = false;
function hideLoading() {
  if (loadingHidden) return;
  loadingHidden = true;
  const pctEl = $('loadingPct');
  const fill = $('loadingFill');
  if (pctEl) pctEl.textContent = '100%';
  if (fill) fill.style.width = '100%';
  setTimeout(() => {
    const l = $('loading');
    if (l) l.classList.add('hide');
  }, 450);
}

function animateLoadingPct() {
  const pctEl = $('loadingPct');
  if (!pctEl) return;
  let pct = 0;
  const int = setInterval(() => {
    if (loadingHidden) { clearInterval(int); return; }
    pct += Math.floor(Math.random() * 8) + 3;
    if (pct >= 95) { pct = 95; clearInterval(int); }
    pctEl.textContent = pct + '%';
    const fill = $('loadingFill');
    if (fill) fill.style.width = pct + '%';
  }, 100);
}

(async function() {
  const loadingLogo = $('loadingLogo');
  if (loadingLogo) loadingLogo.innerHTML = toxicLogo('lg');
  animateLoadingPct();
  initOfflineMode();
  const failsafe = setTimeout(() => { hideLoading(); setTimeout(() => toast('⚠️ Slow connection.'), 500); }, 8000);
  try { await Promise.all([loadSiteConfig(), loadPlansFromDB(), loadPromoCodes(), loadCryptoPrices(), S.user ? syncUser() : Promise.resolve()]); } catch(e) {}
  clearTimeout(failsafe); render(); hideLoading();
  setTimeout(showLive, 3500);
  if (S.tab === 'dashboard' && S.user) setTimeout(() => { if (!TICKER_ACTIVE) rotateCombinedTicker(); }, 500);
  setTimeout(() => { if (S.user) { checkTeamMilestones(); checkVIPBadgeChange(); checkAchievements(); } }, 2000);
  if (S.user) setTimeout(() => showTour(), 3500);
  setInterval(loadCryptoPrices, 90000);
  setInterval(loadPromoCodes, 60000);
  setInterval(async () => { await loadSiteConfig(); await loadPlansFromDB(); }, 120000);
})();

setInterval(async () => {
  if (S.user && !SYNC_LOCK && !INVEST_LOCK) {
    const before = S.tx.map(x => x.id + '|' + x.status).join(',');
    await syncUser();
    if (!PROMO_LOADED) await loadPromoCodes();
    checkTeamMilestones();
    const after = S.tx.map(x => x.id + '|' + x.status).join(',');
    updateDyn();
    const ae = document.activeElement;
    const typing = ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName);
    if (before !== after && !typing && !S.showProfile && !S.showNotifs && !S.page && !S.selPlan && S.tab !== 'wallet' && !S.showForgot && !S.showBadges && !S.showShare && !S.showWinner && !S.showQR && !S.showSeeAllLb && !S.showSeeAllTeam) { render(); }
  }
}, 30000);
</script>
