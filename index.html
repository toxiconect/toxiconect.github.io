async function doSignIn() {
  var u = $('signinUser').value.trim();
  var p = $('signinPass').value;
  if (!u || !p) return alert('Enter username and password');

  var existing = JSON.parse(localStorage.getItem('toxic_user') || 'null');
  if (existing && existing.username === u) { S.user = existing; S.tab = 'dashboard'; save(); render(); return; }

  if (sb) {
    try {
      var result = await sb.from("users").select("*").eq("username", u).limit(1);
      if (result.data && result.data.length > 0) {
        S.user = result.data[0];
        if (!S.user.active_plans) S.user.active_plans = [];
        S.tab = 'dashboard'; save(); render(); return;

    } catch(e){ console.log('Login error', e); }
  }
  alert('⚠️ User not found. Please sign up first.');
}

async function invest(id) {
  var p = PLANS.find(function(x){return x.id===id});
  if (!p) return;
  if (S.user.balance < p.deposit) return alert('Insufficient balance');
  if (S.user.active_plan) return alert('You already have an active plan!');

  var now = new Date();
  var expires = new Date(now.getTime() + 40*24*60*60*1000);

  S.user.balance = Number(S.user.balance) - p.deposit;
  S.user.invested = Number(S.user.invested||0) + p.deposit;
  S.user.active_plan = p.id;
  S.user.plan_name = p.name;
  S.user.plan_deposit = p.deposit;
  S.user.plan_daily = p.daily;
  S.user.plan_started = now.toISOString();
  S.user.plan_expires = expires.toISOString();
  S.user.days_collected = 0;
  if (!S.user.active_plans) S.user.active_plans = [];
  S.user.active_plans.push({ id:p.id, plan_name:p.name, daily:p.daily, total:p.total, color:p.color, icon:p.icon, days_collected:0, started_at: now.toISOString() });

  if (sb) {
    try {
      await sb.from("users").update({
        balance: S.user.balance, invested: S.user.invested,
        active_plan: p.id, plan_name: p.name, plan_deposit: p.deposit, plan_daily: p.daily,
        plan_started: S.user.plan_started, plan_expires: S.user.plan_expires, days_collected: 0
      }).eq("user_id", S.user.user_id);
    } catch(e){ console.log(e); }
  }

  save(); render();
  alert('🎉 INVESTED!\n\n$'+p.deposit.toFixed(2)+' invested in '+p.name+'.\n\nBalance deducted: -$'+p.deposit.toFixed(2)+'\n\n⏰ First collect in 24 hours!');
}

async function collectDaily() {
  if (!S.user.active_plan) return alert('No active plan');
  var p = PLANS.find(function(x){return x.id === S.user.active_plan});
  if (!p) return;

  var started = new Date(S.user.plan_started).getTime();
  var nextCollect = started + ((Number(S.user.days_collected)||0) + 1) * 24 * 60 * 60 * 1000;
  if (S.now < nextCollect) return alert('⏳ Not ready yet.\n\nWait for the timer.');
  if ((Number(S.user.days_collected)||0) >= 40) return alert('Plan completed!');

  var reward = p.daily;
  S.user.balance = Number(S.user.balance||0) + reward;
  S.user.earned = Number(S.user.earned||0) + reward;
  S.user.days_collected = (Number(S.user.days_collected)||0) + 1;

  if (S.user.active_plans && S.user.active_plans.length > 0) {
    S.user.active_plans[0].days_collected = S.user.days_collected;
  }

  S.transactions.push({ type:'daily_collect', amount: reward, status:'approved', method: p.name, date: new Date().toISOString() });

  if (S.user.days_collected >= 40) {
    S.user.active_plan = null;
    S.user.plan_started = null;
    S.user.days_collected = 0;
    S.user.active_plans = [];
  }

  if (sb) {
    try {
      await sb.from("users").update({
        balance: S.user.balance, earned: S.user.earned,
        days_collected: S.user.days_collected, active_plan: S.user.active_plan
      }).eq("user_id", S.user.user_id);
    } catch(e){ console.log(e); }
  }

  save(); render();
  if (S.user.days_collected === 0 && S.user.active_plan === null) {
    alert('🎉 PLAN COMPLETED!\n\nYou collected: $'+reward.toFixed(2)+'\n\nTotal earned: $'+p.total.toFixed(2));
  } else {
    alert('💰 COLLECTED $'+reward.toFixed(2)+'!\n\nDay '+(S.user.days_collected)+' / 40\n\nNext collect in 24h.');
  }
}

async function submitDeposit() {
  var amt = parseFloat($('depAmt').value);
  var isCrypto = selM !== 0;
  var utr = $('depUtr') ? $('depUtr').value.trim() : '';
  var tx = $('depTx') ? $('depTx').value.trim() : '';
  var ref = isCrypto ? tx : utr;
  if (!amt || amt < CONFIG.minDeposit) return alert('Minimum deposit is $'+CONFIG.minDeposit);
  if (isCrypto && !ref) return alert('Enter TxHash');
  if (!isCrypto && utr.length !== 12) return alert('Enter valid 12-digit UTR');
  var method = ['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][selM];
  S.transactions.push({ type:'deposit', amount:amt, ref:ref, status:'pending', method:method, date: new Date().toISOString() });
  if (sb) {
    try {
      await sb.from("deposits").insert([{ user_id: S.user.user_id, username: S.user.username, amount: amt, method: method, ref: ref, status: 'pending' }]);
    } catch(e){ console.log(e); }
  }
  save();
  $('depAmt').value='';
  if ($('depUtr')) $('depUtr').value='';
  if ($('depTx')) $('depTx').value='';
  alert('✅ Deposit submitted!\n\nAdmin will verify within 24 hours.');
}

async function submitWithdraw() {
  var amt = parseFloat($('wdAmt').value);
  var addr = $('wdAddr').value.trim();
  if (!amt || amt < CONFIG.minWithdraw) return alert('Minimum withdrawal is $'+CONFIG.minWithdraw);
  if (!addr) return alert('Enter USDT address');
  if (S.user.balance < amt) return alert('Insufficient balance');
  var fee = amt * CONFIG.withdrawFee;
  S.user.balance -= amt;
  S.transactions.push({ type:'withdrawal', amount:amt-fee, status:'pending', method:'USDT', date: new Date().toISOString() });
  if (sb) {
    try {
      await sb.from("withdrawals").insert([{ user_id: S.user.user_id, username: S.user.username, amount: amt - fee, address: addr, status: 'pending' }]);
      await sb.from("users").update({balance: S.user.balance}).eq("user_id", S.user.user_id);
    } catch(e){ console.log(e); }
  }
  save(); render();
  alert('✅ Withdrawal requested!\n\nAmount: $'+fmt(amt-fee)+'\n(5% fee: $'+fmt(fee)+')');
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function(){alert('✅ Copied!')}).catch(function(){
    var el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); alert('✅ Copied!');
  });
}

try { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } } catch(e){}

if (!S.user) S.tab = 'signup';
render();
</script>
