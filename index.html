function generateOTP() { return String(Math.floor(100000 + Math.random() * 900000)); }

async function sendOTP() {
  const email = ($('sd_email') || {}).value ? $('sd_email').value.trim() : '';
  if (!email) return customAlert('Missing Email', 'Please enter your Gmail address.', '⚠️');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return customAlert('Invalid Email', 'Please enter a valid email address.', '⚠️');
  const btn = $('sendOtpBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'SENDING...'; }
  const code = generateOTP();
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  S.otp = { code, email, expiry: Date.now() + 15 * 60 * 1000 };
  localStorage.setItem('t_otp', JSON.stringify(S.otp));
  try {
    await emailjs.send(CFG.emailjs.serviceId, CFG.emailjs.templateId, { passcode: code, time: timeStr, email: email });
    haptic('success'); sound('success');
    customAlert('📧 OTP Sent!', `A 6-digit OTP has been sent to:\n\n${email}\n\nPlease check your inbox (and spam folder).\n\nOTP valid for 15 minutes.`, '✅');
    if ($('otpSection')) $('otpSection').style.display = 'block';
    startOtpResendTimer();
  } catch(err) {
    console.error('EmailJS error:', err);
    haptic('error'); sound('error');
    customAlert('Failed to Send', 'Could not send OTP. Please check your internet and try again.\n\nError: ' + (err.text || err.message || 'Unknown'), '❌');
    if (btn) { btn.disabled = false; btn.textContent = 'SEND OTP'; }
  }
}

let otpResendInterval = null;
function startOtpResendTimer() {
  let sec = 30;
  const btn = $('sendOtpBtn');
  if (otpResendInterval) clearInterval(otpResendInterval);
  otpResendInterval = setInterval(() => {
    sec--;
    if (btn) { btn.disabled = true; btn.textContent = `RESEND IN ${sec}s`; }
    if (sec <= 0) {
      clearInterval(otpResendInterval); otpResendInterval = null;
      if (btn) { btn.disabled = false; btn.textContent = 'RESEND OTP'; }
    }
  }, 1000);
}

async function distributeReferralCommissions(planAmount, planName) {

        } catch(e) {}

  }
}

function handleAvatarUpload(event) {
  const file = event.target.files[0]; if (!file) return;
  if (file.size > 2.5 * 1024 * 1024) return customAlert('File Too Large', 'Photo must be less than 2.5MB.', '⚠️');
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas'); const MAX_WIDTH = 200; const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
      S.user.avatar = compressedBase64; save(); haptic('success'); sound('success'); toast('✅ Photo Updated!'); render();
      if (sb && S.user) { try { await sb.from('users').update({avatar: compressedBase64}).eq('user_id', S.user.user_id); } catch(err) {} }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function syncUser() {
  if (!sb || !S.user) return;
  S.syncing = true;
  try {
    const u = await sb.from('users').select('*').eq('user_id', S.user.user_id).limit(1);
    if (u.data && u.data[0]) {
      const f = u.data[0];
      if (f.is_banned === true) {
        sound('error');
        customAlert('Account Suspended', 'Your account has been suspended by the administrator.\n\nContact support: @Toxiconect', '🚫');
        setTimeout(() => { localStorage.removeItem('t_user'); localStorage.removeItem('t_plans'); localStorage.removeItem('t_team'); localStorage.removeItem('t_tx'); S.user = null; S.plans = []; S.team = []; S.tx = []; S.tab = 'signin'; render(); }, 3000);
        return;
      }
      const oldB = Number(S.user.balance||0);
      S.user.balance = Number(f.balance||0); S.user.referral_balance = Number(f.referral_balance||0);
      S.user.invested = Number(f.invested||0); S.user.earned = Number(f.earned||0);
      if (f.avatar) S.user.avatar = f.avatar;
      if (f.email) S.user.email = f.email;
      if (f.milestones_claimed) { S._claimedMilestones = String(f.milestones_claimed).split(',').map(x => parseInt(x)).filter(x => !isNaN(x)); localStorage.setItem('t_milestones', JSON.stringify(S._claimedMilestones)); }
      save();
      if ($('bal') && oldB !== S.user.balance) animateCount($('bal'), oldB, S.user.balance);
    }
    const p = await sb.from('user_plans').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    if (p.data && Array.isArray(p.data)) S.plans = p.data;
    const d = await sb.from('deposits').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    const w = await sb.from('withdrawals').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    const sbList = [];
    if (d.data) d.data.forEach(x => { sbList.push({id:'sb_dep_'+x.id, type:'deposit', amount:Number(x.amount), method:x.method||'', ref:x.ref||'', status:(x.status||'pending'), date:x.created_at||new Date().toISOString()}); });
    if (w.data) w.data.forEach(x => { sbList.push({id:'sb_wd_'+x.id, type:'withdrawal', amount:Number(x.amount), method:x.method||'', address:x.address||'', status:(x.status||'pending'), date:x.created_at||new Date().toISOString()}); });
    const finalList = [...sbList];
    S.tx.forEach(local => { const lid = String(local.id || ''); if (lid.startsWith('sb_dep_') || lid.startsWith('sb_wd_')) return; if (!finalList.find(x => String(x.id) === lid)) finalList.push({...local}); });
    finalList.sort((a,b) => new Date(b.date) - new Date(a.date));
    S.tx.forEach(old => {
      if (old.type !== 'withdrawal') return;
      const updated = finalList.find(n => String(n.id) === String(old.id)); if (!updated) return;
      const oldSt = (old.status || '').toLowerCase(); const newSt = (updated.status || '').toLowerCase();
      if (oldSt === 'pending' && (newSt === 'approved' || newSt === 'paid' || newSt === 'success')) { haptic('success'); sound('notif'); setTimeout(() => { launchConfetti(); customAlert('✅ Withdrawal Approved!', `$${fmt(updated.amount)} withdrawal has been approved!`, '💰'); }, 800); }
      else if (oldSt === 'pending' && (newSt === 'rejected' || newSt === 'failed')) { haptic('warning'); sound('error'); setTimeout(() => { customAlert('❌ Withdrawal Rejected', `Your withdrawal of $${fmt(updated.amount)} was rejected.\n\nBalance refunded.`, '⚠️'); }, 800); }
    });
    S.tx = finalList;
    if (S.user.referral_code) {
      const tm = await sb.from('users').select('username, joined_at, invested, balance').eq('referred_by', S.user.referral_code).order('joined_at', {ascending:false});
      if (tm.data) {
        S.team = tm.data;
        const currentCount = S.team.length;
        if (S.lastTeamCount > 0 && currentCount > S.lastTeamCount) {
          const newRefs = currentCount - S.lastTeamCount;
          haptic('success'); sound('ref'); launchConfetti();
          setTimeout(() => { customAlert('🎉 New Referral!', `${newRefs} new member${newRefs>1?'s':''} joined your team!\n\nTotal team: ${currentCount}`, '👥'); }, 600);
        }
        S.lastTeamCount = currentCount;
        localStorage.setItem('t_last_team', String(currentCount));
      }
    }
    await loadNotifs();
    save();
  } catch(e) { console.warn('Sync:', e); }
  S.syncing = false;
}
