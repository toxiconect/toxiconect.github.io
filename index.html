function updateDynamic() {
  if (!S.user) return;
  document.querySelectorAll('[data-timer]').forEach(function(el){
    var planId = el.getAttribute('data-timer');
    var plan = S.plans.find(function(p){ return String(p.id) === String(planId) });
    if (!plan) return;
    var nextCollect = getNextCollect(plan);
    var rem = nextCollect - Date.now();
    if (rem <= 0) { el.textContent = 'READY NOW'; el.classList.add('text-toxic'); }
    else {
      var h = Math.max(0, Math.floor(rem/3600000));
      var m = Math.max(0, Math.floor((rem%3600000)/60000));
      var s = Math.max(0, Math.floor((rem%60000)/1000));
      el.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.classList.remove('text-toxic');
    }
  });
  document.querySelectorAll('[data-collect]').forEach(function(btn){
    var planId = btn.getAttribute('data-collect');
    var plan = S.plans.find(function(p){ return String(p.id) === String(planId) });
    if (!plan) return;
    var ready = Date.now() >= getNextCollect(plan) && Number(plan.days_collected) < 40;
    btn.disabled = !ready;
    if (ready) btn.textContent = '💰 COLLECT $' + Number(plan.daily).toFixed(2);
    else if (Number(plan.days_collected) >= 40) btn.textContent = '✅ COMPLETED';
    else btn.textContent = '⏳ WAIT FOR TIMER';
  });
  if ($('bal-val')) $('bal-val').textContent = '$' + fmt(S.user.balance);
  if ($('ref-val')) $('ref-val').textContent = '$' + fmt(S.user.referral_balance);
  if ($('plans-count')) $('plans-count').textContent = S.plans.filter(function(p){return Number(p.days_collected)<40}).length;
}

}

function openPlan(id) { S.selectedPlan = PLANS.find(function(p){return p.id===id}); render(); document.body.style.overflow='hidden'; }
function closePlan() { S.selectedPlan = null; render(); document.body.style.overflow=''; }

  var p = S.selectedPlan;
  var roi = ((p.daily/p.deposit)*100).toFixed(2);
  var canAfford = Number(S.user.balance) >= p.deposit;
  var btn = canAfford
    ? '<button onclick="closePlan();invest(\''+p.id+'\')" class="w-full btn-green py-4 rounded-2xl text-sm glow-green mb-3">⚡ INVEST NOW — $'+p.deposit.toFixed(2)+'</button>'
    : '<button onclick="closePlan();setTab(\'wallet\')" class="w-full py-4 rounded-2xl text-sm font-black mb-3" style="background:linear-gradient(135deg, #FBBF24, #F59E0B); color:#000;">💰 ADD FUNDS TO INVEST</button>';

function quickInvest(id) {
  var p = PLANS.find(function(x){return x.id===id});
  if (!p) return;
  if (Number(S.user.balance) < p.deposit) {
    if (confirm('💰 Insufficient balance!\n\nYou need $'+p.deposit.toFixed(2)+' but have $'+fmt(S.user.balance)+'.\n\nAdd funds now?')) setTab('wallet');
    return;
  }
  invest(id);
}

var selM = 0;
function selMethod(i) {
  selM = i;
  var els = document.querySelectorAll('[id^="m-"]');
  for(var x=0;x<els.length;x++) els[x].className = 'px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap '+(x===i?'bg-toxic text-black':'bg-white/5 text-gray-400');
  var addrs = [CONFIG.upi, CONFIG.usdtBep20, CONFIG.usdtTrc20, CONFIG.btcBep20];
  $('payAddr').innerText = addrs[i];
  var data = i === 0 ? encodeURIComponent('upi://pay?pa='+CONFIG.upi+'&pn='+CONFIG.upiName+'&cu=INR') : addrs[i];
  $('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+data;
  if (i === 0) { $('utrWrap').style.display='block'; $('txWrap').style.display='none'; $('depBtn').innerText='Submit UTR'; }
  else { $('utrWrap').style.display='none'; $('txWrap').style.display='block'; $('depBtn').innerText='Submit TxHash'; }
}

function historyTab() {
  var tx = S.transactions;
  var h = '<div class="glass-card text-center mb-3"><p class="text-[10px] text-gray-500 mb-2 tracking-[0.2em]">TOTAL TRANSACTIONS</p><p class="text-4xl font-black text-white">'+tx.length+'</p></div>';
  if (tx.length === 0) return h + '<div class="glass-card text-center py-12"><div class="text-4xl mb-3 opacity-40">📋</div><p class="text-lg font-black mb-2">No transactions yet</p><p class="text-xs text-gray-500">Your activity will appear here</p></div>';
  return h + tx.map(function(t){
    var isCredit = t.type === 'deposit' || t.type === 'daily_collect';
    var col = isCredit ? 'text-toxic' : 'text-red-400';
    var sign = isCredit ? '+' : '-';
    var badge = t.status === 'pending' ? 'bg-yellow-400/10 text-yellow-400' : (t.status === 'approved' ? 'bg-toxic/20 text-toxic' : 'bg-red-500/20 text-red-400');
    var label = t.type === 'daily_collect' ? 'Daily Reward' : t.type;
    return '<div class="glass-card flex justify-between items-center mb-2"><div><p class="font-bold text-sm capitalize">'+label+'</p><p class="text-[10px] text-gray-500">'+t.method+'</p></div><div class="text-right"><p class="mono font-black '+col+'">'+sign+'$'+fmt(t.amount)+'</p><span class="text-[9px] px-2 py-1 rounded-full '+badge+'">'+t.status+'</span></div></div>';
  }).join('');
}

    + '<div class="rounded-lg p-2.5" style="background:rgba(0,255,102,0.07);"><p class="text-gray-500">L2</p><p class="text-toxic font-black mt-1">5%</p></div>'
    + '<div class="rounded-lg p-2.5" style="background:rgba(0,255,102,0.07);"><p class="text-gray-500">L3</p><p class="text-toxic font-black mt-1">2%</p></div>'
    + '<div class="rounded-lg p-2.5 col-span-3" style="background:rgba(255,255,255,0.03);"><p class="text-gray-500">Levels 4 – 10</p><p class="text-gray-300 font-black mt-1">1% each</p></div></div></div></div>';
}

function openProfile() { S.showProfile = true; render(); document.body.style.overflow = 'hidden'; }
function closeProfile() { S.showProfile = false; render(); document.body.style.overflow = ''; }

function renderProfileModal() {
  if (!S.showProfile || !S.user) return '';
  var u = S.user;
  return '<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,0.92); backdrop-filter: blur(12px);" onclick="closeProfile()">'
    + '<div class="glass-card w-full max-w-md modal-anim" onclick="event.stopPropagation()" style="max-height:90vh; overflow-y:auto;">'
    + '<div class="flex justify-between items-center mb-5"><span class="text-[10px] text-gray-500 font-bold tracking-[0.2em]">MY PROFILE</span><button onclick="closeProfile()" class="w-8 h-8 rounded-full glass flex items-center justify-center text-gray-400 text-xl">×</button></div>'
    + '<div class="text-center mb-6"><div class="avatar-ring inline-block"><div class="avatar-inner w-20 h-20 flex items-center justify-center text-toxic font-black text-3xl">'+u.username[0].toUpperCase()+'</div></div>'
    + '<h2 class="text-2xl font-black text-white mt-3">'+u.username+'</h2><p class="text-[10px] text-gray-500 mt-1 tracking-wider">ID: '+u.user_id+'</p></div>'
    + '<div class="space-y-2 mb-4">'
    + '<div class="flex justify-between items-center p-3 rounded-xl" style="background:rgba(0,0,0,0.45);"><span class="text-xs text-gray-500">📧 Email</span><span class="text-xs text-white font-medium">'+(u.email||'—')+'</span></div>'
    + '<div class="flex justify-between items-center p-3 rounded-xl" style="background:rgba(0,0,0,0.45);"><span class="text-xs text-gray-500">📱 Phone</span><span class="text-xs text-white font-medium">'+(u.phone||'—')+'</span></div>'
    + '<div class="flex justify-between items-center p-3 rounded-xl" style="background:rgba(0,0,0,0.45);"><span class="text-xs text-gray-500">🎫 Referral</span><span class="text-xs text-toxic font-mono font-bold">'+(u.referral_code||'—')+'</span></div>'
    + '<div class="flex justify-between items-center p-3 rounded-xl" style="background:rgba(0,0,0,0.45);"><span class="text-xs text-gray-500">💰 Balance</span><span class="text-xs text-toxic font-mono font-black">$'+fmt(u.balance)+'</span></div>'
    + '<div class="flex justify-between items-center p-3 rounded-xl" style="background:rgba(0,0,0,0.45);"><span class="text-xs text-gray-500">📅 Joined</span><span class="text-xs text-white font-medium">'+(u.joined_at?String(u.joined_at).slice(0,10):'—')+'</span></div></div>'
    + '<div style="height:1px;background:rgba(255,255,255,0.06);margin:16px 0"></div>'
    + '<p class="text-[10px] text-gray-500 font-bold mb-3 tracking-[0.2em]">🔐 CHANGE PASSWORD</p>'
    + '<input type="password" id="oldPw" class="input-dark mb-3" placeholder="Current Password">'
    + '<input type="password" id="newPw" class="input-dark mb-3" placeholder="New Password (min 4 chars)">'
    + '<input type="password" id="newPw2" class="input-dark mb-4" placeholder="Confirm New Password">'
    + '<button onclick="changePassword()" class="btn-green w-full py-3 rounded-2xl text-sm mb-3 glow-green">UPDATE PASSWORD</button>'
    + '<button onclick="closeProfile();doLogout()" class="w-full py-3 rounded-2xl text-xs font-bold" style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#EF4444;">🚪 Logout</button>'
    + '</div></div>';
}

function changePassword() {
  var oldPw = $('oldPw').value, newPw = $('newPw').value, newPw2 = $('newPw2').value;
  if (!oldPw || !newPw || !newPw2) return alert('Fill all fields');
  if (newPw.length < 4) return alert('New password must be 4+ characters');
  if (newPw !== newPw2) return alert('Passwords do not match');
  var stored = localStorage.getItem('toxic_pwd_' + S.user.user_id);
  if (stored && stored !== oldPw) return alert('❌ Current password incorrect');
  localStorage.setItem('toxic_pwd_' + S.user.user_id, newPw);
  $('oldPw').value = ''; $('newPw').value = ''; $('newPw2').value = '';
  alert('✅ Password updated!');
}

function goSignup(){ S.tab='signup'; S.signupStep=1; render(); }
function goSignin(){ S.tab='signin'; render(); }
function saveCountry(v){ S.signupData.country = v; }

function nextStep(n) {
  if (n === 2) {
    if (!S.signupData.country && $('countrySel')) S.signupData.country = $('countrySel').value;
    if (!S.signupData.country) return alert('Please select a country');
  }
  if (n === 3) {
    S.signupData.firstName = $('fn').value;
    S.signupData.lastName = $('ln').value;
    S.signupData.email = $('em').value;
    S.signupData.phone = $('ph').value;
    if (!S.signupData.firstName || !S.signupData.email) return alert('Fill Name and Email');
  }
  S.signupStep = n;
  render();
}

async function finishSignup() {
  var un = $('un').value.trim(), pw = $('pw').value, pw2 = $('pw2').value;
  if (!un || un.length < 3) return alert('Username 3+ chars');
  if (!pw || pw.length < 4) return alert('Password 4+ chars');
  if (pw !== pw2) return alert('Passwords do not match');

  var userId = 'TG' + Date.now();
  var refCode = 'TOXIC' + Math.floor(1000 + Math.random()*9000);

  S.user = { user_id: userId, username: un, email: S.signupData.email || '', phone: S.signupData.phone || '', balance: 0, referral_balance: 0, invested: 0, activated: 0, earned: 0, ceiling: 0, referral_code: refCode, referred_by: null, is_banned: false, joined_at: new Date().toISOString() };
  S.plans = [];
  localStorage.setItem('toxic_pwd_' + userId, pw);

  if (sb) {
    try { await sb.from("users").insert([{ user_id: userId, username: un, email: S.signupData.email || '', phone: S.signupData.phone || '', balance: 0, referral_balance: 0, invested: 0, referral_code: refCode, is_banned: false }]); } catch(e){ console.log(e); }
  }
  S.tab = 'dashboard';
  save(); render();
  alert('✅ Welcome to TOXIC!\n\nAccount created.');
}

async function doSignIn() {
  var u = $('signinUser').value.trim(), p = $('signinPass').value;
  if (!u || !p) return alert('Enter username and password');
  var existing = JSON.parse(localStorage.getItem('toxic_user') || 'null');
  if (existing && existing.username === u) {
    var stored = localStorage.getItem('toxic_pwd_' + existing.user_id);
    if (stored && stored !== p) return alert('❌ Incorrect password');
    S.user = existing;
    S.plans = JSON.parse(localStorage.getItem('toxic_plans') || '[]');
    S.tab = 'dashboard'; save();
    await syncUserData(); render(); return;
  }
  if (sb) {
    try {
      var result = await sb.from("users").select("*").eq("username", u).limit(1);
      if (result.data && result.data.length > 0) {
        S.user = result.data[0];
        S.tab = 'dashboard'; save();
        await syncUserData(); render(); return;
      }
    } catch(e){ console.log(e); }
  }
  alert('⚠️ User not found. Please sign up first.');
}

function doLogout() {
  if (!confirm('Logout from TOXIC?')) return;
  localStorage.removeItem('toxic_user');
  localStorage.removeItem('toxic_plans');
  S.user = null; S.plans = []; S.showProfile = false; S.tab = 'signin'; render();
}

async function invest(id) {
  var p = PLANS.find(function(x){return x.id===id});
  if (!p) return;
  if (Number(S.user.balance) < p.deposit) return alert('💰 Insufficient balance.');
  var now = new Date();
  var newPlan = { user_id: S.user.user_id, username: S.user.username, plan_id: p.id, plan_name: p.name, deposit: p.deposit, daily: p.daily, total: p.total, days_collected: 0, status: 'active', started_at: now.toISOString(), expires_at: new Date(now.getTime() + 40*DAY).toISOString() };
  S.user.balance = Number(S.user.balance) - p.deposit;
  S.user.invested = Number(S.user.invested||0) + p.deposit;
  if (sb) {
    try {
      var r = await sb.from("user_plans").insert([newPlan]).select();
      if (r.data && r.data[0]) newPlan = r.data[0];
      await sb.from("users").update({balance: S.user.balance, invested: S.user.invested}).eq("user_id", S.user.user_id);
    } catch(e){ console.log(e); }
  }
  S.plans.unshift(newPlan);
  save(); render();
  alert('🎉 INVESTMENT SUCCESSFUL!\n\nPlan: '+p.name+'\nInvested: $'+p.deposit.toFixed(2)+'\n\n💰 Aaj ka daily earning abhi collect kar sakte ho!');
}

async function collectPlan(planId) {
  var pl = S.plans.find(function(x){ return String(x.id) === String(planId) });
  if (!pl) return;
  var plan = PLANS.find(function(x){ return x.id === pl.plan_id }) || { daily: pl.daily, name: pl.plan_name };
  if (Date.now() < getNextCollect(pl)) return alert('⏳ Not ready yet.');
  if ((Number(pl.days_collected)||0) >= 40) return alert('Plan completed!');
  var reward = Number(pl.daily);
  S.user.balance = Number(S.user.balance||0) + reward;
  S.user.earned = Number(S.user.earned||0) + reward;
  pl.days_collected = (Number(pl.days_collected)||0) + 1;
  var completed = pl.days_collected >= 40;
  if (completed) pl.status = 'completed';
  S.transactions.unshift({ type:'daily_collect', amount: reward, status:'approved', method: plan.name, date: new Date().toISOString() });
  if (sb) {
    try {
      await sb.from("user_plans").update({days_collected: pl.days_collected, status: pl.status}).eq("id", pl.id);
      await sb.from("users").update({balance: S.user.balance, earned: S.user.earned}).eq("user_id", S.user.user_id);
    } catch(e){ console.log(e); }
  }
  save(); render();
  if (completed) alert('🎉 PLAN COMPLETED!\n\nCollected $'+reward.toFixed(2)+'\nTotal: $'+Number(pl.total).toFixed(2));
  else alert('💰 COLLECTED $'+reward.toFixed(2)+'!\n\nDay '+pl.days_collected+' / 40\n\nNext collect in 24 hours.');
}

async function submitDeposit() {
  var amt = parseFloat($('depAmt').value);
  var isCrypto = selM !== 0;
  var utr = $('depUtr') ? $('depUtr').value.trim() : '';
  var tx = $('depTx') ? $('depTx').value.trim() : '';
  var ref = isCrypto ? tx : utr;
  if (!amt || amt < CONFIG.minDeposit) return alert('Min deposit $'+CONFIG.minDeposit);
  if (isCrypto && !ref) return alert('Enter TxHash');
  if (!isCrypto && utr.length !== 12) return alert('Enter valid 12-digit UTR');
  var method = ['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][selM];
  S.transactions.unshift({ type:'deposit', amount:amt, ref:ref, status:'pending', method:method, date: new Date().toISOString() });
  if (sb) { try { await sb.from("deposits").insert([{ user_id: S.user.user_id, username: S.user.username, amount: amt, method: method, ref: ref, status: 'pending' }]); } catch(e){ console.log(e); } }
  save(); $('depAmt').value='';
  if ($('depUtr')) $('depUtr').value='';
  if ($('depTx')) $('depTx').value='';
  alert('✅ Deposit submitted!\n\nAdmin will verify within 24 hours.');
}

async function submitWithdraw() {
  var amt = parseFloat($('wdAmt').value);
  var addr = $('wdAddr').value.trim();
  if (!amt || amt < CONFIG.minWithdraw) return alert('Min withdrawal $'+CONFIG.minWithdraw);
  if (!addr) return alert('Enter USDT address');
  if (Number(S.user.balance) < amt) return alert('Insufficient balance');
  var fee = amt * CONFIG.withdrawFee;
  S.user.balance -= amt;
  S.transactions.unshift({ type:'withdrawal', amount:amt-fee, status:'pending', method:'USDT', date: new Date().toISOString() });
  if (sb) { try { await sb.from("withdrawals").insert([{ user_id: S.user.user_id, username: S.user.username, amount: amt - fee, address: addr, status: 'pending' }]); await sb.from("users").update({balance: S.user.balance}).eq("user_id", S.user.user_id); } catch(e){ console.log(e); } }
  save(); render();
  alert('✅ Withdrawal requested!\n\nAmount: $'+fmt(amt-fee)+'\n(5% fee: $'+fmt(fee)+')');
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function(){alert('✅ Copied!')}).catch(function(){
    var el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); alert('✅ Copied!');
  });
}

try { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } } catch(e){}
if (!S.user) S.tab = 'signup';
(async function init(){ if (S.user && S.user.user_id) await syncUserData(); render(); })();
setInterval(async function(){
  if (S.user && S.user.user_id) {
    await syncUserData();
    if (S.tab === 'history' || S.tab === 'dashboard' || S.tab === 'active') render();
    else updateDynamic();
  }
}, 30000);
