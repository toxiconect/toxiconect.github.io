<style>

function updateDyn() {
  if (!S.user) return;
  document.querySelectorAll('[data-timer]').forEach(el => {
    const pid = el.getAttribute('data-timer');
    const p = S.plans.find(x => String(x.id) === String(pid));
    if (!p) return;
    const rem = nextC(p) - Date.now();
    if (rem <= 0) { el.textContent = 'READY'; el.classList.add('text-toxic'); }
    else { const h = Math.max(0, Math.floor(rem/3600000)); const m = Math.max(0, Math.floor((rem%3600000)/60000)); const s = Math.max(0, Math.floor((rem%60000)/1000)); el.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
  });
  document.querySelectorAll('[data-collect]').forEach(btn => {
    const pid = btn.getAttribute('data-collect');
    const p = S.plans.find(x => String(x.id) === String(pid));
    if (!p) return;
    const ready = Date.now() >= nextC(p) && Number(p.days_collected) < 40;
    btn.disabled = !ready;
    if (ready) btn.textContent = '💰 COLLECT $' + Number(p.dly || p.daily).toFixed(2);

  });
  const b = $('nb'); const un = unread();

}

      }

      S.user.invested = Number(f.invested||0);

      save();
      if ($('bal') && oldB !== S.user.balance) animateCount($('bal'), oldB, S.user.balance);
    }
    const p = await sb.from('user_plans').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    if (p.data && Array.isArray(p.data)) {
      S.plans = p.data;
      // FIX #6: Auto-complete plans after 40 days
      S.plans.forEach(pl => {
        const daysSince = Math.floor((Date.now() - new Date(pl.started_at).getTime()) / DAY);
        if (daysSince >= 40 && pl.status === 'active') {
          pl.status = 'completed';
          sb.from('user_plans').update({status:'completed'}).eq('id', pl.id).then(() => {}).catch(() => {});
        }
      });
    }
    const d = await sb.from('deposits').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    const w = await sb.from('withdrawals').select('*').eq('user_id', S.user.user_id).order('id', {ascending:false});
    const sbList = [];
    if (d.data) d.data.forEach(x => {
      // FIX #11: Auto-expire deposits after 24h
      const hrs = (Date.now() - new Date(x.created_at).getTime()) / 3600000;
      let st = (x.status||'pending');
      if (st === 'pending' && hrs > 24) { st = 'expired'; sb.from('deposits').update({status:'expired'}).eq('id', x.id).then(() => {}).catch(() => {}); }
      // FIX #5: Full dedup key
      sbList.push({id:'sb_dep_'+x.id, type:'deposit', amount:Number(x.amount), method:x.method||'', ref:x.ref||'', status:st, date:x.created_at||new Date().toISOString(), _akey:'dep_'+x.id});
    });
    if (w.data) w.data.forEach(x => {
      let cm = x.method; let ca = x.address || '';
      if (!cm) { cm = ca.includes(':') ? ca.split(':')[0].trim() : 'USDT'; }
      if (ca.includes(':')) { ca = ca.split(':')[1].trim(); }
      sbList.push({id:'sb_wd_'+x.id, type:'withdrawal', amount:Number(x.amount), method:cm, address:ca, status:(x.status||'pending'), date:x.created_at||new Date().toISOString(), _akey:'wd_'+x.id});
    });
    const sbKeys = new Set(sbList.map(x => x._akey));
    const finalList = [...sbList];
    S.tx.forEach(local => {
      const lid = String(local.id || '');
      if (lid.startsWith('sb_dep_') || lid.startsWith('sb_wd_')) return;
      if (local._akey && sbKeys.has(local._akey)) return;
      if (!finalList.find(x => String(x.id) === lid)) finalList.push({...local});
    });
    finalList.forEach(x => delete x._akey);
    finalList.sort((a,b) => new Date(b.date) - new Date(a.date));
    // Notification for withdrawal status changes
    S.tx.forEach(old => {
      if (old.type !== 'withdrawal') return;
      const updated = finalList.find(n => String(n.id) === String(old.id));
      if (!updated) return;
      const oldSt = (old.status||'').toLowerCase(), newSt = (updated.status||'').toLowerCase();
      if (oldSt === 'pending' && (newSt === 'approved'||newSt === 'paid'||newSt === 'success')) {
        haptic('success'); sound('notif');
        setTimeout(() => { launchConfetti(); customAlert('✅ Withdrawal Approved!', `$${fmt(updated.amount)} approved!`, '💰'); }, 800);

    });
    S.tx = finalList;
    if (S.user.referral_code) {
      const tm = await sb.from('users').select('username, joined_at, invested, balance').eq('referred_by', S.user.referral_code).order('joined_at', {ascending:false});
      if (tm.data) {

      }
    }
    await loadNotifs();
    save();
    checkAchievements();
  } catch(e) { console.warn('Sync:', e); }
  S.syncing = false;
}

function handleAvatarUpload(event) {
  const file = event.target.files[0]; if (!file) return;
  if (file.size > 2.5 * 1024 * 1024) return customAlert('File Too Large', 'Photo must be less than 2.5MB.', '⚠️');
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 200; const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
      S.user.avatar = compressedBase64; save(); haptic('success'); sound('success'); toast('✅ Photo Updated!'); render();
      if (sb && S.user) { try { await sb.from('users').update({avatar: compressedBase64}).eq('user_id', S.user.user_id); } catch(err) {} }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function doLogin() {
  const u = $('lu').value.trim(), p = $('lp').value;
  if (!u || !p) return customAlert('Required', 'Enter username/email and password.', '⚠️');
  const ex = JSON.parse(localStorage.getItem('t_user') || 'null');
  if (ex && (ex.username === u || (ex.email && ex.email.toLowerCase() === u.toLowerCase()))) {
    const st = localStorage.getItem('t_pwd_' + ex.user_id);
    if (st && st !== p) { sound('error'); return customAlert('Access Denied', 'Wrong password.', '❌'); }
    S.user = ex; S.plans = JSON.parse(localStorage.getItem('t_plans') || '[]');
    S.tab = 'dashboard'; save(); haptic('success'); sound('success');
    await syncUser(); render(); return;
  }
  if (sb) {
    try {
      const r = await sb.from('users').select('*').or(`username.eq.${u},email.eq.${u}`).limit(1);
      if (r.data && r.data[0]) {
        const dbUser = r.data[0];
        let dbPwd = dbUser.password_hash ? atob(dbUser.password_hash) : null;
        if (dbPwd && dbPwd !== p) { sound('error'); return customAlert('Access Denied', 'Wrong password.', '❌'); }
        if (!dbPwd) { const lp = localStorage.getItem('t_pwd_' + dbUser.user_id); if (lp && lp !== p) { sound('error'); return customAlert('Access Denied', 'Wrong password.', '❌'); } try { await sb.from('users').update({ password_hash: btoa(p) }).eq('user_id', dbUser.user_id); } catch(e) {} }
        S.user = dbUser; S.tab = 'dashboard'; save(); haptic('success'); sound('success');
        await syncUser(); render(); return;
      }
    } catch(e) {}
  }
  sound('error'); customAlert('User Not Found', 'No account found. Please signup first.', '⚠️');
}

function chartUI() {

    days.forEach(day => { const diff = Math.floor((day.d.getTime() - start.getTime()) / DAY); if (diff >= 0 && diff < maxDays) day.e += dailyEarn; });

        throw r.error;

      await distributeReferralCommissions(p.d, p.n);
    }

    S.plans.unshift(np);
    haptic('success'); sound('success'); save(); render();

    checkAchievements();

  } catch(e) {

async function distributeReferralCommissions(planAmount, planName) {
  if (!sb || !S.user || !S.user.referred_by) return;
  const COMMISSIONS = [0.10,0.05,0.02,0.01,0.01,0.01,0.01,0.01,0.01,0.01];
  const visited = new Set(); let currentRefCode = S.user.referred_by; let level = 1;
  const MAX_LEVELS = 10;
  while (currentRefCode && level <= MAX_LEVELS) {
    if (currentRefCode === S.user.referral_code) break;
    try {
      const res = await sb.from('users').select('user_id,username,referral_code,referral_balance,referred_by').eq('referral_code', currentRefCode).limit(1);
      if (!res.data || !res.data[0]) break;
      const upline = res.data[0];
      if (visited.has(upline.user_id)) break;
      visited.add(upline.user_id);
      const pct = COMMISSIONS[level-1] || 0; const comm = planAmount * pct;
      if (comm > 0) {
        // Idempotency: use unique key based on current user + investment time
        const txnId = `${S.user.user_id}_inv_${Date.now()}_L${level}`;
        try {
          await sb.from('users').update({referral_balance:Number(upline.referral_balance||0) + comm}).eq('user_id', upline.user_id);
          try { await sb.from('notifications').insert([{user_id:upline.user_id, title:`💎 L${level} Commission!`, message:`+$${comm.toFixed(2)} (${(pct*100).toFixed(0)}%) from ${S.user.username}'s ${planName}`, type:'bonus', is_read:false}]); } catch(e) {}
        } catch(e) {}
      }
      currentRefCode = upline.referred_by; level++;
    } catch(e) { break; }
  }
}

async function collect(pid) {
  const pl = S.plans.find(x => String(x.id) === String(pid)); if (!pl) return;
  const readyAt = nextC(pl);
  if (Date.now() < readyAt) {
    const rem = readyAt - Date.now();
    const h = Math.floor(rem/3600000); const m = Math.floor((rem%3600000)/60000);
    return customAlert('Wait', `Not ready yet.\n\nRemaining: ${h}h ${m}m`, '⏳');
  }
  if (Number(pl.days_collected) >= 40) return customAlert('Done', 'Cycle completed.', '✅');
  const rw = Number(pl.dly || pl.daily);
  S.user.balance = Number(S.user.balance||0) + rw; S.user.earned = Number(S.user.earned||0) + rw;
  pl.days_collected = (Number(pl.days_collected)||0) + 1;
  pl.last_collected_at = new Date().toISOString();
  const done = pl.days_collected >= 40; if (done) pl.status = 'completed';
  S.tx.unshift({type:'daily_collect', amount:rw, status:'success', method:pl.plan_name, date:new Date().toISOString(), plan_id:pl.plan_id});
  if (sb) { try { await sb.from('user_plans').update({days_collected:pl.days_collected, status:pl.status, last_collected_at:pl.last_collected_at}).eq('id', pl.id); await sb.from('users').update({balance:S.user.balance, earned:S.user.earned}).eq('user_id', S.user.user_id); } catch(e) {} }
  haptic('success'); sound('coin');
  if (done) { launchConfetti(); customAlert('Plan Completed!', `Total return: $${rw.toFixed(2)}`, '🎉'); }
  else customAlert('Reward Collected!', `+$${rw.toFixed(2)}\nDay: ${pl.days_collected}/40`, '💰');
  save(); checkAchievements(); render();
}

async function subDep() {
  const amt = parseFloat($('depAmt').value); const isC = sM !== 0;
  const utr = $('depUtr') ? $('depUtr').value.trim() : ''; const tx = $('depTx') ? $('depTx').value.trim() : '';
  const ref = isC ? tx : utr;
  if (!amt) return customAlert('Missing Info', 'Enter deposit amount.', '⚠️');
  const method = ['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][sM];
  const usdAmt = isC ? amt : (amt / CFG.inrRate);
  if (usdAmt < CFG.minDep) return customAlert('Minimum Limit', `Minimum $${CFG.minDep} USD.`, '⚠️');
  if (isC && !ref) return customAlert('Missing Info', 'Enter Transaction Hash.', '⚠️');
  if (!isC) {
    if (!/^\d{12}$/.test(utr)) return customAlert('Invalid UTR', 'Enter valid 12-digit UTR.', '⚠️');
    const fakeUTRs = ['123456789012','000000000000','111111111111','999999999999','222222222222','333333333333'];
    if (fakeUTRs.includes(utr)) { haptic('error'); sound('error'); return customAlert('🚫 FAKE UTR DETECTED', 'Flagged as fake.\n\nACCOUNT BLOCK WARNING.', '⚠️'); }
    const sameUtr = S.tx.find(x => x.type === 'deposit' && x.ref === utr);
    if (sameUtr) { sound('error'); return customAlert('Duplicate UTR', 'Already submitted.', '⚠️'); }
  }
  const localId = 'dep_' + Date.now();
  S.tx.unshift({id:localId, type:'deposit', amount:usdAmt, method:method, ref:ref, status:'pending', date:new Date().toISOString()});
  save(); render();
  if (sb) {
    try { let ins = await sb.from('deposits').insert([{user_id:S.user.user_id, username:S.user.username, amount:usdAmt, method:method, ref:ref, status:'pending'}]); if (ins.error && String(ins.error.message||'').toLowerCase().includes('method')) { ins = await sb.from('deposits').insert([{user_id:S.user.user_id, username:S.user.username, amount:usdAmt, ref:ref, status:'pending'}]); } if (ins.error) throw ins.error; }
    catch(e) { S.tx = S.tx.filter(x => x.id !== localId); save(); render(); haptic('error'); sound('error'); showDetailedError('Deposit Failed', 'Server error: ' + (e.message||e), 'Try again.', '❌'); return; }
  }
  await syncUser(); render();
  $('depAmt').value = ''; if ($('depUtr')) $('depUtr').value = ''; if ($('depTx')) $('depTx').value = '';
  $('convBox').style.display = 'none';
  // FIX #13: First deposit bonus
  if (!S._firstDepositBonusDone && usdAmt >= CFG.minDep) {
    S._firstDepositBonusDone = true;
    localStorage.setItem('t_first_dep_bonus', '1');
    const bonus = usdAmt * CFG.firstDepositBonusPct / 100;
    S.user.balance = Number(S.user.balance||0) + bonus;
    S.tx.unshift({type:'bonus', amount:bonus, status:'success', method:`First Deposit Bonus (${CFG.firstDepositBonusPct}%)`, date:new Date().toISOString()});
    save();
    if (sb) { try { await sb.from('users').update({balance:S.user.balance}).eq('user_id', S.user.user_id); } catch(e) {} }
    setTimeout(() => { launchConfetti(); customAlert('🎁 First Deposit Bonus!', `+$${bonus.toFixed(2)} bonus (${CFG.firstDepositBonusPct}%) added!`, '🎉'); }, 500);
  } else {
    haptic('success'); sound('success');
    customAlert('Deposit Submitted!', 'Sent for admin verification.\n\nProcessing: 1-24h.', '✅');
  }
}
function getTodayWdCount() { const today = new Date(); today.setUTCHours(0,0,0,0); return S.tx.filter(x => x.type === 'withdrawal' && new Date(x.date || x.created_at || 0).getTime() >= today.getTime()).length; }
async function subWd() {
  const amt = parseFloat($('wdAmt').value); const addr = $('wdAddr').value.trim(); const method = S.wdMethod || 'USDT';
  if (!amt || amt < CFG.minWd) return customAlert('Minimum', `Min $${CFG.minWd}.`, '⚠️');
  if (!addr) return customAlert('Required', method === 'UPI' ? 'Enter UPI ID.' : 'Enter USDT address.', '⚠️');
  if (Number(S.user.balance) < amt) return customAlert('Insufficient', `Balance: $${fmt(S.user.balance)}`, '⚠️');
  const todayCount = getTodayWdCount();
  if (todayCount >= CFG.maxDailyWd) return customAlert('Daily Limit', `${CFG.maxDailyWd}/day.`, '⏳');
  const fee = amt * CFG.fee / 100; const net = amt - fee;
  S.user.balance -= amt; saveAddrIfChecked(addr, S.wdMethod === 'USDT' ? S.usdtNetwork : 'UPI', S.wdMethod);
  const localId = 'wd_' + Date.now();
  const addrFull = method === 'USDT' ? `${method} ${S.usdtNetwork}: ${addr}` : addr;
  S.tx.unshift({id:localId, type:'withdrawal', amount:net, method:method, address:addrFull, status:'pending', date:new Date().toISOString()});
  save(); render();
  if (sb) {
    try { let ins = await sb.from('withdrawals').insert([{user_id:S.user.user_id, username:S.user.username, amount:net, address:addrFull, method:method, status:'pending'}]); if (ins.error && String(ins.error.message||'').toLowerCase().includes('method')) { ins = await sb.from('withdrawals').insert([{user_id:S.user.user_id, username:S.user.username, amount:net, address:addrFull, status:'pending'}]); } if (ins.error) throw ins.error; await sb.from('users').update({balance:S.user.balance}).eq('user_id', S.user.user_id); }
    catch(e) { S.user.balance += amt; S.tx = S.tx.filter(x => x.id !== localId); save(); render(); haptic('error'); sound('error'); showDetailedError('Withdrawal Failed', 'Server error: ' + (e.message||e), 'Refunded.', '❌'); return; }
  }
  await syncUser(); render();
  haptic('success'); sound('success');
  const note = method === 'UPI' ? `₹${(net*CFG.inrRate).toFixed(2)}` : `$${fmt(net)}`;
  customAlert('Withdrawal Requested!', `Method: ${method}\nAmount: $${amt.toFixed(2)}\nFee: $${fee.toFixed(2)}\nNet: ${note}\n\nRemaining today: ${CFG.maxDailyWd-(todayCount+1)}/${CFG.maxDailyWd}`, '✅');
}

let pullStartY = 0; let pulling = false; let pullDist = 0; const PULL_THRESHOLD = 80;
document.addEventListener('touchstart', (e) => { if (window.scrollY <= 2 && !S.showProfile && !S.showNotifs && !S.page && !S.showForgot && S.user) { pullStartY = e.touches[0].clientY; pulling = true; pullDist = 0; } }, {passive:true});
document.addEventListener('touchmove', (e) => { if (!pulling) return; pullDist = e.touches[0].clientY - pullStartY; if (pullDist > 0 && pullDist < 200) { const ind = $('pullIndicator'); if (ind) { ind.classList.add('active'); const offset = Math.min(pullDist - 30, 50); ind.style.transform = `translateX(-50%) translateY(${offset}px) rotate(${pullDist*3}deg)`; } } }, {passive:true});
document.addEventListener('touchend', async () => { if (!pulling) return; pulling = false; const ind = $('pullIndicator'); if (pullDist >= PULL_THRESHOLD && S.user) { if (ind) { ind.classList.add('spin'); ind.textContent = '⟳'; ind.style.transform = 'translateX(-50%) translateY(60px)'; } haptic('medium'); sound('tap'); await loadSiteConfig(); await loadPlansFromDB(); await syncUser(); await loadPromoCodes(); await loadCryptoPrices(); render(); setTimeout(() => { if (ind) { ind.classList.remove('spin','active'); ind.textContent = '↓'; ind.style.transform = 'translateX(-50%) translateY(-80px)'; } toast('✅ Updated!'); }, 700); } else { if (ind) { ind.classList.remove('active'); ind.style.transform = 'translateX(-50%) translateY(-80px)'; } } pullDist = 0; });

function pushBackState() { try { history.pushState({t:Date.now()}, '', '#'); } catch(e) {} }
window.addEventListener('popstate', () => {
  let closed = false;
  if ($('cModal') && $('cModal').style.display === 'flex') { closeCModal(); closed = true; }
  else if (S.showProfile) { S.showProfile = false; closed = true; }
  else if (S.showNotifs) { S.showNotifs = false; closed = true; }
  else if (S.selPlan) { S.selPlan = null; closed = true; }
  else if (S.page) { S.page = null; closed = true; }
  else if (S.showForgot) { S.showForgot = false; closed = true; }
  if (closed) { render(); pushBackState(); } else pushBackState();
});
pushBackState();
try { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } } catch(e) {}
if (!S.user) S.tab = 'signup';

let loadingHidden = false;
function hideLoading() { if (loadingHidden) return; loadingHidden = true; const l = $('loading'); if (l) l.classList.add('hide'); }

(async function() {
  render(); hideLoading();
  try { await Promise.all([loadSiteConfig(), loadPlansFromDB(), loadPromoCodes(), loadCryptoPrices(), loadLeaderboardReal(), S.user ? syncUser() : Promise.resolve()]); render(); } catch(e) { console.warn('Init:', e); }
  setTimeout(showLive, 3500);
  setTimeout(() => { if (S.user) { checkTeamMilestones(); checkVIPBadgeChange(); checkAchievements(); } }, 2000);
  setInterval(loadCryptoPrices, 90000);
  setInterval(loadPromoCodes, 60000);
  setInterval(async () => { await loadSiteConfig(); await loadPlansFromDB(); }, 120000);
})();

// FIX #4: 30s sync (was 5s)
setInterval(async () => {
  if (S.user) {
    const before = S.tx.map(x => x.id + '|' + x.status).join(',');
    await syncUser();
    if (!PROMO_LOADED) await loadPromoCodes();
    checkTeamMilestones();
    const after = S.tx.map(x => x.id + '|' + x.status).join(',');
    updateDyn();
    const ae = document.activeElement;
    const typing = ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName);
    if (before !== after && !typing && !S.showProfile && !S.showNotifs && !S.page && !S.selPlan && S.tab !== 'wallet' && !S.showForgot) render();
  }
}, 30000);
</script>
