function haptic(type='light'){
  try{
    const tg=window.Telegram?.WebApp;
    if(tg&&tg.HapticFeedback){
      if(type==='success'||type==='warning'||type==='error'){
        tg.HapticFeedback.notificationOccurred(type);
      }else{
        tg.HapticFeedback.impactOccurred(type==='medium'?'medium':'light');
      }
    }
  }catch(e){}

  try{
    if(typeof navigator!=='undefined'&&navigator.vibrate){
      if(type==='success') navigator.vibrate([45, 50, 45]);
      else if(type==='warning'||type==='error') navigator.vibrate([80, 50, 80]);
      else if(type==='medium') navigator.vibrate(55);
      else navigator.vibrate(40);
    }
  }catch(e){}
}

function animateCount(elem,start,end,duration=700,prefix='$'){
  if(!elem)return;
  const range=end-start;
  let startTime=null;
  function step(t){
    if(!startTime)startTime=t;
    const progress=Math.min((t-startTime)/duration,1);
    const curr=start+(range*progress);
    elem.textContent=prefix+fmt(curr);
    if(progress<1)requestAnimationFrame(step);
    else elem.textContent=prefix+fmt(end);
  }
  requestAnimationFrame(step);
}

async function autoCredit(){
  if(!S.user)return;
  let tot=0;const now=Date.now();
  for(const pl of S.plans){
    if(pl.status==='completed')continue;
    let days=Number(pl.days_collected)||0;
    if(days>=40){pl.status='completed';continue;}
    const st=new Date(pl.started_at).getTime();
    const passed=Math.floor((now-st)/DAY);
    const max=Math.min(passed+1,40);
    const pend=max-days;
    if(pend>0){
      pl.days_collected=days+pend;
      const rw=pend*Number(pl.dly||pl.daily);
      S.user.balance=Number(S.user.balance||0)+rw;
      S.user.earned=Number(S.user.earned||0)+rw;
      tot+=rw;
      if(pl.days_collected>=40){
        pl.status='completed';
        launchConfetti();
      }
      S.tx.unshift({type:'daily_collect',amount:rw,status:'approved',method:pl.plan_name+' x'+pend,date:new Date().toISOString(),plan_id:pl.plan_id});
      if(sb){try{await sb.from('user_plans').update({days_collected:pl.days_collected,status:pl.status}).eq('id',pl.id);}catch(e){}}
    }
  }
  if(tot>0){
    save();
    if(sb){try{await sb.from('users').update({balance:S.user.balance,earned:S.user.earned}).eq('user_id',S.user.user_id);}catch(e){}}
    setTimeout(()=>toast('💰 +$'+fmt(tot)+' Auto-Credited!'),1200);
  }
}

function updateDyn(){
  if(!S.user)return;
  document.querySelectorAll('[data-timer]').forEach(el=>{
    const pid=el.getAttribute('data-timer');
    const p=S.plans.find(x=>String(x.id)===String(pid));
    if(!p)return;
    const rem=nextC(p)-Date.now();
    if(rem<=0){el.textContent='READY';el.classList.add('text-toxic');}
    else{
      const h=Math.max(0,Math.floor(rem/3600000));
      const m=Math.max(0,Math.floor((rem%3600000)/60000));
      const s=Math.max(0,Math.floor((rem%60000)/1000));
      el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.classList.remove('text-toxic');
    }
  });
  document.querySelectorAll('[data-collect]').forEach(btn=>{
    const pid=btn.getAttribute('data-collect');
    const p=S.plans.find(x=>String(x.id)===String(pid));
    if(!p)return;
    const ready=Date.now()>=nextC(p)&&Number(p.days_collected)<40;
    btn.disabled=!ready;
    if(ready)btn.textContent='💰 COLLECT $'+Number(p.dly||p.daily).toFixed(2);
    else if(Number(p.days_collected)>=40)btn.textContent='✅ COMPLETED';
    else btn.textContent='⏳ WAITING FOR DAILY COLLECT';
  });
  const b=$('nb');const un=unread();
  if(b){if(un>0){b.textContent=un;b.style.display='flex';}else b.style.display='none';}
}

setInterval(updateDyn,1000);

async function syncUser(){
  if(!sb||!S.user)return;
  try{
    const u=await sb.from('users').select('*').eq('user_id',S.user.user_id).limit(1);
    if(u.data&&u.data[0]){
      const f=u.data[0];
      const oldB=Number(S.user.balance||0);
      S.user.balance=Number(f.balance||0);
      S.user.referral_balance=Number(f.referral_balance||0);
      S.user.invested=Number(f.invested||0);
      S.user.earned=Number(f.earned||0);
      if(f.avatar)S.user.avatar=f.avatar;
      save();
      if($('bal')&&oldB!==S.user.balance){
        animateCount($('bal'),oldB,S.user.balance);
      }
    }
    const p=await sb.from('user_plans').select('*').eq('user_id',S.user.user_id).order('id',{ascending:false});
    if(p.data)S.plans=p.data;

    const d=await sb.from('deposits').select('*').eq('user_id',S.user.user_id).order('id',{ascending:false});
    const w=await sb.from('withdrawals').select('*').eq('user_id',S.user.user_id).order('id',{ascending:false});
    
    const list=[];
    if(d.data)d.data.forEach(x=>list.push({
      id: x.id,
      type:'deposit',
      amount:Number(x.amount),
      method:x.method,
      status:x.status,
      date:x.created_at
    }));
    
    if(w.data)w.data.forEach(x=>{
      let cleanMethod = x.method;
      let cleanAddr = x.address || '';
      if(!cleanMethod){
        cleanMethod = cleanAddr.includes(':') ? cleanAddr.split(':')[0].trim() : 'USDT';
      }
      if(cleanAddr.includes(':')){
        cleanAddr = cleanAddr.split(':')[1].trim();
      }
      list.push({
        id: x.id,
        type:'withdrawal',
        amount:Number(x.amount),
        method:cleanMethod,
        address:cleanAddr,
        status:x.status,
        date:x.created_at
      });
    });

    S.tx.filter(x=>x.type==='daily_collect').forEach(dc=>list.push(dc));
    list.sort((a,b)=>new Date(b.date)-new Date(a.date));
    S.tx=list;

    if(S.user.referral_code){
      const tm=await sb.from('users').select('username, joined_at, invested, balance').eq('referred_by', S.user.referral_code).order('joined_at',{ascending:false});
      if(tm.data){
        S.team=tm.data;
      }
    }

    await loadNotifs();
    save();
  }catch(e){
    console.warn('Sync note:', e);
  }
}

function handleAvatarUpload(event){
  const file=event.target.files[0];
  if(!file)return;
  if(file.size>2.5*1024*1024)return customAlert('Image Limit', 'Please choose a photo smaller than 2.5MB.', '⚠️');
  const reader=new FileReader();
  reader.onload=async function(e){
    const base64=e.target.result;
    S.user.avatar=base64;
    save();
    haptic('success');
    toast('✅ Profile Photo Updated!');
    render();
    if(sb&&S.user){
      try{await sb.from('users').update({avatar:base64}).eq('user_id',S.user.user_id);}catch(err){}
    }
  };
  reader.readAsDataURL(file);
}

function chartUI(){
  const days=[];
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){
    const d=new Date(today.getTime()-i*DAY);
    days.push({d:d,e:0,count:0});
  }
  S.plans.forEach(pl=>{
    const start=new Date(pl.started_at);start.setHours(0,0,0,0);
    const dailyEarn=Number(pl.dly||pl.daily)||0;
    const maxDays=Math.min(Number(pl.days_collected)||0,40);
    days.forEach(day=>{
      const diff=Math.floor((day.d.getTime()-start.getTime())/DAY);
      if(diff>=0 && diff<maxDays){
        day.e+=dailyEarn;
        day.count+=1;
      }
    });
  });
  const max=Math.max(...days.map(x=>x.e),0.01);
  const dayNames=['S','M','T','W','T','F','S'];
  const bars=days.map((d,i)=>{
    const pct=(d.e/max)*100;
    const h=pct<8&&d.e>0?8:pct;
    const isToday=i===6;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:36px">
      <div style="width:100%;display:flex;align-items:flex-end;justify-content:center;height:80px">
        <div class="chart-bar ${isToday?'today':'other'}" style="width:80%;height:${h}%"></div>
      </div>
      <span style="font-size:9px;${isToday?'color:#00FF66;font-weight:900':'color:#666'}">${dayNames[d.d.getDay()]}</span>
      <span class="mono" style="font-size:8px;color:#00FF66;font-weight:700">$${d.e.toFixed(2)}</span>
    </div>`;
  }).join('');
  const todayE=days[6].e;
  const weekE=days.reduce((a,b)=>a+b.e,0);
  const todayCount=days[6].count;
  return `<div class="glass-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <p style="font-size:10px;color:#888;font-weight:800;margin:0;letter-spacing:1.5px">📊 PORTFOLIO · LAST 7 DAYS</p>
      <p class="mono text-toxic" style="font-size:10px;font-weight:800;margin:0">+$${fmt(weekE)}</p>
    </div>
    <div style="display:flex;align-items:flex-end;gap:8px;min-width:100%;padding:0 4px">${bars}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
      <div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:12px;text-align:center">
        <p style="font-size:9px;color:#888;margin:0 0 4px;letter-spacing:0.5px">TODAY'S EARNING</p>
        <p class="mono text-toxic" style="font-size:17px;font-weight:900;margin:0">+$${fmt(todayE)}</p>
      </div>
      <div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:12px;text-align:center">
        <p style="font-size:9px;color:#888;margin:0 0 4px;letter-spacing:0.5px">COLLECTIONS TODAY</p>
        <p class="mono" style="font-size:17px;font-weight:900;margin:0">${todayCount}</p>
      </div>
    </div>
  </div>`;
}

async function invest(id){
  const p=PLANS.find(x=>x.id===id);
  if(!p)return;
  if(isActive(id))return customAlert('Plan Active', 'This plan is already active.', '🔒');
  if(Number(S.user.balance)<p.d)return customAlert('Low Balance', 'Insufficient balance in your account.', '💰');
  const now=new Date();
  let np={user_id:S.user.user_id,username:S.user.username,plan_id:p.id,plan_name:p.n,deposit:p.d,daily:p.dly,total:p.t,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*DAY).toISOString()};
  S.user.balance=Number(S.user.balance)-p.d;
  S.user.invested=Number(S.user.invested||0)+p.d;
  
  if(sb){
    try{
      const r=await sb.from('user_plans').insert([np]).select();
      if(r.data&&r.data[0])np=r.data[0];
      await sb.from('users').update({balance:S.user.balance,invested:S.user.invested}).eq('user_id',S.user.user_id);
      
      if(S.user.referred_by){
        const refUserRes=await sb.from('users').select('*').eq('referral_code', S.user.referred_by).limit(1);
        if(refUserRes.data&&refUserRes.data[0]){
          const parent=refUserRes.data[0];
          const comm = p.d * 0.10;
          await sb.from('users').update({
            referral_balance: Number(parent.referral_balance||0) + comm
          }).eq('user_id', parent.user_id);
        }
      }
    }catch(e){}
  }
  S.plans.unshift(np);
  haptic('success');
  save();render();
  customAlert('Investment Successful!', `Plan: ${p.n}\nInvested: $${p.d.toFixed(2)}\n\nCollect your daily profit in 24 hours!`, '🎉');
}

async function collect(pid){
  const pl=S.plans.find(x=>String(x.id)===String(pid));
  if(!pl)return;
  if(Date.now()<nextC(pl))return customAlert('Wait', 'Your daily reward is not ready yet.', '⏳');
  if(Number(pl.days_collected)>=40)return customAlert('Done', 'This plan cycle is completed.', '✅');
  const rw=Number(pl.dly||pl.daily);
  S.user.balance=Number(S.user.balance||0)+rw;
  S.user.earned=Number(S.user.earned||0)+rw;
  pl.days_collected=(Number(pl.days_collected)||0)+1;
  const done=pl.days_collected>=40;
  if(done)pl.status='completed';
  S.tx.unshift({type:'daily_collect',amount:rw,status:'approved',method:pl.plan_name,date:new Date().toISOString(),plan_id:pl.plan_id});
  if(sb){try{await sb.from('user_plans').update({days_collected:pl.days_collected,status:pl.status}).eq('id',pl.id);await sb.from('users').update({balance:S.user.balance,earned:S.user.earned}).eq('user_id',S.user.user_id);}catch(e){}}
  
  haptic('success');
  if(done){
    launchConfetti();
    customAlert('Plan Completed!', `Congratulations! Total return collected: $${rw.toFixed(2)}`, '🎉');
  } else {
    customAlert('Reward Collected!', `Collected: $${rw.toFixed(2)}\nDay: ${pl.days_collected} / 40`, '💰');
  }
  save();render();
}

let sM=0;
function selM(i){
  sM=i;
  document.querySelectorAll('[id^="m-"]').forEach((el,x)=>{
    el.style.background=x===i?'#00FF66':'rgba(255,255,255,0.05)';
    el.style.color=x===i?'#000':'#888';
  });
  const addrs=[CFG.upi,CFG.usdtBep20,CFG.usdtTrc20,CFG.btcBep20];
  $('payAddr').innerText=addrs[i];
  const data=i===0?encodeURIComponent('upi://pay?pa='+CFG.upi+'&pn='+CFG.upiName+'&cu=INR'):addrs[i];
  $('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+data;
  if(i===0){
    $('utrWrap').style.display='block';$('txWrap').style.display='none';
    $('depBtn').innerText='Submit UTR for Verification';$('rateNote').style.display='block';
  } else {
    $('utrWrap').style.display='none';$('txWrap').style.display='block';
    $('depBtn').innerText='Submit TxHash for Verification';$('rateNote').style.display='none';
  }
  convertAmt();

function calcWd(){
  const v=parseFloat($('wdAmt').value||0);
  if(v>=CFG.minWd){
    $('feeBox').style.display='block';
    const fee=v*CFG.fee/100;
    const net=v*(100-CFG.fee)/100;
    $('feeVal').innerText='$'+fee.toFixed(2);
    $('netVal').innerText='$'+net.toFixed(2);
    if(S.wdMethod==='UPI'){
      $('upiCalcRow').style.display='flex';$('netInrVal').innerText='₹'+(net*CFG.inrRate).toFixed(2)+' INR';
    } else {
      $('upiCalcRow').style.display='none';
    }
  } else $('feeBox').style.display='none';
}

async function subDep(){
  const amt=parseFloat($('depAmt').value);
  const isC=sM!==0;
  const utr=$('depUtr')?$('depUtr').value.trim():'';
  const tx=$('depTx')?$('depTx').value.trim():'';
  const ref=isC?tx:utr;
  if(!amt){return customAlert('Missing Info', 'Please enter deposit amount.', '⚠️');}
  if(isC&&!ref){return customAlert('Missing Info', 'Please enter Transaction Hash (TxHash).', '⚠️');}
  if(!isC&&utr.length!==12){return customAlert('Invalid UTR', 'Please enter a valid 12-digit UTR Number.', '⚠️');}
  const method=['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][sM];
  const usdAmt=isC?amt:(amt/CFG.inrRate);
  
  if(sb){
    try{
      await sb.from('deposits').insert([{user_id:S.user.user_id,username:S.user.username,amount:usdAmt,method:method,ref:ref,status:'pending'}]);
    }catch(e){}
  }
  
  await syncUser();
  render();
  $('depAmt').value='';if($('depUtr'))$('depUtr').value='';if($('depTx'))$('depTx').value='';$('convBox').style.display='none';
  haptic('success');
  customAlert('Deposit Submitted!', 'Your payment request has been sent for admin verification within 24 hours.', '✅');
}

/* WITHDRAWAL: INSTANT BALANCE DEDUCTION UPON REQUEST */
async function subWd(){
  const amt=parseFloat($('wdAmt').value);
  const addr=$('wdAddr').value.trim();
  const method=S.wdMethod||'USDT';
  if(!amt||amt<CFG.minWd)return customAlert('Minimum Limit', 'Minimum withdrawal is $' + CFG.minWd, '⚠️');
  if(!addr){
    return customAlert('Required', method==='UPI'?'Please enter your UPI ID':'Please enter USDT address', '⚠️');
  }
  if(Number(S.user.balance)<amt)return customAlert('Insufficient Funds', 'You do not have enough balance.', '⚠️');
  
  S.user.balance = Number(S.user.balance) - amt;
  save();
  render();
  
  if(sb){
    try{
      let res = await sb.from('withdrawals').insert([{
        user_id: S.user.user_id,
        username: S.user.username,
        amount: amt,
        address: `${method}: ${addr}`,
        method: method,
        status: 'pending'
      }]);
      
      if(res.error){
        await sb.from('withdrawals').insert([{
          user_id: S.user.user_id,
          username: S.user.username,
          amount: amt,
          address: `${method}: ${addr}`,
          status: 'pending'
        }]);
      }
      
      await sb.from('users').update({balance: S.user.balance}).eq('user_id', S.user.user_id);
    }catch(e){
      console.warn('Withdrawal error:', e);
    }
  }
  
  await syncUser();
  render();
  
  haptic('success');
  const net = amt * (100 - CFG.fee) / 100;
  const note = method === 'UPI' ? `₹${(net * CFG.inrRate).toFixed(2)} INR` : `$${fmt(net)}`;
  customAlert('Withdrawal Requested!', `Amount: $${fmt(amt)}\nNet Receive: ${note}\n\nBalance deducted instantly. Pending admin verification.`, '✅');
}

    const isDly=x.type==='daily_collect';
    const isC=!isWd;
    const col=isC?'text-toxic':'text-red-400';
    const sign=isC?'+':'-';
    
    const st=(x.status||'pending').toLowerCase();
    let stBadge='background:rgba(251,191,36,0.15);color:#FBBF24';
    let stText='PENDING';
    
    if(st==='approved'||st==='paid'||st==='completed'){
      stBadge='background:rgba(0,255,102,0.15);color:#00FF66';
      stText='APPROVED';
    }else if(st==='rejected'){
      stBadge='background:rgba(239,68,68,0.15);color:#EF4444';
      stText='REJECTED';
    }

      subInfo+=' • '+esc(x.address);

/* TRANSFER REFERRAL BALANCE TO MAIN BALANCE */
async function claimRefToBal(){

function copy(text){
  navigator.clipboard.writeText(text).then(()=>{
    haptic('success');toast('✅ Copied to Clipboard!');
  }).catch(()=>{
    const el=document.createElement('textarea');el.value=text;
    document.body.appendChild(el);el.select();
    document.execCommand('copy');document.body.removeChild(el);
    haptic('success');toast('✅ Copied to Clipboard!');
  });
}
