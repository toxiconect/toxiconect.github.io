function $(id){return document.getElementById(id)}
function fmt(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

async function loadNotifs(){
  if(!sb||!S.user)return;
  try{var r=await sb.from("notifications").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false}).limit(50);if(r.data)S.notifs=r.data}catch(e){}
}
function unread(){return S.notifs.filter(function(n){return !n.is_read}).length}
async function markRead(){
  if(!sb||!S.user)return;
  var un=S.notifs.filter(function(n){return !n.is_read});
  for(var i=0;i<un.length;i++){await sb.from("notifications").update({is_read:true}).eq("id",un[i].id)}
  await sb.from("users").update({unread_count:0}).eq("user_id",S.user.user_id);
  S.user.unread_count=0;
  S.notifs.forEach(function(n){n.is_read=true});
  save();render();
}

async function autoCredit(){
  if(!S.user)return;
  var tot=0,now=Date.now();
  for(var i=0;i<S.plans.length;i++){
    var pl=S.plans[i];
    if(pl.status==='completed')continue;
    var days=Number(pl.days_collected)||0;
    if(days>=40){pl.status='completed';continue}
    var st=new Date(pl.started_at).getTime();
    var passed=Math.floor((now-st)/DAY);
    var max=Math.min(passed+1,40);
    var pend=max-days;
    if(pend>0){
      pl.days_collected=days+pend;
      var rw=pend*Number(pl.dly||pl.daily);
      S.user.balance=Number(S.user.balance||0)+rw;
      S.user.earned=Number(S.user.earned||0)+rw;
      tot+=rw;
      if(pl.days_collected>=40)pl.status='completed';
      S.tx.unshift({type:'daily_collect',amount:rw,status:'approved',method:pl.plan_name+' x'+pend,date:new Date().toISOString()});
      if(sb){try{await sb.from("user_plans").update({days_collected:pl.days_collected,status:pl.status}).eq("id",pl.id)}catch(e){}}
    }
  }
  if(tot>0){
    save();
    if(sb){try{await sb.from("users").update({balance:S.user.balance,earned:S.user.earned}).eq("user_id",S.user.user_id)}catch(e){}}
    setTimeout(function(){toast('💰 +$'+fmt(tot)+' Auto-Credited!')},1200);
  }
}

function updateDyn(){
  if(!S.user)return;
  document.querySelectorAll('[data-timer]').forEach(function(el){
    var pid=el.getAttribute('data-timer');
    var p=S.plans.find(function(x){return String(x.id)===String(pid)});
    if(!p)return;
    var rem=nextC(p)-Date.now();
    if(rem<=0){el.textContent='READY';el.classList.add('text-toxic')}
    else{
      var h=Math.max(0,Math.floor(rem/3600000));
      var m=Math.max(0,Math.floor((rem%3600000)/60000));
      var s=Math.max(0,Math.floor((rem%60000)/1000));
      el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.classList.remove('text-toxic');
    }
  });
  document.querySelectorAll('[data-collect]').forEach(function(btn){
    var pid=btn.getAttribute('data-collect');
    var p=S.plans.find(function(x){return String(x.id)===String(pid)});
    if(!p)return;
    var ready=Date.now()>=nextC(p) && Number(p.days_collected)<40;
    btn.disabled=!ready;
    if(ready)btn.textContent='💰 COLLECT $'+Number(p.dly||p.daily).toFixed(2);
    else if(Number(p.days_collected)>=40)btn.textContent='✅ COMPLETED';
    else btn.textContent='⏳ WAITING FOR DAILY COLLECT';
  });
  if($('bal'))$('bal').textContent='$'+fmt(S.user.balance);
  if($('refb'))$('refb').textContent='$'+fmt(S.user.referral_balance);
  if($('pc'))$('pc').textContent=S.plans.filter(function(p){return Number(p.days_collected)<40}).length;
  var un=unread();
  var b=$('nb');
  if(b){if(un>0){b.textContent=un;b.style.display='flex'}else b.style.display='none'}
}
setInterval(updateDyn,1000);

      S.user.invested=Number(f.invested||0);

    }
    var p=await sb.from("user_plans").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false});
    if(p.data)S.plans=p.data;
    var d=await sb.from("deposits").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false});
    var w=await sb.from("withdrawals").select("*").eq("user_id",S.user.user_id).order("id",{ascending:false});
    S.tx=[];
    if(d.data)d.data.forEach(function(x){S.tx.push({type:'deposit',amount:Number(x.amount),method:x.method,status:x.status,date:x.created_at})});
    if(w.data)w.data.forEach(function(x){S.tx.push({type:'withdrawal',amount:Number(x.amount),method:'USDT',status:x.status,date:x.created_at})});
    S.tx.sort(function(a,b){return new Date(b.date)-new Date(a.date)});
    await loadNotifs();
    save();
  }catch(e){}
}

async function finishSignup(){
  var un=$('un').value.trim(),pw=$('pw').value,pw2=$('pw2').value;
  if(!un||un.length<3)return alert('Username 3+ chars');
  if(!pw||pw.length<4)return alert('Password 4+ chars');
  if(pw!==pw2)return alert('Passwords do not match');
  var uid='TG'+Date.now();
  var rc='TOXIC'+Math.floor(1000+Math.random()*9000);
  S.user={user_id:uid,username:un,email:S.sd.email||'',phone:S.sd.phone||'',balance:0,referral_balance:0,invested:0,earned:0,referral_code:rc,referred_by:S.sd.referredBy,is_banned:false,joined_at:new Date().toISOString()};
  S.plans=[];
  localStorage.setItem('t_pwd_'+uid,pw);
  if(sb){
    try{
      await sb.from("users").insert([{user_id:uid,username:un,email:S.sd.email||'',phone:S.sd.phone||'',balance:0,referral_balance:0,invested:0,referral_code:rc,referred_by:S.sd.referredBy,is_banned:false}]);
      if(S.sd.referredBy){
        try{
          var r=await sb.from("users").select("*").eq("referral_code",S.sd.referredBy).limit(1);
          if(r.data&&r.data[0]){
            var ref=r.data[0];
            await sb.from("users").update({referral_balance:Number(ref.referral_balance||0)+0.10}).eq("user_id",ref.user_id);
          }
        }catch(e){}
      }
    }catch(e){}
  }
  S.tab='dashboard';save();render();
}
async function doLogin(){
  var u=$('lu').value.trim(),p=$('lp').value;
  if(!u||!p)return alert('Enter credentials');
  var ex=JSON.parse(localStorage.getItem('t_user')||'null');
  if(ex&&ex.username===u){
    var st=localStorage.getItem('t_pwd_'+ex.user_id);
    if(st&&st!==p)return alert('❌ Wrong password');
    S.user=ex;S.plans=JSON.parse(localStorage.getItem('t_plans')||'[]');S.tab='dashboard';save();
    await syncUser();await autoCredit();render();return;
  }
  if(sb){
    try{
      var r=await sb.from("users").select("*").eq("username",u).limit(1);
      if(r.data&&r.data[0]){S.user=r.data[0];S.tab='dashboard';save();await syncUser();await autoCredit();render();return}
    }catch(e){}
  }
  alert('⚠️ User not found. Sign up first.');
}
function logout(){

/* PORTFOLIO CHART - Last 7 days daily earning */
function chartUI(){
  var days=[],today=new Date();today.setHours(0,0,0,0);
  for(var i=6;i>=0;i--){var d=new Date(today.getTime()-i*DAY);days.push({d:d,e:0,count:0})}
  S.tx.forEach(function(tx){
    if(tx.type!=='daily_collect')return;
    var td=new Date(tx.date);td.setHours(0,0,0,0);
    for(var i=0;i<days.length;i++){if(days[i].d.getTime()===td.getTime()){days[i].e+=Number(tx.amount);days[i].count++}}
  });
  var max=Math.max.apply(null,days.map(function(x){return x.e}))||1;
  var dayNames=['S','M','T','W','T','F','S'];
  var bars=days.map(function(d,i){
    var pct=(d.e/max)*100;if(pct<5&&d.e>0)pct=5;
    var isToday=i===6;
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1"><div style="width:100%;display:flex;align-items:flex-end;justify-content:center;height:80px"><div class="chart-bar" style="width:100%;height:'+pct+'%;background:'+(isToday?'linear-gradient(180deg,#00FF66,#10B981)':'linear-gradient(180deg,rgba(0,255,102,0.6),rgba(0,255,102,0.15))')+';box-shadow:'+(isToday?'0 0 15px rgba(0,255,102,0.6)':'none')+'"></div></div><span style="font-size:9px" class="'+(isToday?'text-toxic font-black':'text-gray-500')+'">'+dayNames[d.d.getDay()]+'</span><span style="font-size:8px" class="text-toxic">$'+d.e.toFixed(2)+'</span></div>';
  }).join('');
  var todayE=days[6].e;
  var weekE=days.reduce(function(a,b){return a+b.e},0);
  var todayCount=days[6].count;
  return '<div class="glass-card" style="margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><p style="font-size:10px;color:#888;font-weight:700;margin:0">📊 PORTFOLIO · LAST 7 DAYS</p><p class="mono text-toxic" style="font-size:10px;font-weight:700;margin:0">+$'+fmt(weekE)+'</p></div>'
    +'<div style="display:flex;align-items:flex-end;gap:6px;min-width:100%">'+bars+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">'
    +'<div style="background:rgba(0,0,0,0.35);border-radius:12px;padding:10px;text-align:center"><p style="font-size:9px;color:#888;margin:0 0 4px">TODAY\'S EARNING</p><p class="mono text-toxic" style="font-size:16px;font-weight:900;margin:0">+$'+fmt(todayE)+'</p></div>'
    +'<div style="background:rgba(0,0,0,0.35);border-radius:12px;padding:10px;text-align:center"><p style="font-size:9px;color:#888;margin:0 0 4px">COLLECTIONS TODAY</p><p class="mono" style="font-size:16px;font-weight:900;margin:0">'+todayCount+'</p></div>'
    +'</div></div>';
}

async function invest(id){
  var p=PLANS.find(function(x){return x.id===id});
  if(!p)return;
  if(isActive(id))return alert('🔒 Already active.');
  if(Number(S.user.balance)<p.d)return alert('💰 Insufficient balance.');
  var now=new Date();
  var np={user_id:S.user.user_id,username:S.user.username,plan_id:p.id,plan_name:p.n,deposit:p.d,daily:p.dly,total:p.t,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*DAY).toISOString()};
  S.user.balance=Number(S.user.balance)-p.d;
  S.user.invested=Number(S.user.invested||0)+p.d;
  if(sb){
    try{
      var r=await sb.from("user_plans").insert([np]).select();
      if(r.data&&r.data[0])np=r.data[0];
      await sb.from("users").update({balance:S.user.balance,invested:S.user.invested}).eq("user_id",S.user.user_id);
    }catch(e){}
  }
  S.plans.unshift(np);
  save();render();
  alert('🎉 INVESTMENT SUCCESSFUL!\n\nPlan: '+p.n+'\nInvested: $'+p.d.toFixed(2)+'\n\n💰 Collect your first daily reward now!');
}
async function collect(pid){
  var pl=S.plans.find(function(x){return String(x.id)===String(pid)});
  if(!pl)return;
  if(Date.now()<nextC(pl))return alert('⏳ Not ready yet.');
  if(Number(pl.days_collected)>=40)return alert('Completed!');
  var rw=Number(pl.dly||pl.daily);
  S.user.balance=Number(S.user.balance||0)+rw;
  S.user.earned=Number(S.user.earned||0)+rw;
  pl.days_collected=(Number(pl.days_collected)||0)+1;
  var done=pl.days_collected>=40;
  if(done)pl.status='completed';
  S.tx.unshift({type:'daily_collect',amount:rw,status:'approved',method:pl.plan_name,date:new Date().toISOString()});
  if(sb){try{await sb.from("user_plans").update({days_collected:pl.days_collected,status:pl.status}).eq("id",pl.id);await sb.from("users").update({balance:S.user.balance,earned:S.user.earned}).eq("user_id",S.user.user_id)}catch(e){}}
  save();render();
  if(done)alert('🎉 PLAN COMPLETED!\n\nCollected $'+rw.toFixed(2));
  else alert('💰 COLLECTED $'+rw.toFixed(2)+'!\n\nDay '+pl.days_collected+' / 40');
}

var sM=0;
function selM(i){
  sM=i;
  var els=document.querySelectorAll('[id^="m-"]');
  for(var x=0;x<els.length;x++){
    els[x].style.background=x===i?'#00FF66':'rgba(255,255,255,0.05)';
    els[x].style.color=x===i?'#000':'#888';
  }
  var addrs=[CFG.upi,CFG.usdtBep20,CFG.usdtTrc20,CFG.btcBep20];
  $('payAddr').innerText=addrs[i];
  var data=i===0?encodeURIComponent('upi://pay?pa='+CFG.upi+'&pn='+CFG.upiName+'&cu=INR'):addrs[i];
  $('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+data;
  if(i===0){$('utrWrap').style.display='block';$('txWrap').style.display='none';$('depBtn').innerText='Submit UTR';$('rateNote').style.display='block'}
  else{$('utrWrap').style.display='none';$('txWrap').style.display='block';$('depBtn').innerText='Submit TxHash';$('rateNote').style.display='none'}
  convertAmt();
}
function convertAmt(){
  var v=parseFloat($('depAmt').value||0);
  if(sM===0 && v>0){
    $('convBox').style.display='block';
    $('convUsd').innerText='$'+(v/CFG.inrRate).toFixed(2)+' USDT';
  } else $('convBox').style.display='none';
}
function calcWd(){
  var v=parseFloat($('wdAmt').value||0);
  if(v>=CFG.minWithdraw){
    $('feeBox').style.display='block';
    $('feeVal').innerText='$'+(v*CFG.fee/100).toFixed(2);
    $('netVal').innerText='$'+(v*(100-CFG.fee)/100).toFixed(2);
  } else $('feeBox').style.display='none';
}
async function subDep(){
  var amt=parseFloat($('depAmt').value);
  var isC=selM!==0;
  var utr=$('depUtr')?$('depUtr').value.trim():'';
  var tx=$('depTx')?$('depTx').value.trim():'';
  var ref=isC?tx:utr;
  if(!amt)return alert('Enter amount');
  if(isC && !ref)return alert('Enter TxHash');
  if(!isC && utr.length!==12)return alert('Enter 12-digit UTR');
  var method=['UPI','USDT BEP20','USDT TRC20','BTC BEP20'][sM];
  // For UPI, convert INR to USD equivalent for records
  var usdAmt=isC?amt:(amt/CFG.inrRate);
  S.tx.unshift({type:'deposit',amount:usdAmt,ref:ref,status:'pending',method:method,date:new Date().toISOString()});
  if(sb){try{await sb.from("deposits").insert([{user_id:S.user.user_id,username:S.user.username,amount:usdAmt,method:method,ref:ref,status:'pending'}])}catch(e){}}
  save();
  $('depAmt').value='';if($('depUtr'))$('depUtr').value='';if($('depTx'))$('depTx').value='';
  $('convBox').style.display='none';
  alert('✅ Deposit submitted!');
}
async function subWd(){
  var amt=parseFloat($('wdAmt').value);
  var addr=$('wdAddr').value.trim();
  if(!amt||amt<CFG.minWithdraw)return alert('Min $'+CFG.minWithdraw);
  if(!addr)return alert('Enter USDT address');
  if(Number(S.user.balance)<amt)return alert('Insufficient balance');
  var fee=amt*CFG.fee/100;
  S.user.balance-=amt;
  S.tx.unshift({type:'withdrawal',amount:amt-fee,status:'pending',method:'USDT',date:new Date().toISOString()});
  if(sb){try{await sb.from("withdrawals").insert([{user_id:S.user.user_id,username:S.user.username,amount:amt-fee,address:addr,status:'pending'}]);await sb.from("users").update({balance:S.user.balance}).eq("user_id",S.user.user_id)}catch(e){}}
  save();render();
  alert('✅ Withdrawal requested! You will receive $'+fmt(amt-fee));
}

    +'<button onclick="shareTg()" style="width:100%;padding:16px;border-radius:16px;font-size:13px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px"><span style="font-size:24px">📤</span><div style="text-align:left"><p style="font-weight:900;font-size:13px;margin:0">SHARE ON TELEGRAM</p><p style="font-size:10px;opacity:0.7;margin:0">Send to friends</p></div></button>'
    +'<div class="glass-card"><p style="font-size:10px;color:#888;font-weight:700;margin:0 0 12px">💎 COMMISSION LEVELS</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:10px">'
    +'<div style="background:rgba(0,255,102,0.07);padding:10px;border-radius:8px"><p style="color:#888;margin:0">L1</p><p class="text-toxic" style="font-weight:900;margin:4px 0 0">10%</p></div>'
    +'<div style="background:rgba(0,255,102,0.07);padding:10px;border-radius:8px"><p style="color:#888;margin:0">L2</p><p class="text-toxic" style="font-weight:900;margin:4px 0 0">5%</p></div>'
    +'<div style="background:rgba(0,255,102,0.07);padding:10px;border-radius:8px"><p style="color:#888;margin:0">L3</p><p class="text-toxic" style="font-weight:900;margin:4px 0 0">2%</p></div>'
    +'<div style="grid-column:span 3;background:rgba(255,255,255,0.03);padding:10px;border-radius:8px"><p style="color:#888;margin:0">Levels 4 – 10</p><p style="color:#ccc;font-weight:900;margin:4px 0 0">1% each</p></div></div></div></div>';
}

/* NOTIFICATIONS MODAL */
function notifsModal(){
  if(!S.showNotifs)return '';
  var un=unread();
  return '<div style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);overflow-y:auto" onclick="S.showNotifs=false;render()">'
    +'<div class="glass-card modal-anim" onclick="event.stopPropagation()" style="max-width:448px;margin:20px auto;max-height:90vh;overflow-y:auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:18px;font-weight:900;margin:0">🔔 Notifications'+(un>0?' <span style="font-size:11px;background:#EF4444;color:#fff;padding:2px 8px;border-radius:10px;margin-left:6px">'+un+' new</span>':'')+'</h2><button onclick="S.showNotifs=false;render()" style="background:none;border:none;color:#888;font-size:24px;cursor:pointer">×</button></div>'
    +(un>0?'<button onclick="markRead()" class="btn-green" style="width:100%;padding:10px;border-radius:12px;font-size:12px;border:none;margin-bottom:12px">✓ MARK ALL AS READ</button>':'')
    +(S.notifs.length===0?'<div style="text-align:center;padding:40px 0;color:#666"><div style="font-size:36px;margin-bottom:12px">📭</div><p>No notifications yet</p></div>':S.notifs.map(function(n){
      var cls=n.type==='warning'?'warning':n.type==='bonus'?'bonus':n.type==='update'?'update':'info';
      return '<div class="notif-item '+cls+(n.is_read?'':' unread')+'"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><p style="font-weight:800;font-size:13px;margin:0">'+esc(n.title||'Notification')+'</p>'+(n.is_read?'':'<span style="font-size:9px;color:#EF4444;font-weight:700">NEW</span>')+'</div><p style="font-size:12px;color:#ddd;margin:0;line-height:1.5">'+esc(n.message)+'</p><p style="font-size:9px;color:#666;margin:8px 0 0">'+(n.created_at?String(n.created_at).slice(0,16).replace("T"," "):'')+'</p></div>';
    }).join(''))
    +'</div></div>';
}

/* PROFILE MODAL */
function profileModal(){
  if(!S.showProfile||!S.user)return '';
  var u=S.user,lang=localStorage.getItem('t_lang')||'en';
  return '<div style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);overflow-y:auto" onclick="S.showProfile=false;render()">'
    +'<div class="glass-card modal-anim" onclick="event.stopPropagation()" style="max-width:448px;margin:20px auto;max-height:90vh;overflow-y:auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><span style="font-size:10px;color:#888;font-weight:700">MY PROFILE</span><button onclick="S.showProfile=false;render()" style="background:none;border:none;color:#888;font-size:24px;cursor:pointer">×</button></div>'
    +'<div style="text-align:center;margin-bottom:24px"><div class="avatar-ring" style="display:inline-block"><div class="avatar-inner" style="width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900" class="text-toxic">'+u.username[0].toUpperCase()+'</div></div><h2 style="font-size:22px;font-weight:900;margin:12px 0 4px">'+esc(u.username)+'</h2><p style="font-size:10px;color:#888;margin:0">ID: '+esc(u.user_id)+'</p></div>'
    +'<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">'
    +profileRow('📧 Email',u.email||'—')
    +profileRow('📱 Phone',u.phone||'—')
    +profileRow('🎫 Referral',u.referral_code||'—',true)
    +profileRow('💰 Balance','$'+fmt(u.balance),true)
    +profileRow('👥 Referral Bonus','$'+fmt(u.referral_balance),true)
    +profileRow('📅 Joined',u.joined_at?String(u.joined_at).slice(0,10):'—')
    +'</div>'
    +'<div style="height:1px;background:rgba(255,255,255,0.06);margin:16px 0"></div>'
    +'<p style="font-size:10px;color:#888;font-weight:700;margin:0 0 12px">🌐 LANGUAGE</p>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">'
    +'<button onclick="setLang(\'en\')" style="padding:12px;border-radius:12px;font-size:12px;font-weight:700;border:none;cursor:pointer;'+(lang==='en'?'background:#00FF66;color:#000':'background:rgba(255,255,255,0.05);color:#888')+'">🇬🇧 English</button>'
    +'<button onclick="setLang(\'hi\')" style="padding:12px;border-radius:12px;font-size:12px;font-weight:700;border:none;cursor:pointer;'+(lang==='hi'?'background:#00FF66;color:#000':'background:rgba(255,255,255,0.05);color:#888')+'">🇮🇳 हिंदी</button></div>'
    +'<div style="height:1px;background:rgba(255,255,255,0.06);margin:16px 0"></div>'
    +'<p style="font-size:10px;color:#888;font-weight:700;margin:0 0 12px">🔐 CHANGE PASSWORD</p>'
    +'<input type="password" id="oldPw" class="input-dark" placeholder="Current Password" style="margin-bottom:12px">'
    +'<input type="password" id="newPw" class="input-dark" placeholder="New Password" style="margin-bottom:12px">'
    +'<input type="password" id="newPw2" class="input-dark" placeholder="Confirm New Password" style="margin-bottom:16px">'
    +'<button onclick="changePw()" class="btn-green glow-green" style="width:100%;padding:12px;border-radius:16px;font-size:14px;border:none;margin-bottom:12px">UPDATE PASSWORD</button>'
    +'<button onclick="S.showProfile=false;logout()" style="width:100%;padding:12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#EF4444;cursor:pointer">🚪 Logout</button>'
    +'</div></div>';
}
function profileRow(l,v,green){
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.45);border-radius:12px"><span style="font-size:12px;color:#888">'+l+'</span><span class="mono" style="font-size:12px;font-weight:'+(green?'900':'500')+';color:'+(green?'#00FF66':'#fff')+'">'+esc(v)+'</span></div>';
}
function setLang(l){localStorage.setItem('t_lang',l);render()}
function changePw(){
  var o=$('oldPw').value,n=$('newPw').value,n2=$('newPw2').value;
  if(!o||!n||!n2)return alert('Fill all fields');
  if(n.length<4)return alert('Min 4 chars');
  if(n!==n2)return alert('Passwords do not match');
  var st=localStorage.getItem('t_pwd_'+S.user.user_id);
  if(st&&st!==o)return alert('❌ Wrong current password');
  localStorage.setItem('t_pwd_'+S.user.user_id,n);
  $('oldPw').value='';$('newPw').value='';$('newPw2').value='';
  alert('✅ Password updated!');
}
function copy(text){navigator.clipboard.writeText(text).then(function(){alert('✅ Copied!')}).catch(function(){var el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);alert('✅ Copied!')})}

/* INIT */
try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}}catch(e){}
if(!S.user)S.tab='signup';
(async function init(){
  if(S.user){await syncUser();await autoCredit()}
  render();
  setTimeout(function(){var l=$('loading');if(l)l.classList.add('hide')},1200);
  setTimeout(showLive,3500);
})();
setInterval(async function(){if(S.user){await syncUser();updateDyn()}},30000);
</script>
