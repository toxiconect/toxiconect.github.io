function downloadCSV(filename, rows){
  var csv = rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}

/* ============== DASHBOARD ============== */
function dashV(){
  var days=[];
  for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);days.push({date:d,dep:0,wd:0,users:0});}
  st.deps.forEach(function(x){var dd=new Date(x.created_at);dd.setHours(0,0,0,0);for(var i=0;i<days.length;i++)if(days[i].date.toDateString()===dd.toDateString())days[i].dep+=Number(x.amount||0);});
  st.wd.forEach(function(x){var dd=new Date(x.created_at);dd.setHours(0,0,0,0);for(var i=0;i<days.length;i++)if(days[i].date.toDateString()===dd.toDateString())days[i].wd+=Number(x.amount||0);});
  st.users.forEach(function(x){if(!x.joined_at)return;var dd=new Date(x.joined_at);dd.setHours(0,0,0,0);for(var i=0;i<days.length;i++)if(days[i].date.toDateString()===dd.toDateString())days[i].users++;});
  var maxD=Math.max.apply(null,days.map(function(d){return d.dep;}))||1;
  var maxW=Math.max.apply(null,days.map(function(d){return d.wd;}))||1;
  var maxU=Math.max.apply(null,days.map(function(d){return d.users;}))||1;
  var h='<div class="card"><p style="font-size:11px;color:#00FF66;font-weight:700;margin:0 0 12px">📊 DEPOSITS · LAST 7 DAYS</p><div style="display:flex;align-items:flex-end;gap:6px;height:90px">';
  days.forEach(function(d,i){var pct=(d.dep/maxD)*100;if(pct<5&&d.dep>0)pct=5;var td=i===6;h+='<div style="flex:1;text-align:center"><div style="height:'+pct+'%;background:'+(td?'#00FF66':'rgba(0,255,102,0.4)')+';border-radius:4px 4px 0 0"></div><p style="font-size:8px;color:'+(td?'#00FF66':'#555')+';margin:4px 0 0">'+['S','M','T','W','T','F','S'][d.date.getDay()]+'</p><p style="font-size:8px;color:#888;margin:2px 0 0">$'+d.dep.toFixed(0)+'</p></div>';});
  h+='</div></div>';

  h+='<div class="card"><p style="font-size:11px;color:#EF4444;font-weight:700;margin:0 0 12px">📉 WITHDRAWALS · LAST 7 DAYS</p><div style="display:flex;align-items:flex-end;gap:6px;height:90px">';
  days.forEach(function(d,i){var pct=(d.wd/maxW)*100;if(pct<5&&d.wd>0)pct=5;var td=i===6;h+='<div style="flex:1;text-align:center"><div style="height:'+pct+'%;background:'+(td?'#EF4444':'rgba(239,68,68,0.4)')+';border-radius:4px 4px 0 0"></div><p style="font-size:8px;color:'+(td?'#EF4444':'#555')+';margin:4px 0 0">'+['S','M','T','W','T','F','S'][d.date.getDay()]+'</p><p style="font-size:8px;color:#888;margin:2px 0 0">$'+d.wd.toFixed(0)+'</p></div>';});
  h+='</div></div>';

  h+='<div class="card"><p style="font-size:11px;color:#60A5FA;font-weight:700;margin:0 0 12px">👥 NEW USERS · LAST 7 DAYS</p><div style="display:flex;align-items:flex-end;gap:6px;height:70px">';
  days.forEach(function(d,i){var pct=(d.users/maxU)*100;if(pct<5&&d.users>0)pct=5;var td=i===6;h+='<div style="flex:1;text-align:center"><div style="height:'+pct+'%;background:'+(td?'#60A5FA':'rgba(96,165,250,0.4)')+';border-radius:4px 4px 0 0"></div><p style="font-size:8px;color:'+(td?'#60A5FA':'#555')+';margin:4px 0 0">'+['S','M','T','W','T','F','S'][d.date.getDay()]+'</p><p style="font-size:8px;color:#888;margin:2px 0 0">'+d.users+'</p></div>';});
  h+='</div></div>';

  var top = st.users.slice().sort(function(a,b){return Number(b.balance||0)-Number(a.balance||0);}).slice(0,5);
  h+='<div class="card"><p style="font-size:11px;color:#FFD700;font-weight:700;margin:0 0 12px">🏆 TOP 5 BY BALANCE</p>';
  top.forEach(function(u,i){h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="font-size:11px">'+(i+1)+'. '+esc(u.username||'?')+'</span><span class="g mono" style="font-size:11px">$'+fmt(u.balance)+'</span></div>';});
  h+='</div>';
  return h;
}

/* ============== USERS ============== */
function usersV(){
  var list=st.users.slice();
  if(st.userSearch)list=list.filter(function(u){return (u.username||'').toLowerCase().indexOf(st.userSearch.toLowerCase())>-1||String(u.user_id||'').indexOf(st.userSearch)>-1||(u.email||'').toLowerCase().indexOf(st.userSearch.toLowerCase())>-1;});
  if(st.userFilter==='banned')list=list.filter(function(u){return u.is_banned;});
  else if(st.userFilter==='active')list=list.filter(function(u){return Number(u.invested||0)>0;});
  else if(st.userFilter==='rich')list=list.filter(function(u){return Number(u.balance||0)>=100;});
  var h='<div class="grid2" style="margin-bottom:12px"><input class="inp" placeholder="Search username/id/email..." oninput="st.userSearch=this.value;render()" value="'+esc(st.userSearch)+'"><button class="btn btn-blue" onclick="exportUsers()">📥 Export Users CSV</button></div>';
  h+='<div style="margin-bottom:12px">';
  [['all','All'],['active','Invested'],['rich','High Bal'],['banned','Banned']].forEach(function(f){h+='<button class="filter-btn '+(st.userFilter===f[0]?'on':'')+'" onclick="st.userFilter=\''+f[0]+'\';render()">'+f[1]+'</button>';});
  h+='</div>';
  h+='<p style="font-size:10px;color:#666;margin:0 0 8px">Showing '+list.length+' of '+st.users.length+'</p>';
  if(list.length===0)return h+'<div class="card" style="text-align:center;color:#666;padding:40px">No users</div>';
  list.slice(0,100).forEach(function(u){
    var up=st.userPlans.filter(function(p){return p.user_id===u.user_id;});
    var act=up.find(function(p){return Number(p.days_collected)<40&&p.status!=='completed';});
    h+='<div class="card" onclick="st.selectedUser=\''+esc(u.user_id)+'\';render()" style="cursor:pointer">';
    h+='<div class="row"><div><p style="font-weight:800;margin:0;font-size:15px">'+esc(u.username||'?')+(u.is_banned?' <span class="badge br">BANNED</span>':'')+'</p><p class="lbl" style="margin:4px 0 0">'+esc(u.user_id)+'</p></div><div style="text-align:right"><p class="g" style="font-size:20px;font-weight:900;margin:0">$'+fmt(u.balance)+'</p><p style="font-size:9px;color:#888;margin:2px 0 0">Ref: $'+fmt(u.referral_balance)+'</p></div></div>';
    h+='<div style="display:flex;gap:8px;margin-top:6px;font-size:10px;color:#888">';
    h+='<span>📊 $'+fmt(u.invested)+'</span>';
    h+='<span>💎 '+(up.length)+' plans</span>';
    if(act)h+='<span class="g">▶ '+esc(act.plan_name)+' ('+Number(act.days_collected||0)+'/40)</span>';
    h+='</div></div>';
  });
  return h;
}

function exportUsers(){
  var rows=[['user_id','username','email','balance','referral_balance','invested','earned','referral_code','referred_by','is_banned','joined_at']];
  st.users.forEach(function(u){rows.push([u.user_id,u.username,u.email||'',u.balance||0,u.referral_balance||0,u.invested||0,u.earned||0,u.referral_code||'',u.referred_by||'',u.is_banned?'YES':'NO',u.joined_at||'']);});
  downloadCSV('users_'+Date.now()+'.csv', rows);
  toast('Exported '+st.users.length+' users');
}

/* ============== REFERRAL TREE ============== */
function refTreeV(){
  if(!st.refTreeUser)return '';
  var root = st.users.find(function(x){return x.user_id===st.refTreeUser;});
  if(!root)return '';
  var h='<div class="modal" onclick="st.showRefTree=false;st.refTreeUser=null;render()"><div class="modal-card" onclick="event.stopPropagation()">';
  h+='<div style="display:flex;justify-content:space-between;margin-bottom:16px"><h2 style="font-size:16px;font-weight:900;margin:0">🌳 Referral Tree · '+esc(root.username)+'</h2><button class="btn-xs btn-gray" onclick="st.showRefTree=false;st.refTreeUser=null;render()">✕</button></div>';
  // Walk up
  var upChain=[root];
  var cur=root;
  var safety=0;
  while(cur.referred_by && safety<15){
    var p = st.users.find(function(x){return x.referral_code===cur.referred_by;});
    if(!p)break;
    upChain.unshift(p);
    cur=p;
    safety++;
  }
  h+='<p style="font-size:11px;color:#FBBF24;font-weight:700;margin:0 0 8px">⬆️ UPLINE CHAIN</p>';
  upChain.forEach(function(u,i){
    var isRoot = u.user_id===root.user_id;
    h+='<div style="padding:8px 12px;background:'+(isRoot?'rgba(0,255,102,0.12)':'rgba(0,0,0,0.4)')+';border-radius:8px;margin-bottom:4px;font-size:11px;border:1px solid '+(isRoot?'rgba(0,255,102,0.4)':'rgba(255,255,255,0.08)')+'"><b>L'+i+'</b> · '+esc(u.username)+' <span style="color:#888">('+esc(u.referral_code)+')</span></div>';
  });
  // Down (L1-L10)
  h+='<p style="font-size:11px;color:#00FF66;font-weight:700;margin:16px 0 8px">⬇️ DOWNLINE TREE</p>';
  function getChildren(code){
    return st.users.filter(function(x){return x.referred_by===code;});
  }
  function renderLevel(code, level){
    if(level>10)return '';
    var kids = getChildren(code);
    if(kids.length===0)return '';
    var out='';
    kids.forEach(function(k){
      out+='<div style="margin-left:'+(level*12)+'px;padding:6px 10px;background:rgba(0,255,102,0.04);border-left:2px solid rgba(0,255,102,0.3);border-radius:0 8px 8px 0;margin-bottom:4px;font-size:11px"><b class="g">L'+level+'</b> · '+esc(k.username)+' <span style="color:#888">$'+fmt(k.balance)+'</span></div>';
      out+=renderLevel(k.referral_code, level+1);
    });
    return out;
  }
  var tree = renderLevel(root.referral_code, 1);
  h+=tree||'<p style="font-size:11px;color:#666">No downline yet</p>';
  h+='</div></div>';
  return h;
}

function promoCardHTML(p){

  return '<div class="promo-card '+(isActive?'':'promo-off')+'">'+
    '<div class="row"><div><p style="font-weight:900;margin:0;font-size:16px;letter-spacing:1px;color:#FFD700">'+esc(p.code)+'</p><p class="lbl" style="margin:4px 0 0">'+esc(p.label||'Bonus')+'</p></div><div style="text-align:right"><p class="g" style="font-size:20px;font-weight:900;margin:0">$'+fmt(p.amount)+'</p><span class="badge '+(expired?'br':(p.is_active?'ba':'bp'))+'" style="margin-top:4px">'+(expired?'EXPIRED':(p.is_active?'ACTIVE':'INACTIVE'))+'</span></div></div>'+
    '<div class="divider"></div>'+
    '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:10px;color:#888;margin-bottom:4px"><span>Used: '+used+' / '+max+'</span><span>'+pct.toFixed(0)+'%</span></div><div style="height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:#FFD700"></div></div></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-xs btn-gray" onclick="copyCode(\''+esc(p.code)+'\')">📋 Copy</button><button class="btn-xs btn-blue" onclick="editPromoPrompt('+p.id+')">✏️ Edit</button><button class="btn-xs '+(p.is_active?'btn-yellow':'btn-green')+'" onclick="togglePromo('+p.id+','+(p.is_active?'true':'false')+')">'+(p.is_active?'Disable':'Enable')+'</button><button class="btn-xs btn-red" onclick="deletePromo('+p.id+',\''+esc(p.code)+'\')">🗑️</button></div></div>';
}

function toggleField(key){var el=$('cfg_'+key);if(!el)return;el.value=(el.value==='true')?'false':'true';var isOn=el.value==='true';var pill=$('pill_'+key);if(pill)pill.classList.toggle('on',isOn);var lbl=$('lbl_'+key);if(lbl){lbl.textContent=isOn?'ENABLED':'DISABLED';lbl.style.color=isOn?'#00FF66':'#888';}}
function formatJSON(id){var el=$(id);if(!el)return;try{var obj=JSON.parse(el.value);el.value=JSON.stringify(obj,null,2);toast('Formatted');}catch(e){toast('Invalid: '+e.message,'error');}}

async function saveAllConfig(){
  var updates=[];
  CFG_SECTIONS.forEach(function(sec){
    sec.fields.forEach(function(f){
      var el=$('cfg_'+f.k);
      if(!el)return;
      var val=String(el.value||'').trim();
      if(f.t==='json'){try{var p=JSON.parse(val);val=JSON.stringify(p);}catch(e){return toast('Invalid JSON in "'+f.l+'": '+e.message,'error');}}
      updates.push({key:f.k,value:val,updated_at:new Date().toISOString()});
    });
  });
  if(!confirm('Save '+updates.length+' settings?'))return;
  toast('Saving...','warn');
  var r=await sb.from('site_config').upsert(updates,{onConflict:'key'});
  if(r.error)return toast(r.error.message,'error');
  logAction('Save Config',updates.length+' keys');
  toast(updates.length+' saved!');
  await refresh();
}

  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);

async function quickToggle(k,current){
  var nv = current==='true'?'false':'true';
  var r=await sb.from('site_config').upsert([{key:k,value:nv,updated_at:new Date().toISOString()}],{onConflict:'key'});
  if(r.error)return toast(r.error.message,'error');
  st.siteConfig[k]=nv;
  logAction('Toggle '+k,nv);
  toast(k+' → '+nv);
  render();
}

async function saveQuick(k,inputId){
  var v=$(inputId).value;
  var r=await sb.from('site_config').upsert([{key:k,value:v,updated_at:new Date().toISOString()}],{onConflict:'key'});
  if(r.error)return toast(r.error.message,'error');
  st.siteConfig[k]=v;
  toast('Saved');
}

/* ============== RAW DB BROWSER ============== */
function dbV(){
  var tables=['users','user_plans','deposits','withdrawals','notifications','promo_codes','promo_redemptions','investment_plans','site_config','share_bonus','fake_winners'];
  var h='<div class="card"><p class="g" style="font-size:11px;font-weight:700;margin:0 0 10px">🗄️ RAW TABLE BROWSER</p><p style="font-size:11px;color:#888;margin:0 0 12px">Direct read-only access. Use with caution.</p>';
  h+='<p class="lbl">Table</p><select class="inp" id="rawTable" onchange="loadRaw()">';
  tables.forEach(function(t){h+='<option value="'+t+'" '+(st.rawTable===t?'selected':'')+'>'+t+'</option>';});
  h+='</select>';
  h+='<button class="btn btn-sm" style="width:100%;margin-top:8px" onclick="loadRaw()">🔍 Load</button>';
  h+='</div>';
  if(st.rawTable&&window._rawData){
    h+='<div class="card"><p style="font-size:11px;color:#00FF66;margin:0 0 8px">📊 '+st.rawTable+' ('+window._rawData.length+' rows)</p>';
    h+='<div style="overflow-x:auto"><table><thead><tr>';
    if(window._rawData[0])Object.keys(window._rawData[0]).slice(0,8).forEach(function(k){h+='<th>'+esc(k)+'</th>';});
    h+='</tr></thead><tbody>';
    window._rawData.slice(0,30).forEach(function(row){
      h+='<tr>';
      Object.keys(row).slice(0,8).forEach(function(k){var v=row[k];h+='<td style="font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(String(v).slice(0,50))+'</td>';});
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    h+='<button class="btn btn-sm btn-blue" style="width:100%;margin-top:10px" onclick="exportRaw()">📥 Export</button>';
    h+='</div>';
  }
  return h;
}

async function loadRaw(){
  var t=$('rawTable').value;
  st.rawTable=t;
  toast('Loading '+t+'...','warn');
  var r=await sb.from(t).select('*').limit(500);
  if(r.error)return toast(r.error.message,'error');
  window._rawData=r.data||[];
  toast('Loaded '+window._rawData.length);
  render();
}

function exportRaw(){
  if(!window._rawData||window._rawData.length===0)return;
  var keys=Object.keys(window._rawData[0]);
  var rows=[keys];
  window._rawData.forEach(function(r){rows.push(keys.map(function(k){return r[k];}));});
  downloadCSV(st.rawTable+'_'+Date.now()+'.csv',rows);
  toast('Exported');
}

/* ============== LOGS ============== */
function logsV(){
  if(st.logs.length===0)return '<div class="card" style="text-align:center;color:#666;padding:40px">No logs</div>';
  var h='<div class="grid2" style="margin-bottom:12px"><button class="btn btn-sm btn-blue" onclick="exportLogs()">📥 Export</button><button class="btn btn-sm btn-red" onclick="if(confirm(\'Clear?\')){st.logs=[];localStorage.removeItem(\'toxic_admin_logs\');render()}">🗑️ Clear</button></div>';
  st.logs.slice(0,100).forEach(function(l){
    h+='<div class="card" style="padding:10px 14px"><p class="g" style="font-size:11px;font-weight:700;margin:0 0 4px">'+esc(l.action)+'</p><p style="font-size:11px;color:#ccc;margin:0">'+esc(l.detail)+'</p><p style="font-size:9px;color:#666;margin:4px 0 0">'+new Date(l.time).toLocaleString()+'</p></div>';

function exportLogs(){
  var rows=[['action','detail','time']];
  st.logs.forEach(function(l){rows.push([l.action,l.detail,new Date(l.time).toISOString()]);});
  downloadCSV('logs_'+Date.now()+'.csv',rows);
  toast('Exported');
}

/* ============== ALL FUNCTIONS ============== */
function login(){var p=$('pw').value;if(p!==getAdminPwd())return toast('Wrong password','error');st.login=true;startSession();logAction('Login','');refresh();}
function logout(){if(confirm('Logout?')){logAction('Logout','');st.login=false;endSession();render();}}
function sw(t){st.tab=t;render();}
function openMessage(uid){st.msgUser=uid;st.msgType='info';st.showMessage=true;render();}
function openRefTree(uid){st.refTreeUser=uid;st.showRefTree=true;st.selectedUser=null;render();}

async function refresh(){
  try{
    var u=await sb.from('users').select('*').order('id',{ascending:false});
    if(u.data)st.users=u.data;
    var p=await sb.from('user_plans').select('*').order('id',{ascending:false});
    if(p.data)st.userPlans=p.data;
    var d=await sb.from('deposits').select('*').order('id',{ascending:false});
    if(d.data)st.deps=d.data;
    var w=await sb.from('withdrawals').select('*').order('id',{ascending:false});
    if(w.data)st.wd=w.data;
    var n=await sb.from('notifications').select('*').order('id',{ascending:false}).limit(200);
    if(n.data)st.notifications=n.data;
    var pc=await sb.from('promo_codes').select('*').order('id',{ascending:false});
    if(pc.data)st.promos=pc.data;
    try{var pr=await sb.from('promo_redemptions').select('*').order('id',{ascending:false}).limit(200);if(pr.data)st.promoCodesRedemptions=pr.data;}catch(e){}
    var cfg=await sb.from('site_config').select('*');
    if(cfg.data){var obj={};cfg.data.forEach(function(x){obj[x.key]=x.value;});st.siteConfig=obj;}
    var pl=await sb.from('investment_plans').select('*').order('sort_order',{ascending:true});
    if(pl.data)st.plansDB=pl.data;
    try{var sbr=await sb.from('share_bonus').select('*').order('id',{ascending:false}).limit(200);if(sbr.data)st.shareBonus=sbr.data;}catch(e){st.shareBonus=[];}
    try{var wr=await sb.from('fake_winners').select('*').order('id',{ascending:false}).limit(200);if(wr.data)st.winners=wr.data;}catch(e){st.winners=[];}
    st.lastRefresh=Date.now();
  }catch(e){console.log('Refresh err:',e);toast('Refresh: '+e.message,'error');}
  render();
}

async function sendMessage(){
  var title=$('msgTitle').value.trim()||'TOXIC';
  var body=$('msgBody').value.trim();
  if(!body)return toast('Type a message','error');
  var r=await sb.from('notifications').insert([{user_id:st.msgUser,title:title,message:body,type:st.msgType,is_read:false}]);
  if(r.error)return toast(r.error.message,'error');
  var u=st.users.find(function(x){return x.user_id===st.msgUser;});
  if(u)await sb.from('users').update({unread_count:Number(u.unread_count||0)+1}).eq('user_id',st.msgUser);
  logAction('Message',st.msgUser);
  toast('Sent!');
  st.showMessage=false;st.msgUser=null;
  await refresh();
}

async function sendBroadcast(){
  var title=$('bcTitle').value.trim()||'TOXIC';
  var body=$('bcBody').value.trim();
  if(!body)return toast('Type a message','error');
  if(!confirm('Send to ALL '+st.users.length+' users?'))return;
  toast('Sending...','warn');
  var notifs=st.users.map(function(u){return {user_id:u.user_id,title:title,message:body,type:st.msgType,is_read:false};});
  var r=await sb.from('notifications').insert(notifs);
  if(r.error)return toast(r.error.message,'error');
  for(var i=0;i<st.users.length;i++){await sb.from('users').update({unread_count:Number(st.users[i].unread_count||0)+1}).eq('user_id',st.users[i].user_id);}
  logAction('Broadcast','All');
  toast('Sent to '+st.users.length);
  st.showBroadcast=false;
  await refresh();
}

async function saveUserMeta(){
  var uid=st.selectedUser;
  var email=$('uEmail').value.trim();
  var un=$('uUsername').value.trim();
  var rc=$('uRefCode').value.trim().toUpperCase();
  var rb=$('uRefBy').value.trim().toUpperCase();
  var r=await sb.from('users').update({email:email,username:un,referral_code:rc,referred_by:rb}).eq('user_id',uid);
  if(r.error)return toast(r.error.message,'error');
  logAction('Save User Meta',uid);
  toast('Profile saved');
  await refresh();
  st.selectedUser=uid;
}

async function adminSetBal(uid){var v=$('mBal').value;if(v==='')return toast('Enter amount','error');var r=await sb.from('users').update({balance:parseFloat(v)}).eq('user_id',uid);if(!r.error){logAction('Set Balance',uid+' $'+v);toast('Updated');await refresh();st.selectedUser=uid;}else toast(r.error.message,'error');}
async function adminAddBal(uid){var v=parseFloat($('addBal').value);if(!v)return toast('Enter amount','error');var u=st.users.find(function(x){return x.user_id===uid;});if(!u)return;var nb=Number(u.balance||0)+v;var r=await sb.from('users').update({balance:nb}).eq('user_id',uid);if(!r.error){logAction('Add Balance',uid+' '+(v>0?'+':'')+v);toast('Updated: $'+nb.toFixed(2));await refresh();st.selectedUser=uid;}else toast(r.error.message,'error');}
async function adminSetRefBal(uid){var v=$('mRefBal').value;if(v==='')return toast('Enter amount','error');var r=await sb.from('users').update({referral_balance:parseFloat(v)}).eq('user_id',uid);if(!r.error){logAction('Set Ref Bal',uid);toast('Updated');await refresh();st.selectedUser=uid;}else toast(r.error.message,'error');}
async function adminSetPwd(uid){var p=$('viewPwd').value;if(!p||p.length<4)return toast('Min 4 chars','error');var r=await sb.from('users').update({password_hash:btoaSafe(p)}).eq('user_id',uid);if(!r.error){logAction('Set Pwd',uid);toast('Password set');}else toast(r.error.message,'error');}
function copyText(t){try{navigator.clipboard.writeText(t);toast('Copied');}catch(e){prompt('Copy:',t);}}

async function adminToggleAutoRenew(uid,current){var r=await sb.from('users').update({auto_renew:!current}).eq('user_id',uid);if(!r.error){toast('Toggled');await refresh();st.selectedUser=uid;}}
async function adminResetSpin(uid){var r=await sb.from('users').update({last_spin_at:null}).eq('user_id',uid);if(!r.error){toast('Spin reset');await refresh();st.selectedUser=uid;}}
async function adminResetRefLock(uid){toast('Reset done (app side)');}

async function adminBonus(uid){
  var v=prompt('Bonus ($):');if(!v)return;
  var amt=parseFloat(v);if(!amt||amt<=0)return toast('Invalid','error');
  var u=st.users.find(function(x){return x.user_id===uid;});if(!u)return;
  var nb=Number(u.balance||0)+amt;
  var r=await sb.from('users').update({balance:nb}).eq('user_id',uid);
  if(!r.error){
    await sb.from('notifications').insert([{user_id:uid,title:'Bonus',message:'+$'+amt.toFixed(2)+' credited!',type:'bonus',is_read:false}]);
    await sb.from('users').update({unread_count:Number(u.unread_count||0)+1}).eq('user_id',uid);
    logAction('Bonus',uid+' +$'+v);
    toast('Added');await refresh();st.selectedUser=uid;
  }else toast(r.error.message,'error');
}

async function adminGivePlanPrompt(uid){await adminGivePlan(uid);}
async function adminGivePlan(uid){
  var plans=Object.keys(DEFAULT_PLANS);
  var plan=prompt('Plan name:\n'+plans.join(', '));
  if(!plan)return;
  plan=plan.toUpperCase();
  var p=DEFAULT_PLANS[plan];
  if(!p)return toast('Invalid plan','error');
  var u=st.users.find(function(x){return x.user_id===uid;});if(!u)return;
  var now=new Date();
  var np={user_id:uid,username:u.username,plan_id:p.id,plan_name:plan,deposit:p.deposit,daily:p.daily,total:p.total,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*86400000).toISOString(),last_collect_at:new Date(now.getTime()-86400000).toISOString()};
  var r=await sb.from('user_plans').insert([np]);
  if(!r.error){
    await sb.from('notifications').insert([{user_id:uid,title:'Plan Activated',message:plan+' plan activated. Daily $'+p.daily,type:'bonus',is_read:false}]);
    logAction('Give Plan',uid+' '+plan);
    toast('Given');await refresh();st.selectedUser=uid;
  }else toast(r.error.message,'error');
}

async function toggleBan(uid,current){var r=await sb.from('users').update({is_banned:!current}).eq('user_id',uid);if(!r.error){if(!current)await sb.from('notifications').insert([{user_id:uid,title:'Suspended',message:'Account suspended.',type:'warning',is_read:false}]);logAction(current?'Unban':'Ban',uid);toast(current?'Unbanned':'Banned');await refresh();st.selectedUser=uid;}else toast(r.error.message,'error');}

async function adminDeleteUser(uid,uname){
  if(!confirm('DELETE '+uname+'?\n\nThis removes ALL data!'))return;
  if(!confirm('ABSOLUTELY SURE?'))return;
  toast('Deleting...','warn');
  try{
    await sb.from('user_plans').delete().eq('user_id',uid);
    await sb.from('deposits').delete().eq('user_id',uid);
    await sb.from('withdrawals').delete().eq('user_id',uid);
    await sb.from('notifications').delete().eq('user_id',uid);
    var r=await sb.from('users').delete().eq('user_id',uid);
    if(r.error)return toast(r.error.message,'error');
    logAction('Delete User',uname);
    toast('Deleted');
    st.selectedUser=null;
    await refresh();
  }catch(e){toast(e.message,'error');}
}

async function planAddDays(id,days){
  var p=st.userPlans.find(function(x){return x.id===id;});
  if(!p)return;
  var nc=Number(p.days_collected||0)+days;
  if(nc<0)nc=0;
  if(nc>40)nc=40;
  var r=await sb.from('user_plans').update({days_collected:nc}).eq('id',id);
  if(!r.error){toast('Days: '+nc);await refresh();if(st.selectedUser)st.selectedUser=st.selectedUser;}
  else toast(r.error.message,'error');
}
async function planCollectNow(id){
  var p=st.userPlans.find(function(x){return x.id===id;});
  if(!p)return;
  var r=await sb.from('user_plans').update({last_collect_at:new Date(Date.now()-86400000).toISOString()}).eq('id',id);
  if(!r.error){toast('Collect ready');await refresh();}
  else toast(r.error.message,'error');
}
async function planReset(id){if(!confirm('Reset days to 0?'))return;var r=await sb.from('user_plans').update({days_collected:0}).eq('id',id);if(!r.error){toast('Reset');await refresh();}}
async function planCancel(id){if(!confirm('Cancel plan?'))return;var r=await sb.from('user_plans').update({status:'cancelled'}).eq('id',id);if(!r.error){toast('Cancelled');await refresh();}}

async function addManualDeposit(){
  var uid=$('mdUid').value.trim();
  var amt=parseFloat($('mdAmt').value);
  var method=$('mdMethod').value.trim()||'Manual';
  var credit=$('mdCredit').checked;
  if(!uid||!amt)return toast('Fill all fields','error');
  var r=await sb.from('deposits').insert([{user_id:uid,amount:amt,method:method,status:credit?'approved':'pending'}]);
  if(r.error)return toast(r.error.message,'error');
  if(credit){var u=st.users.find(function(x){return x.user_id===uid;});if(u){await sb.from('users').update({balance:Number(u.balance||0)+amt}).eq('user_id',uid);}}
  logAction('Manual Deposit',uid+' $'+amt);
  toast('Added');
  st.showAddDeposit=false;
  await refresh();
}

async function addManualWithdrawal(){
  var uid=$('mwUid').value.trim();
  var amt=parseFloat($('mwAmt').value);
  var method=$('mwMethod').value.trim();
  var addr=$('mwAddr').value.trim();
  var debit=$('mwDebit').checked;
  if(!uid||!amt)return toast('Fill all fields','error');
  var r=await sb.from('withdrawals').insert([{user_id:uid,amount:amt,method:method,address:addr,status:'approved'}]);
  if(r.error)return toast(r.error.message,'error');
  if(debit){var u=st.users.find(function(x){return x.user_id===uid;});if(u){await sb.from('users').update({balance:Number(u.balance||0)-amt}).eq('user_id',uid);}}
  logAction('Manual WD',uid+' $'+amt);
  toast('Added');
  st.showAddWithdrawal=false;
  await refresh();
}

function openEditTx(type,id){
  st.editTxType = type === 'deposit' ? 'deposits' : 'withdrawals';
  st.editTx = id;
  st.showEditTx = true;
  render();
}
async function saveEditTx(){
  var amt=parseFloat($('etAmt').value);
  var status=$('etStatus').value;
  var note=$('etNote').value;
  var r=await sb.from(st.editTxType).update({amount:amt,status:status,admin_note:note}).eq('id',st.editTx);
  if(r.error)return toast(r.error.message,'error');
  logAction('Edit Tx',st.editTxType+' #'+st.editTx);
  toast('Saved');
  st.showEditTx=false;st.editTx=null;
  await refresh();
}
async function deleteTx(table,id){
  if(!confirm('Delete this row permanently?'))return;
  var r=await sb.from(table).delete().eq('id',id);
  if(!r.error){logAction('Delete Row',table+' #'+id);toast('Deleted');await refresh();}
  else toast(r.error.message,'error');
}

function changeAdminPwd(){
  var o=$('oldPwd').value,n=$('newPwd').value,n2=$('newPwd2').value;
  if(o!==getAdminPwd())return toast('Wrong current','error');
  if(!n||n.length<4)return toast('Min 4 chars','error');
  if(n!==n2)return toast('Do not match','error');
  setAdminPwd(n);
  logAction('Change Admin Pwd','');
  st.showChangePwd=false;
  toast('Changed!');
  render();
}

function initApp(){if(!initSB()){setTimeout(function(){initSB();render();},1500);return;}render();}
initApp();
</script>
