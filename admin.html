function toggleField(key){
  var el=$('cfg_'+key);
  if(!el)return;
  el.value=(el.value==='true')?'false':'true';
  var isOn=el.value==='true';
  var pill=el.parentElement.querySelector('.toggle-pill');
  if(pill)pill.classList.toggle('on',isOn);
  var label=el.parentElement.querySelector('span');
  if(label){label.textContent=isOn?'✓ ENABLED':'✗ DISABLED';label.style.color=isOn?'#00FF66':'#888'}
  if(key==='maintenance_mode'&&isOn){
    var msg=prompt('Maintenance mode is being enabled!\n\nEnter maintenance message:','We are upgrading. Please check back soon!');
    if(msg){var msgEl=$('cfg_maintenance_msg');if(msgEl)msgEl.value=msg}
  }
}

function formatJSON(id){
  var el=$(id);if(!el)return;
  try{var obj=JSON.parse(el.value);el.value=JSON.stringify(obj,null,2);toast('✅ JSON formatted')}
  catch(e){toast('❌ Invalid JSON: '+e.message,'error')}
}

function validateJSON(id){
  var el=$(id);if(!el)return;
  try{JSON.parse(el.value);toast('✅ Valid JSON')}
  catch(e){toast('❌ '+e.message,'error')}
}

async function saveAllConfig(){
  var updates=[];
  CFG_SECTIONS.forEach(function(sec){
    sec.fields.forEach(function(f){
      var el=$('cfg_'+f.k);if(!el)continue;
      var val=String(el.value||'').trim();
      if(f.t==='json'){
        try{var parsed=JSON.parse(val);val=JSON.stringify(parsed)}
        catch(e){return toast('❌ Invalid JSON in "'+f.l+'": '+e.message,'error')}
      }
      updates.push({key:f.k,value:val,updated_at:new Date().toISOString()});
    });
  });
  if(!confirm('Save '+updates.length+' settings?\n\nApp will reflect in 1-2 minutes.'))return;
  toast('Saving...','warn');
  var r=await sb.from("site_config").upsert(updates,{onConflict:'key'});
  if(r.error)return toast('❌ '+r.error.message,'error');
  logAction('Save Config',updates.length+' keys updated');
  toast('✅ All '+updates.length+' settings saved! App updates in 1-2 min.');
  await refreshConfig();
}

async function refreshConfig(){
  var r=await sb.from("site_config").select("*");
  if(r.data){
    var obj={};
    r.data.forEach(function(x){obj[x.key]=x.value});
    st.siteConfig=obj;
  }
  render();
}

function showRawJSON(){

}

async function savePlanDB(){

  var name=$('plName').value.trim().toUpperCase();
  var dep=parseFloat($('plDep').value);
  var daily=parseFloat($('plDaily').value);

  if(!total||total<=0)return toast("Enter valid total",'error');
  var data={plan_key:key,name:name,deposit:dep,daily:daily,total:total,color:color,icon:icon,is_active:active,sort_order:sort};

async function approveSB(id,uid,uname){
  if(!confirm("Approve for "+uname+"?"))return;
  var amt=parseFloat((st.siteConfig&&st.siteConfig.share_bonus)||'0.10');
  var r=await sb.from("share_bonus").update({status:"approved"}).eq("id",id);
  if(r.error)return toast("❌ "+r.error.message,'error');
  var u=st.users.find(function(x){return x.user_id===uid});
  if(u){
    var nb=Number(u.balance||0)+amt;
    await sb.from("users").update({balance:nb}).eq("user_id",uid);
    await sb.from("notifications").insert([{user_id:uid,title:'✅ Share Bonus Approved!',message:'+$'+amt.toFixed(2)+' credited! New balance: $'+nb.toFixed(2),type:'bonus',is_read:false}]);
    await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",uid);
  }
  logAction('Approve Share Bonus',uname+' +$'+amt);
  toast('✅ Approved + $'+amt);
  await refresh();
}

async function rejectSB(id,uid,reason){

function login(){var p=$('pw').value;if(p!==getAdminPwd())return toast("❌ Wrong password",'error');st.login=true;startSession();logAction('Login','Admin logged in');refresh()}
function logout(){if(confirm("Logout?")){logAction('Logout','');st.login=false;endSession();render()}}
function sw(t){st.tab=t;render()}

async function refresh(){
  try{
    var u=await sb.from("users").select("*").order("id",{ascending:false});if(u.data)st.users=u.data;
    var p=await sb.from("user_plans").select("*").order("id",{ascending:false});if(p.data)st.userPlans=p.data;
    var d=await sb.from("deposits").select("*").order("id",{ascending:false});if(d.data)st.deps=d.data;
    var w=await sb.from("withdrawals").select("*").order("id",{ascending:false});if(w.data)st.wd=w.data;
    var n=await sb.from("notifications").select("*").order("id",{ascending:false}).limit(100);if(n.data)st.notifications=n.data;
    var pc=await sb.from("promo_codes").select("*").order("id",{ascending:false});if(pc.data)st.promos=pc.data;
    var cfg=await sb.from("site_config").select("*");if(cfg.data){var obj={};cfg.data.forEach(function(x){obj[x.key]=x.value});st.siteConfig=obj}
    var pl=await sb.from("investment_plans").select("*").order("sort_order",{ascending:true});if(pl.data)st.plansDB=pl.data;
    try{var sbr=await sb.from("share_bonus").select("*").order("id",{ascending:false}).limit(100);if(sbr.data)st.shareBonus=sbr.data}catch(e){st.shareBonus=[]}
    try{var wr=await sb.from("fake_winners").select("*").order("id",{ascending:false}).limit(100);if(wr.data)st.winners=wr.data}catch(e){st.winners=[]}
    st.lastRefresh=Date.now();
  }catch(e){console.log(e);toast('Refresh err: '+e.message,'error')}
  render();
}

function openMessage(uid){st.msgUser=uid;st.msgType='info';st.showMessage=true;render()}
async function sendMessage(){
  var title=$('msgTitle').value.trim()||'TOXIC';
  var body=$('msgBody').value.trim();
  if(!body)return toast("Type a message",'error');
  var r=await sb.from("notifications").insert([{user_id:st.msgUser,title:title,message:body,type:st.msgType,is_read:false}]);
  if(r.error)return toast("❌ "+r.error.message,'error');
  var u=st.users.find(function(x){return x.user_id===st.msgUser});
  if(u)await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",st.msgUser);
  logAction('Send Message',st.msgUser);
  toast("✅ Sent!");
  st.showMessage=false;st.msgUser=null;
  await refresh();
}
async function sendBroadcast(){
  var title=$('bcTitle').value.trim()||'TOXIC';
  var body=$('bcBody').value.trim();
  if(!body)return toast("Type a message",'error');
  if(!confirm("Send to ALL "+st.users.length+" users?"))return;
  toast('Sending...','warn');
  var notifs=st.users.map(function(u){return {user_id:u.user_id,title:title,message:body,type:st.msgType,is_read:false}});
  var r=await sb.from("notifications").insert(notifs);
  if(r.error)return toast("❌ "+r.error.message,'error');
  for(var i=0;i<st.users.length;i++){await sb.from("users").update({unread_count:Number(st.users[i].unread_count||0)+1}).eq("user_id",st.users[i].user_id)}
  logAction('Broadcast','All users');
  toast("✅ Sent to "+st.users.length);
  st.showBroadcast=false;
  await refresh();
}
async function adminSetBal(uid){var v=$('mBal').value;if(v==="")return toast("Enter amount",'error');var r=await sb.from("users").update({balance:parseFloat(v)}).eq("user_id",uid);if(!r.error){logAction('Set Balance',uid+' $'+v);toast("✅ Updated");st.selectedUser=null;await refresh()}else toast("❌ "+r.error.message,'error')}
async function adminSetRefBal(uid){var v=$('mRefBal').value;if(v==="")return toast("Enter amount",'error');var r=await sb.from("users").update({referral_balance:parseFloat(v)}).eq("user_id",uid);if(!r.error){logAction('Set Ref Bal',uid+' $'+v);toast("✅ Updated");st.selectedUser=null;await refresh()}else toast("❌ "+r.error.message,'error')}
async function adminBonus(uid){
  var v=prompt("Bonus ($):");if(!v)return;
  var amt=parseFloat(v);if(!amt||amt<=0)return toast("Invalid",'error');
  var u=st.users.find(function(x){return x.user_id===uid});if(!u)return;
  var nb=Number(u.balance||0)+amt;
  var r=await sb.from("users").update({balance:nb}).eq("user_id",uid);
  if(!r.error){
    await sb.from("notifications").insert([{user_id:uid,title:'🎁 Bonus!',message:'+$'+amt.toFixed(2)+' credited!',type:'bonus',is_read:false}]);
    await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",uid);
    logAction('Bonus',uid+' +$'+v);toast("✅ Added");st.selectedUser=null;await refresh();
  }else toast("❌ "+r.error.message,'error');
}
async function adminResetPwd(uid){
  var p=prompt("New password (min 4):");if(!p)return;
  if(p.length<4)return toast("Too short",'error');
  var r=await sb.from("users").update({password_hash:safeBtoa(p)}).eq("user_id",uid);
  if(!r.error){
    await sb.from("notifications").insert([{user_id:uid,title:'🔑 Password Reset',message:'Your password was reset by admin.',type:'warning',is_read:false}]);
    var u=st.users.find(function(x){return x.user_id===uid});
    if(u)await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",uid);
    logAction('Reset Pwd',uid);toast("✅ New pwd: "+p);st.selectedUser=null;await refresh();
  }else toast("❌ "+r.error.message,'error');
}

  try{
    await sb.from("user_plans").delete().eq("user_id",uid);
    await sb.from("deposits").delete().eq("user_id",uid);
    await sb.from("withdrawals").delete().eq("user_id",uid);
    await sb.from("notifications").delete().eq("user_id",uid);
    var r=await sb.from("users").delete().eq("user_id",uid);
    if(r.error)return toast("❌ "+r.error.message,'error');
    logAction('Delete User',uname);toast("✅ Deleted");st.selectedUser=null;await refresh();
  }catch(e){toast("❌ "+e.message,'error')}
}
async function adminGivePlan(uid){
  var plans=['BRONZE','SILVER','GOLD','ELITE','ULTRA','LEGEND','MASTER','GRANDMASTER','MYTHIC','IMMORTAL','TITAN','GODFATHER'];
  var plan=prompt("Plan name:\n"+plans.join(', '));
  if(!plan)return;
  plan=plan.toUpperCase();
  var PLANS_DEF={'BRONZE':{deposit:1,daily:0.10,total:4.00},'SILVER':{deposit:3,daily:0.36,total:14.40},'GOLD':{deposit:5,daily:0.70,total:28.00},'ELITE':{deposit:10,daily:1.60,total:64.00},'ULTRA':{deposit:20,daily:3.50,total:140.00},'LEGEND':{deposit:50,daily:9.00,total:360.00},'MASTER':{deposit:100,daily:18.50,total:740.00},'GRANDMASTER':{deposit:200,daily:38.00,total:1520.00},'MYTHIC':{deposit:500,daily:97.50,total:3900.00},'IMMORTAL':{deposit:1000,daily:200.00,total:8000.00},'TITAN':{deposit:2000,daily:410.00,total:16400.00},'GODFATHER':{deposit:5000,daily:1050.00,total:42000.00}};
  var p=PLANS_DEF[plan];if(!p)return toast("Invalid plan",'error');
  var u=st.users.find(function(x){return x.user_id===uid});if(!u)return;
  var now=new Date();
  var np={user_id:uid,username:u.username,plan_id:'l'+(plans.indexOf(plan)+1),plan_name:plan,deposit:p.deposit,daily:p.daily,total:p.total,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*86400000).toISOString()};
  var r=await sb.from("user_plans").insert([np]);
  if(!r.error){
    await sb.from("notifications").insert([{user_id:uid,title:'💎 Plan Activated!',message:plan+' plan activated by admin. Daily $'+p.daily,type:'bonus',is_read:false}]);
    await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",uid);
    logAction('Give Plan',uid+' '+plan);toast("✅ Given");st.selectedUser=null;await refresh();
  }else toast("❌ "+r.error.message,'error');
}
async function toggleBan(uid,current){var r=await sb.from("users").update({is_banned:!current}).eq("user_id",uid);if(!r.error){if(!current)await sb.from("notifications").insert([{user_id:uid,title:'🚫 Suspended',message:'Account suspended. Contact support.',type:'warning',is_read:false}]);logAction(current?'Unban':'Ban',uid);toast(current?"✅ Unbanned":"🚫 Banned");st.selectedUser=null;await refresh()}else toast("❌ "+r.error.message,'error')}
async function appDep(id,uid,amt){
  if(!confirm("Approve $"+amt+"?"))return;
  var r=await sb.from("deposits").update({status:"approved"}).eq("id",id);
  if(r.error)return toast("❌ "+r.error.message,'error');
  var u=st.users.find(function(x){return x.user_id===uid});
  if(u){
    var nb=Number(u.balance||0)+Number(amt);
    await sb.from("users").update({balance:nb}).eq("user_id",uid);
    await sb.from("notifications").insert([{user_id:uid,title:'✅ Deposit Approved!',message:'+$'+Number(amt).toFixed(2)+' credited! Balance: $'+nb.toFixed(2),type:'bonus',is_read:false}]);
    await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",uid);
  }
  logAction('Approve Dep',uid+' $'+amt);toast("✅ Approved");await refresh();
}
async function bulkApprove(){
  var p=st.deps.filter(function(d){return d.status==="pending"});
  if(!confirm("Approve all "+p.length+" deposits?"))return;
  toast('Approving '+p.length+'...','warn');
  var c=0;
  for(var i=0;i<p.length;i++){
    var d=p[i];
    await sb.from("deposits").update({status:"approved"}).eq("id",d.id);
    var u=st.users.find(function(x){return x.user_id===d.user_id});
    if(u){
      var nb=Number(u.balance||0)+Number(d.amount);
      await sb.from("users").update({balance:nb}).eq("user_id",d.user_id);
      await sb.from("notifications").insert([{user_id:d.user_id,title:'✅ Deposit Approved!',message:'+$'+Number(d.amount).toFixed(2)+' credited.',type:'bonus',is_read:false}]);
      await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",d.user_id);
      c++;
    }
  }
  logAction('Bulk Approve',c);toast("✅ "+c+" approved");await refresh();
}

function changeAdminPwd(){
  var o=$('oldPwd').value,n=$('newPwd').value,n2=$('newPwd2').value;
  if(o!==getAdminPwd())return toast("❌ Wrong current password",'error');
  if(!n||n.length<4)return toast("Min 4 chars",'error');
  if(n!==n2)return toast("Passwords don't match",'error');
  setAdminPwd(n);logAction('Change Admin Pwd','');st.showChangePwd=false;toast("✅ Changed!");render();
}
function exportCSV(type){
  var data=[],filename='';
  if(type==='users'){data=st.users.map(function(u){return {user_id:u.user_id,username:u.username,email:u.email,balance:u.balance,referral_balance:u.referral_balance,invested:u.invested,referral_code:u.referral_code,referred_by:u.referred_by,is_banned:u.is_banned,joined:u.joined_at}});filename='toxic-users.csv'}
  else if(type==='deposits'){data=st.deps.map(function(d){return {user_id:d.user_id,username:d.username,amount:d.amount,method:d.method,ref:d.ref,status:d.status,note:d.admin_note||'',date:d.created_at}});filename='toxic-deposits.csv'}
  else if(type==='withdrawals'){data=st.wd.map(function(d){return {user_id:d.user_id,username:d.username,amount:d.amount,address:d.address,method:d.method,status:d.status,note:d.admin_note||'',date:d.created_at}});filename='toxic-withdrawals.csv'}
  else if(type==='plans'){data=st.userPlans.map(function(p){return {user_id:p.user_id,username:p.username,plan:p.plan_name,deposit:p.deposit,daily:p.daily,days:p.days_collected,status:p.status,started:p.started_at,expires:p.expires_at}});filename='toxic-plans.csv'}
  if(data.length===0)return toast("No data",'error');
  var headers=Object.keys(data[0]);
  var csv=headers.join(',')+'\n';
  data.forEach(function(row){csv+=headers.map(function(h){return '"'+String(row[h]||'').replace(/"/g,'""')+'"'}).join(',')+'\n'});
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
  logAction('Export CSV',filename);toast("✅ Exported");
}
