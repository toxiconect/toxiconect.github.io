<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOXIC Admin v3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{background:#050807;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;min-height:100vh}
.card{background:linear-gradient(145deg,#0f1a14,#0a0f0c);border:1px solid rgba(0,255,102,0.12);border-radius:16px;padding:16px;margin-bottom:12px}
.card:hover{border-color:rgba(0,255,102,0.25)}
.btn{background:linear-gradient(135deg,#00FF66,#10B981);color:#000;font-weight:700;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:13px}
.btn:active{transform:scale(0.97)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto}
.btn-red{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.btn-yellow{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#000}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.btn-purple{background:linear-gradient(135deg,#A855F7,#7C3AED);color:#fff}
.btn-gray{background:rgba(255,255,255,0.06);color:#ccc;border:1px solid rgba(255,255,255,0.1)}
.inp{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;color:#fff;width:100%;font-size:13px;outline:none}
.inp:focus{border-color:rgba(0,255,102,0.5)}
.g{color:#00FF66}
.tab{padding:10px 14px;border-radius:12px;font-size:11px;font-weight:700;border:none;cursor:pointer;margin-right:6px;margin-bottom:6px;background:rgba(255,255,255,0.04);color:#888;white-space:nowrap}
.tab.on{background:#00FF66;color:#000}
.stat{background:linear-gradient(145deg,rgba(0,255,102,0.06),rgba(0,0,0,0.3));border:1px solid rgba(0,255,102,0.15);border-radius:14px;padding:14px;text-align:center}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block}
.bp{background:rgba(251,191,36,0.15);color:#FBBF24}
.ba{background:rgba(0,255,102,0.15);color:#00FF66}
.br{background:rgba(239,68,68,0.15);color:#EF4444}
.bb{background:rgba(59,130,246,0.15);color:#60A5FA}
.row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.lbl{font-size:10px;color:#666;margin:0}
.val{font-size:12px;color:#ddd;margin:3px 0 0;font-weight:500}
.divider{height:1px;background:rgba(255,255,255,0.05);margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal-card{background:linear-gradient(145deg,#0f1a14,#0a0f0c);border:1px solid rgba(0,255,102,0.25);border-radius:20px;padding:20px;width:100%;max-width:520px;margin:20px auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.filter-btn{padding:6px 12px;border-radius:8px;font-size:11px;background:rgba(255,255,255,0.05);color:#aaa;border:1px solid rgba(255,255,255,0.08);cursor:pointer;margin-right:4px;margin-bottom:4px}
.filter-btn.on{background:#00FF66;color:#000;font-weight:700;border-color:#00FF66}
.chart-bar{transition:all 0.3s;border-radius:4px 4px 0 0}
.type-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.type-btn{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#ccc;font-size:11px;font-weight:700;cursor:pointer}
.type-btn.on{background:rgba(0,255,102,0.15);border-color:#00FF66;color:#00FF66}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SB_URL='https://uaeyjqfwqxhgbhrvlbdr.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhZXlqcWZ3cXhoZ2JocnZsYmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjgzMTEsImV4cCI6MjEwNTE0NDMxMX0.gmxzj18TuS6Zckjf7d41uBUFMHfsUxl92e-QoI-a-rc';
var PWD="802301";
var sb=null;
var st={
  login:false, users:[], deps:[], wd:[], plans:[], logs:[], notifications:[],
  tab:"dash", search:"", 
  depFilter:"all", wdFilter:"all", dateFilter:"all",
  selectedUser:null,
  showAnnounce:false, showSettings:false,
  showMessage:false, msgUser:null, msgType:'info',
  showBroadcast:false
};

function initSB(){
  try{ if(window.supabase && window.supabase.createClient){ sb=window.supabase.createClient(SB_URL,SB_KEY); return true; } }catch(e){}
  return false;
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(n){return Number(n||0).toFixed(2)}
function $(id){return document.getElementById(id)}

function logAction(action,detail){
  st.logs.unshift({action,detail,time:new Date().toISOString()});
  if(st.logs.length>100) st.logs=st.logs.slice(0,100);
  try{ localStorage.setItem('toxic_admin_logs',JSON.stringify(st.logs.slice(0,50))); }catch(e){}
}
try{ st.logs=JSON.parse(localStorage.getItem('toxic_admin_logs')||'[]'); }catch(e){}

var SETTINGS={
  refL1:10, refL2:5, refL3:2, refL4to10:1,
  minDeposit:2, minWithdraw:5, withdrawFee:5,
  banner:'https://i.postimg.cc/Wz818VcZ/1789133259079.png',
  maintenance:false,
  announcement:'Welcome to TOXIC! Earn daily returns. 🚀'
};
try{ var saved=localStorage.getItem('toxic_admin_settings'); if(saved) SETTINGS=Object.assign(SETTINGS,JSON.parse(saved)); }catch(e){}
function saveSettings(){ try{ localStorage.setItem('toxic_admin_settings',JSON.stringify(SETTINGS)); }catch(e){} }

/* ==== RENDER ==== */
function render(){
  var el=$('app');
  if(!sb){ el.innerHTML='<div style="padding:40px;text-align:center"><div class="card"><p style="color:#EF4444">⚠️ Supabase load failed. Refresh.</p><button class="btn" style="margin-top:12px" onclick="location.reload()">🔄 Refresh</button></div></div>'; return; }
  if(!st.login){ el.innerHTML=loginScreen(); return; }
  el.innerHTML='<div style="padding:16px;max-width:520px;margin:0 auto">'+panel()+modals()+'</div>';
}

function loginScreen(){
  return '<div style="padding:80px 24px;max-width:400px;margin:0 auto"><div class="card" style="padding:28px">'
    +'<div style="text-align:center;margin-bottom:24px"><div style="width:64px;height:64px;background:linear-gradient(135deg,#00FF66,#10B981);border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px">🔐</div>'
    +'<h1 class="g" style="font-size:22px;font-weight:900;margin:0 0 4px">TOXIC</h1><p style="font-size:10px;color:#666;margin:0;letter-spacing:3px">ADMIN PANEL v3</p></div>'
    +'<input type="password" id="pw" class="inp" placeholder="Admin Password" style="margin-bottom:12px" onkeypress="if(event.key===\'Enter\')login()">'
    +'<button class="btn" style="width:100%" onclick="login()">ACCESS</button></div></div>';
}

function panel(){
  var tu=st.users.length;
  var pd=st.deps.filter(function(d){return d.status==="pending"}).length;
  var tw=st.wd.filter(function(d){return d.status==="pending"}).length;
  var ap=st.plans.filter(function(p){return Number(p.days_collected)<40 && p.status!=="completed"}).length;
  var totalRevenue=st.deps.filter(function(d){return d.status==="approved"}).reduce(function(a,b){return a+Number(b.amount||0)},0);
  var totalPaid=st.wd.filter(function(d){return d.status==="approved"}).reduce(function(a,b){return a+Number(b.amount||0)},0);
  var unreadTotal=st.users.reduce(function(a,b){return a+Number(b.unread_count||0)},0);

  var h='<div class="row" style="margin-bottom:16px"><div><h1 class="g" style="font-size:18px;font-weight:900;margin:0">TOXIC ADMIN</h1><p style="font-size:10px;color:#666;margin:2px 0 0">Live Control Center</p></div>'
    +'<div style="display:flex;gap:6px"><button class="btn btn-sm btn-purple" onclick="st.showSettings=true;render()">⚙️</button><button class="btn btn-sm" style="background:rgba(239,68,68,0.15);color:#EF4444;border:1px solid rgba(239,68,68,0.3)" onclick="logout()">Logout</button></div></div>';

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px">USERS</p><p class="g" style="font-size:26px;font-weight:900;margin:0">'+tu+'</p></div>';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px">ACTIVE PLANS</p><p style="color:#22D3EE;font-size:26px;font-weight:900;margin:0">'+ap+'</p></div>';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px">REVENUE</p><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+totalRevenue.toFixed(0)+'</p></div>';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px">PAID OUT</p><p style="color:#EF4444;font-size:22px;font-weight:900;margin:0">$'+totalPaid.toFixed(0)+'</p></div>';
  h+='</div>';

  h+='<div style="overflow-x:auto;margin-bottom:16px;padding-bottom:4px">';
  h+='<button class="tab '+(st.tab==="dash"?"on":"")+'" onclick="sw(\'dash\')">📊 Overview</button>';
  h+='<button class="tab '+(st.tab==="users"?"on":"")+'" onclick="sw(\'users\')">👥 Users ('+tu+')</button>';
  h+='<button class="tab '+(st.tab==="plans"?"on":"")+'" onclick="sw(\'plans\')">💎 Plans ('+ap+')</button>';
  h+='<button class="tab '+(st.tab==="deps"?"on":"")+'" onclick="sw(\'deps\')">💰 Deposits ('+pd+')</button>';
  h+='<button class="tab '+(st.tab==="wd"?"on":"")+'" onclick="sw(\'wd\')">💸 Withdraw ('+tw+')</button>';
  h+='<button class="tab '+(st.tab==="notifs"?"on":"")+'" onclick="sw(\'notifs\')">🔔 Notifs ('+st.notifications.length+')</button>';
  h+='<button class="tab '+(st.tab==="analytics"?"on":"")+'" onclick="sw(\'analytics\')">📈 Analytics</button>';
  h+='<button class="tab '+(st.tab==="logs"?"on":"")+'" onclick="sw(\'logs\')">📝 Logs</button>';
  h+='</div>';

  if(st.tab==="dash") h+=dashV();
  if(st.tab==="users") h+=usersV();
  if(st.tab==="plans") h+=plansV();
  if(st.tab==="deps") h+=depsV();
  if(st.tab==="wd") h+=wdV();
  if(st.tab==="notifs") h+=notifsV();
  if(st.tab==="analytics") h+=analyticsV();
  if(st.tab==="logs") h+=logsV();

  h+='<div style="display:flex;gap:8px;margin-top:12px">';
  h+='<button class="btn btn-gray" style="flex:1" onclick="refresh()">🔄 Refresh</button>';
  h+='<button class="btn btn-blue" style="flex:1" onclick="st.showBroadcast=true;render()">📢 Broadcast</button>';
  h+='</div>';
  return h;
}

function dashV(){
  var h='<div class="card"><p style="font-size:10px;color:#666;letter-spacing:2px;margin:0 0 12px">📊 LAST 7 DAYS ACTIVITY</p>';
  var days=[]; for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0); days.push({date:d,count:0,amount:0}); }
  st.deps.forEach(function(dep){
    var dd=new Date(dep.created_at); dd.setHours(0,0,0,0);
    for(var i=0;i<days.length;i++){ if(days[i].date.toDateString()===dd.toDateString()){ days[i].count++; days[i].amount+=Number(dep.amount||0); } }
  });
  var max=Math.max.apply(null,days.map(function(d){return d.count}))||1;
  h+='<div style="display:flex;align-items:flex-end;gap:6px;height:100px;margin-bottom:8px">';
  days.forEach(function(d,i){
    var pct=(d.count/max)*100; if(pct<8 && d.count>0) pct=8;
    var isToday=i===6;
    h+='<div style="flex:1;text-align:center"><div class="chart-bar" style="height:'+pct+'%;background:'+(isToday?'linear-gradient(180deg,#00FF66,#10B981)':'linear-gradient(180deg,rgba(0,255,102,0.6),rgba(0,255,102,0.15))')+'"></div><p style="font-size:9px;color:'+(isToday?'#00FF66':'#555')+';margin:4px 0 0">'+['S','M','T','W','T','F','S'][d.date.getDay()]+'</p></div>';
  });
  h+='</div></div>';

  h+='<div class="card"><p style="font-size:10px;color:#666;letter-spacing:2px;margin:0 0 12px">🔴 LIVE ACTIVITY FEED</p>';
  var recent=st.deps.slice(0,5).concat(st.wd.slice(0,3)).concat(st.plans.slice(0,3));
  recent.sort(function(a,b){ return new Date(b.created_at||b.started_at)-new Date(a.created_at||a.started_at); });
  if(recent.length===0) h+='<p style="font-size:11px;color:#666;text-align:center;padding:20px 0">No activity yet</p>';
  else {
    recent.slice(0,8).forEach(function(r){
      var type=r.amount&&r.method?'deposit':r.address?'withdrawal':'plan';
      var icon=type==='deposit'?'💰':type==='withdrawal'?'💸':'💎';
      var time=r.created_at||r.started_at;
      var diff=Math.floor((Date.now()-new Date(time).getTime())/60000);
      var timeStr=diff<1?'just now':diff<60?diff+'m ago':diff<1440?Math.floor(diff/60)+'h ago':Math.floor(diff/1440)+'d ago';
      h+='<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,0.03)"><div style="display:flex;gap:8px;align-items:center"><span>'+icon+'</span><span style="color:#ccc">'+esc(r.username||'Unknown')+'</span></div><div style="text-align:right"><span style="color:#00FF66;font-weight:700">$'+fmt(r.amount||r.deposit)+'</span> <span style="color:#555;font-size:10px">'+timeStr+'</span></div></div>';
    });
  }
  h+='</div>';
  h+='<div class="card"><p style="font-size:10px;color:#666;letter-spacing:2px;margin:0 0 12px">📢 ANNOUNCEMENT</p>';
  h+='<p style="font-size:12px;color:#ddd;line-height:1.5">'+esc(SETTINGS.announcement)+'</p>';
  h+='<button class="btn btn-sm btn-yellow" style="width:100%;margin-top:10px" onclick="st.showAnnounce=true;render()">EDIT ANNOUNCEMENT</button></div>';
  return h;
}

function usersV(){
  var list=st.users.slice();
  if(st.search) list=list.filter(function(u){return (u.username||"").toLowerCase().indexOf(st.search.toLowerCase())>-1||String(u.user_id||"").indexOf(st.search)>-1});
  if(list.length===0) return '<div class="card" style="text-align:center;color:#666;padding:40px">No users found</div>';
  var h='<input class="inp" placeholder="🔍 Search user by name or ID" style="margin-bottom:12px" oninput="st.search=this.value;render()" value="'+esc(st.search)+'">';
  for(var i=0;i<list.length;i++){
    var u=list[i];
    var userPlans=st.plans.filter(function(p){return p.user_id===u.user_id});
    var activePlan=userPlans.find(function(p){return Number(p.days_collected)<40 && p.status!=="completed"});
    var unread=Number(u.unread_count||0);
    h+='<div class="card" onclick="st.selectedUser=\''+esc(u.user_id)+'\';render()" style="cursor:pointer">';
    h+='<div class="row"><div><p style="font-weight:800;margin:0;font-size:15px">'+esc(u.username||"?")+(unread>0?' <span style="background:#EF4444;color:#fff;font-size:9px;padding:2px 6px;border-radius:10px;margin-left:6px">'+unread+'</span>':'')+'</p><p class="lbl" style="margin:4px 0 0">ID: '+esc(u.user_id)+'</p></div><div style="text-align:right"><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+fmt(u.balance)+'</p><p class="lbl" style="margin:2px 0 0">BALANCE</p></div></div>';
    if(activePlan){
      h+='<div style="margin-top:8px;padding:8px 10px;background:rgba(0,255,102,0.06);border-radius:10px;border:1px solid rgba(0,255,102,0.15);display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:#00FF66;font-weight:700">💎 '+esc(activePlan.plan_name)+' Active</span><span style="font-size:10px;color:#666">'+Number(activePlan.days_collected||0)+'/40</span></div>';
    } else if(userPlans.length>0){
      h+='<div style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:10px"><span style="font-size:11px;color:#888">'+userPlans.length+' plan(s) completed</span></div>';
    }
    h+='</div>';
  }
  return h;
}

function plansV(){
  var list=st.plans.slice();
  if(list.length===0) return '<div class="card" style="text-align:center;color:#666;padding:40px">No plans yet</div>';
  var h='<input class="inp" placeholder="🔍 Search by username" style="margin-bottom:12px" oninput="st.search=this.value;render()" value="'+esc(st.search)+'">';
  if(st.search) list=list.filter(function(p){return (p.username||"").toLowerCase().indexOf(st.search.toLowerCase())>-1});
  for(var i=0;i<list.length;i++){
    var p=list[i];
    var s=String(p.status||"active");
    var isDone=Number(p.days_collected)>=40||s==="completed";
    var badge=isDone?"ba":s==="cancelled"?"br":"bp";
    h+='<div class="card">';
    h+='<div class="row"><div><p style="font-weight:800;margin:0;font-size:14px">'+esc(p.username||"?")+'</p><p class="lbl" style="margin:4px 0 0">'+esc(p.user_id)+'</p></div><div style="text-align:right"><p class="g" style="font-size:18px;font-weight:900;margin:0">'+esc(p.plan_name)+'</p><span class="badge '+badge+'" style="margin-top:4px">'+(isDone?"COMPLETED":s.toUpperCase())+'</span></div></div>';
    h+='<div class="divider"></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px">';
    h+='<div><p class="lbl">Invested</p><p class="val g">$'+fmt(p.deposit)+'</p></div>';
    h+='<div><p class="lbl">Daily</p><p class="val g">$'+fmt(p.daily)+'</p></div>';
    h+='<div><p class="lbl">Progress</p><p class="val">'+Number(p.days_collected||0)+' / 40</p></div>';
    h+='<div><p class="lbl">Expires</p><p class="val">'+(p.expires_at?String(p.expires_at).slice(0,10):"—")+'</p></div>';
    h+='</div>';
    if(!isDone){
      h+='<div class="divider"></div>';
      h+='<div style="display:flex;gap:6px"><button class="btn btn-sm btn-blue" style="flex:1" onclick="event.stopPropagation();extendPlan('+p.id+')">+5 Days</button>';
      h+='<button class="btn btn-sm btn-red" style="flex:1" onclick="event.stopPropagation();cancelPlan('+p.id+')">Cancel Plan</button></div>';
    }
    h+='</div>';
  }
  return h;
}

function depsV(){
  var list=st.deps.slice();
  if(st.depFilter!=="all") list=list.filter(function(d){return d.status===st.depFilter});
  if(st.dateFilter!=="all"){
    var now=new Date();
    list=list.filter(function(d){
      var dd=new Date(d.created_at);
      if(st.dateFilter==="today") return dd.toDateString()===now.toDateString();
      if(st.dateFilter==="week") return (now-dd)<7*24*60*60*1000;
      if(st.dateFilter==="month") return (now-dd)<30*24*60*60*1000;
      return true;
    });
  }
  var h='<div style="margin-bottom:12px">';
  h+='<button class="filter-btn '+(st.depFilter==="all"?"on":"")+'" onclick="st.depFilter=\'all\';render()">All</button>';
  h+='<button class="filter-btn '+(st.depFilter==="pending"?"on":"")+'" onclick="st.depFilter=\'pending\';render()">Pending</button>';
  h+='<button class="filter-btn '+(st.depFilter==="approved"?"on":"")+'" onclick="st.depFilter=\'approved\';render()">Approved</button>';
  h+='<button class="filter-btn '+(st.depFilter==="rejected"?"on":"")+'" onclick="st.depFilter=\'rejected\';render()">Rejected</button>';
  h+='</div>';
  h+='<div style="margin-bottom:12px">';
  h+='<button class="filter-btn '+(st.dateFilter==="all"?"on":"")+'" onclick="st.dateFilter=\'all\';render()">Any time</button>';
  h+='<button class="filter-btn '+(st.dateFilter==="today"?"on":"")+'" onclick="st.dateFilter=\'today\';render()">Today</button>';
  h+='<button class="filter-btn '+(st.dateFilter==="week"?"on":"")+'" onclick="st.dateFilter=\'week\';render()">Week</button>';
  h+='<button class="filter-btn '+(st.dateFilter==="month"?"on":"")+'" onclick="st.dateFilter=\'month\';render()">Month</button>';
  h+='</div>';

  var pendingCount=list.filter(function(d){return d.status==="pending"}).length;
  if(pendingCount>1){
    h+='<button class="btn btn-sm" style="width:100%;margin-bottom:12px" onclick="bulkApprove()">✅ APPROVE ALL '+pendingCount+' PENDING</button>';
  }

  if(list.length===0) return h+'<div class="card" style="text-align:center;color:#666;padding:40px">No deposits</div>';
  for(var i=0;i<list.length;i++){
    var d=list[i];var s=String(d.status||"pending");
    var bd=s==="approved"?"ba":s==="rejected"?"br":"bp";
    h+='<div class="card">';

    var p=await sb.from("user_plans").select("*").order("id",{ascending:false});
    if(p.data) st.plans=p.data;
    var d=await sb.from("deposits").select("*").order("id",{ascending:false});
    if(d.data) st.deps=d.data;
    var w=await sb.from("withdrawals").select("*").order("id",{ascending:false});
    if(w.data) st.wd=w.data;
    var n=await sb.from("notifications").select("*").order("id",{ascending:false}).limit(100);
    if(n.data) st.notifications=n.data;
  }catch(e){console.log(e)}
  render();
}

/* ==== MESSAGE FUNCTIONS ==== */
function openMessage(uid){
  st.msgUser=uid;
  st.msgType='info';
  st.showMessage=true;
  render();
}

async function sendMessage(){
  var title=$('msgTitle').value.trim() || 'TOXIC Notification';
  var body=$('msgBody').value.trim();
  if(!body) return alert("Type a message first");
  if(!st.msgUser) return;
  var r=await sb.from("notifications").insert([{
    user_id:st.msgUser, title:title, message:body, type:st.msgType, is_read:false
  }]);
  if(r.error) return alert("❌ "+r.error.message);
  // Increment user's unread count
  var u=st.users.find(function(x){return x.user_id===st.msgUser});
  if(u){
    await sb.from("users").update({unread_count:Number(u.unread_count||0)+1}).eq("user_id",st.msgUser);
  }
  logAction('Send Message',st.msgUser+' — '+title);
  alert("✅ Message sent!");
  st.showMessage=false;
  st.msgUser=null;
  refresh();
}

async function sendBroadcast(){
  var title=$('bcTitle').value.trim() || 'TOXIC Announcement';
  var body=$('bcBody').value.trim();
  if(!body) return alert("Type a message");
  if(!confirm("Send to ALL "+st.users.length+" users?")) return;
  var notifs=st.users.map(function(u){
    return {user_id:u.user_id, title:title, message:body, type:st.msgType, is_read:false};
  });
  var r=await sb.from("notifications").insert(notifs);
  if(r.error) return alert("❌ "+r.error.message);
  // Increment unread counts for all
  for(var i=0;i<st.users.length;i++){
    await sb.from("users").update({unread_count:Number(st.users[i].unread_count||0)+1}).eq("user_id",st.users[i].user_id);
  }
  logAction('Broadcast','All users — '+title);
  alert("✅ Broadcast sent to "+st.users.length+" users!");
  st.showBroadcast=false;
  refresh();
}

async function adminSetBal(uid){

async function adminGivePlan(uid){
  var plans=['BRONZE','SILVER','GOLD','ELITE','ULTRA','LEGEND','MASTER','GRANDMASTER','MYTHIC','IMMORTAL','TITAN','GODFATHER'];
  var plan=prompt("Enter plan name:\n"+plans.join(', '));

    'BRONZE':{deposit:1,daily:0.10,total:4.00},'SILVER':{deposit:3,daily:0.36,total:14.40},
    'GOLD':{deposit:5,daily:0.70,total:28.00},'ELITE':{deposit:10,daily:1.60,total:64.00},
    'ULTRA':{deposit:20,daily:3.50,total:140.00},'LEGEND':{deposit:50,daily:9.00,total:360.00},
    'MASTER':{deposit:100,daily:18.50,total:740.00},'GRANDMASTER':{deposit:200,daily:38.00,total:1520.00},
    'MYTHIC':{deposit:500,daily:97.50,total:3900.00},'IMMORTAL':{deposit:1000,daily:200.00,total:8000.00},
    'TITAN':{deposit:2000,daily:410.00,total:16400.00},'GODFATHER':{deposit:5000,daily:1050.00,total:42000.00}
  };
  var p=PLANS[plan];
  if(!p) return alert("Invalid plan name");
  var u=st.users.find(function(x){return x.user_id===uid}); if(!u) return;
  var now=new Date();
  var newPlan={user_id:uid,username:u.username,plan_id:'l'+(plans.indexOf(plan)+1),plan_name:plan,deposit:p.deposit,daily:p.daily,total:p.total,days_collected:0,status:'active',started_at:now.toISOString(),expires_at:new Date(now.getTime()+40*24*60*60*1000).toISOString()};
  var r=await sb.from("user_plans").insert([newPlan]);
  if(!r.error){ logAction('Give Plan',uid+' '+plan); alert("✅ Plan given!"); st.selectedUser=null; refresh(); }
  else alert("❌ Failed: "+r.error.message);
}

async function toggleBan(uid,current){
  var r=await sb.from("users").update({is_banned:!current}).eq("user_id",uid);

async function appDep(depId,uid,amt){
  if(!confirm("Approve $"+amt+"?")) return;
  var r1=await sb.from("deposits").update({status:"approved"}).eq("id",depId);
  if(r1.error) return alert("❌ "+r1.error.message);
  var u=st.users.find(function(x){return x.user_id===uid});
  if(u){ await sb.from("users").update({balance:Number(u.balance||0)+Number(amt)}).eq("user_id",uid); }
  logAction('Approve Deposit',uid+' $'+amt);
  alert("✅ Approved");
  refresh();
}

async function bulkApprove(){
  var pending=st.deps.filter(function(d){return d.status==="pending"});
  if(!confirm("Approve all "+pending.length+" deposits?")) return;
  for(var i=0;i<pending.length;i++){
    var d=pending[i];
    await sb.from("deposits").update({status:"approved"}).eq("id",d.id);
    var u=st.users.find(function(x){return x.user_id===d.user_id});
    if(u) await sb.from("users").update({balance:Number(u.balance||0)+Number(d.amount)}).eq("user_id",d.user_id);
  }
  logAction('Bulk Approve',pending.length+' deposits');
  alert("✅ Approved "+pending.length);
  refresh();
}

function exportCSV(type){
  var data=[],filename='';
  if(type==='users'){
    data=st.users.map(function(u){return {user_id:u.user_id,username:u.username,email:u.email,phone:u.phone,balance:u.balance,referral_code:u.referral_code,referred_by:u.referred_by,joined:u.joined_at}});
    filename='toxic-users.csv';
  } else if(type==='deposits'){
    data=st.deps.map(function(d){return {user_id:d.user_id,username:d.username,amount:d.amount,method:d.method,ref:d.ref,status:d.status,date:d.created_at}});
    filename='toxic-deposits.csv';
  } else if(type==='plans'){
    data=st.plans.map(function(p){return {user_id:p.user_id,username:p.username,plan:p.plan_name,deposit:p.deposit,daily:p.daily,days:p.days_collected,status:p.status,started:p.started_at,expires:p.expires_at}});
    filename='toxic-plans.csv';
  }
  if(data.length===0) return alert("No data");
  var headers=Object.keys(data[0]);
  var csv=headers.join(',')+'\n';
  data.forEach(function(row){ csv+=headers.map(function(h){return '"'+String(row[h]||'').replace(/"/g,'""')+'"'}).join(',')+'\n'; });
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  logAction('Export CSV',filename);
}
