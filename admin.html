<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOXIC Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{background:#050807;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;min-height:100vh}
.card{background:linear-gradient(145deg,#121c16,#0a0f0c);border:1px solid rgba(0,255,102,0.15);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{background:linear-gradient(135deg,#00FF66,#10B981);color:#000;font-weight:700;padding:12px;border-radius:12px;border:none;width:100%;cursor:pointer;font-size:14px}
.btn-red{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.btn-yellow{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#000}
.inp{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;color:#fff;width:100%;box-sizing:border-box;margin-bottom:8px;font-size:14px}
.g{color:#00FF66}
.tab{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;margin-right:6px;margin-bottom:6px}
.tab.on{background:#00FF66;color:#000}
.tab.off{background:rgba(255,255,255,0.05);color:#999}
.stat{background:rgba(0,255,102,0.05);border:1px solid rgba(0,255,102,0.2);border-radius:12px;padding:12px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
var API="https://script.google.com/macros/s/AKfycbxrcvpc71ellV0vvF1mH3lS-c5oCFOeUEm_Z7evD2HQNfkwaVdiFmpZxSMisH5Va5_5Qw/exec";
var PWD="802301";
var st={login:false,users:[],deps:[],wd:[],tab:"dash"};

async function api(a,d){
try{
var r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:a,password:PWD},d||{}))});
return await r.json();
}catch(e){return{success:false}}
}

function render(){
var el=document.getElementById("app");
if(!st.login){
el.innerHTML='<div style="padding:40px 20px;max-width:400px;margin:0 auto"><div class="card"><h1 class="g" style="text-align:center;font-size:24px;font-weight:900;margin:0 0 8px">TOXIC</h1><p style="text-align:center;color:#666;font-size:11px;margin:0 0 24px;letter-spacing:2px">ADMIN PANEL</p><input type="password" id="pw" class="inp" placeholder="Enter Admin Password" onkeypress="if(event.key===&quot;Enter&quot;)login()"><button class="btn" onclick="login()">ACCESS PANEL</button><p style="text-align:center;color:#444;font-size:10px;margin:16px 0 0">Authorized personnel only</p></div></div>';
return;
}
el.innerHTML='<div style="padding:16px;max-width:500px;margin:0 auto">'+panel()+'</div>';
}

function panel(){
var totalUsers=st.users.length>0?st.users.length-1:0;
var pendDep=0,totDep=0;
for(var i=1;i<st.deps.length;i++){if(st.deps[i][5]==="pending")pendDep++;if(st.deps[i][5]==="approved")totDep+=Number(st.deps[i][2]||0)}
var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><h1 class="g" style="font-size:20px;font-weight:900;margin:0">TOXIC ADMIN</h1><p style="font-size:10px;color:#666;margin:2px 0 0">Control Center</p></div><button class="tab" style="background:rgba(239,68,68,0.15);color:#EF4444" onclick="logout()">Logout</button></div>';
h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
h+='<div class="stat"><p style="font-size:10px;color:#888;margin:0 0 4px">TOTAL USERS</p><p class="g" style="font-size:22px;font-weight:900;margin:0">'+totalUsers+'</p></div>';
h+='<div class="stat"><p style="font-size:10px;color:#888;margin:0 0 4px">PENDING DEP</p><p style="color:#FBBF24;font-size:22px;font-weight:900;margin:0">'+pendDep+'</p></div>';
h+='<div class="stat"><p style="font-size:10px;color:#888;margin:0 0 4px">TOTAL DEPOSITS</p><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+totDep.toFixed(2)+'</p></div>';
h+='<div class="stat"><p style="font-size:10px;color:#888;margin:0 0 4px">PLATFORM</p><p class="g" style="font-size:22px;font-weight:900;margin:0">LIVE</p></div>';
h+='</div>';
h+='<div style="margin-bottom:16px"><button class="tab '+(st.tab==="dash"?"on":"off")+'" onclick="sw(\'dash\')">Dashboard</button><button class="tab '+(st.tab==="users"?"on":"off")+'" onclick="sw(\'users\')">Users</button><button class="tab '+(st.tab==="deps"?"on":"off")+'" onclick="sw(\'deps\')">Deposits</button><button class="tab '+(st.tab==="wd"?"on":"off")+'" onclick="sw(\'wd\')">Withdrawals</button></div>';

if(st.tab==="dash")h+=dashTab();
if(st.tab==="users")h+=usersTab();
if(st.tab==="deps")h+=depsTab();
if(st.tab==="wd")h+=wdTab();
h+='<button class="btn" style="margin-top:20px;background:rgba(255,255,255,0.05);color:#999" onclick="refresh()">REFRESH DATA</button>';
return h;
}

function dashTab(){
var h='<div class="card"><p style="font-size:11px;color:#888;margin:0 0 8px;letter-spacing:1px">QUICK STATS</p>';
h+='<p style="font-size:12px;margin:8px 0">Registered Users: <b class="g">'+(st.users.length-1)+'</b></p>';
h+='<p style="font-size:12px;margin:8px 0">Total Deposits: <b class="g">'+(st.deps.length-1)+'</b></p>';
h+='<p style="font-size:12px;margin:8px 0">Pending Approvals: <b style="color:#FBBF24">'+(st.deps.filter(function(d,i){return i>0&&d[5]==="pending"}).length)+'</b></p>';
h+='</div>';
h+='<div class="card"><p style="font-size:11px;color:#888;margin:0 0 8px;letter-spacing:1px">ADMIN INFO</p>';
h+='<p style="font-size:12px;margin:8px 0">Admin Password: <b class="g">802301</b></p>';
h+='<p style="font-size:12px;margin:8px 0">API Connected: <b class="g">YES</b></p>';
h+='<p style="font-size:12px;margin:8px 0">Sheet: <b class="g">TOXIC Admin</b></p>';
h+='</div>';
return h;
}

function usersTab(){
if(st.users.length<=1)return '<div class="card" style="text-align:center;color:#666;padding:30px">No users registered yet</div>';
var h='';
for(var i=1;i<st.users.length;i++){
var u=st.users[i];
h+='<div class="card">';
h+='<div style="display:flex;justify-content:space-between;margin-bottom:12px">';
h+='<div><p style="font-weight:900;margin:0;font-size:15px">'+(u[1]||"Unknown")+'</p>';
h+='<p style="font-size:10px;color:#888;margin:4px 0 0">ID: '+u[0]+'</p>';
h+='<p style="font-size:10px;color:#888;margin:2px 0 0">Email: '+(u[2]||"-")+'</p>';
h+='<p style="font-size:10px;color:#888;margin:2px 0 0">Phone: '+(u[3]||"-")+'</p></div>';
h+='<div style="text-align:right"><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+Number(u[4]||0).toFixed(2)+'</p>';
h+='<p style="font-size:9px;color:#666;margin:2px 0 0">BALANCE</p></div></div>';
h+='<div style="display:flex;gap:6px">';
h+='<input type="number" id="b'+i+'" class="inp" style="margin:0;flex:1" placeholder="Set balance">';
h+='<button class="btn" style="width:auto;padding:10px 16px;font-size:12px" onclick="setBal(\''+u[0]+'\','+i+')">SET</button>';
h+='</div>';
h+='<div style="display:flex;gap:6px;margin-top:6px">';
h+='<button class="btn btn-yellow" style="font-size:11px" onclick="bonus(\''+u[0]+'\','+i+')">+ ADD BONUS</button>';
h+='</div>';
h+='</div>';
}
return h;
}

function depsTab(){
if(st.deps.length<=1)return '<div class="card" style="text-align:center;color:#666;padding:30px">No deposits yet</div>';
var h='';
for(var i=1;i<st.deps.length;i++){
var d=st.deps[i];
var pend=d[5]==="pending";
h+='<div class="card">';
h+='<div style="display:flex;justify-content:space-between;margin-bottom:12px">';
h+='<div><p style="font-weight:700;font-size:14px;margin:0">'+(d[1]||"Unknown")+'</p>';
h+='<p style="font-size:10px;color:#888;margin:4px 0 0">User: '+d[0]+'</p>';
h+='<p style="font-size:10px;color:#888;margin:2px 0 0">Method: '+d[3]+'</p>';
h+='<p style="font-size:10px;color:#888;margin:2px 0 0;word-break:break-all">Ref: '+d[4]+'</p></div>';
h+='<div style="text-align:right"><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+Number(d[2]||0).toFixed(2)+'</p>';
h+='<p style="font-size:9px;color:'+(pend?"#FBBF24":"#00FF66")+';margin:4px 0 0;font-weight:700">'+(d[5]||"").toUpperCase()+'</p></div></div>';
if(pend){
h+='<div style="display:flex;gap:6px">';
h+='<button class="btn" style="font-size:12px" onclick="appDep(\''+d[0]+'\',\''+d[4]+'\','+d[2]+','+i+')">APPROVE</button>';
h+='<button class="btn btn-red" style="font-size:12px;width:auto;padding:12px 16px" onclick="rejDep(\''+d[0]+'\',\''+d[4]+'\')">REJECT</button>';
h+='</div>';
}
h+='</div>';
}
return h;
}

function wdTab(){
return '<div class="card" style="text-align:center;color:#666;padding:30px">No withdrawals yet</div>';
}

async function login(){
var p=document.getElementById("pw").value;
if(p!==PWD)return alert("Wrong password");
st.login=true;
await refresh();
render();
}

async function refresh(){
var u=await api("getUsers");if(u.success)st.users=u.users||[];
var d=await api("getDeposits");if(d.success)st.deps=d.deposits||[];
var w=await api("getWithdrawals");if(w.success)st.wd=w.withdrawals||[];
render();
}

function sw(t){st.tab=t;render()}

async function setBal(uid,i){
var v=document.getElementById("b"+i).value;
if(!v)return alert("Enter amount");
var r=await api("updateBalance",{userId:uid,newBalance:parseFloat(v)});
if(r.success){alert("Balance updated");await refresh()}else alert("Failed");
}

async function bonus(uid,i){
var v=document.getElementById("b"+i).value;
if(!v)return alert("Enter bonus amount");
var u=st.users.find(function(x){return x[0]===uid});
var curr=Number(u[4]||0);
var r=await api("updateBalance",{userId:uid,newBalance:curr+parseFloat(v)});
if(r.success){alert("Bonus added");await refresh()}else alert("Failed");
}

async function appDep(uid,ref,amt,i){
var r=await api("approveDeposit",{userId:uid,ref:ref,amount:amt});
if(r.success){alert("Approved & Balance Credited");await refresh()}else alert("Failed");
}

async function rejDep(uid,ref){
alert("Reject feature coming soon");
}

function logout(){st.login=false;render()}

render();
</script>
</body>
</html>
