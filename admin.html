<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOXIC Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{background:#050807;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;min-height:100vh}
.card{background:linear-gradient(145deg,#0f1a14,#0a0f0c);border:1px solid rgba(0,255,102,0.12);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.card:hover{border-color:rgba(0,255,102,0.25)}
.btn{background:linear-gradient(135deg,#00FF66,#10B981);color:#000;font-weight:700;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:13px}
.btn:active{transform:scale(0.97)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto}
.btn-red{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.btn-yellow{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#000}
.btn-gray{background:rgba(255,255,255,0.06);color:#ccc;border:1px solid rgba(255,255,255,0.1)}
.inp{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;color:#fff;width:100%;box-sizing:border-box;font-size:13px;outline:none}
.inp:focus{border-color:rgba(0,255,102,0.5)}
.g{color:#00FF66}
.tab{padding:10px 16px;border-radius:12px;font-size:12px;font-weight:700;border:none;cursor:pointer;margin-right:6px;background:rgba(255,255,255,0.04);color:#888;white-space:nowrap}
.tab.on{background:#00FF66;color:#000}
.stat{background:linear-gradient(145deg,rgba(0,255,102,0.06),rgba(0,0,0,0.3));border:1px solid rgba(0,255,102,0.15);border-radius:14px;padding:14px;text-align:center}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block}
.badge-p{background:rgba(251,191,36,0.15);color:#FBBF24}
.badge-a{background:rgba(0,255,102,0.15);color:#00FF66}
.badge-r{background:rgba(239,68,68,0.15);color:#EF4444}
.row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.lbl{font-size:10px;color:#666;margin:0}
.val{font-size:12px;color:#ddd;margin:3px 0 0;font-weight:500}
.divider{height:1px;background:rgba(255,255,255,0.05);margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
var API="https://script.google.com/macros/s/AKfycbxrcvpc71ellV0vvF1mH3lS-c5oCFOeUEm_Z7evD2HQNfkwaVdiFmpZxSMisH5Va5_5Qw/exec";
var PWD="802301";
var st={login:false,users:[],deps:[],wd:[],tab:"dash",search:""};

async function api(a,d){
  try{
    var r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:a,password:PWD},d||{}))});
    return await r.json();
  }catch(e){return{success:false}}
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function render(){
  var el=document.getElementById("app");
  if(!st.login){
    el.innerHTML='<div style="padding:80px 24px;max-width:400px;margin:0 auto"><div class="card" style="padding:28px"><div style="text-align:center;margin-bottom:24px"><div style="width:64px;height:64px;background:linear-gradient(135deg,#00FF66,#10B981);border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 30px rgba(0,255,102,0.4)">🔐</div><h1 class="g" style="font-size:22px;font-weight:900;margin:0 0 4px;letter-spacing:1px">TOXIC</h1><p style="font-size:10px;color:#666;margin:0;letter-spacing:3px">ADMIN PANEL</p></div><input type="password" id="pw" class="inp" placeholder="Enter Admin Password" style="margin-bottom:12px" onkeypress="if(event.key===\'Enter\')login()"><button class="btn" style="width:100%" onclick="login()">ACCESS CONTROL CENTER</button><p style="text-align:center;font-size:10px;color:#444;margin:16px 0 0">Authorized personnel only</p></div></div>';
    return;
  }
  el.innerHTML='<div style="padding:16px;max-width:520px;margin:0 auto">'+panel()+'</div>';
}

function panel(){
  var tu=st.users.length>0?st.users.length-1:0;
  var pd=0,ad=0,td=0,tw=0;
  for(var i=1;i<st.deps.length;i++){
    var s=String(st.deps[i][5]||"");
    if(s==="pending")pd++;
    if(s==="approved"){ad++;td+=Number(st.deps[i][2]||0)}
  }
  for(var j=1;j<st.wd.length;j++){if(String(st.wd[j][4]||"")==="pending")tw++}

  var h='<div class="row" style="margin-bottom:16px"><div><h1 class="g" style="font-size:18px;font-weight:900;margin:0;letter-spacing:1px">TOXIC ADMIN</h1><p style="font-size:10px;color:#666;margin:2px 0 0">Control Center · Live</p></div><button class="btn btn-sm" style="background:rgba(239,68,68,0.15);color:#EF4444;border:1px solid rgba(239,68,68,0.3)" onclick="logout()">Logout</button></div>';

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px;letter-spacing:1px">USERS</p><p class="g" style="font-size:26px;font-weight:900;margin:0">'+tu+'</p></div>';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px;letter-spacing:1px">PENDING DEP</p><p style="color:#FBBF24;font-size:26px;font-weight:900;margin:0">'+pd+'</p></div>';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px;letter-spacing:1px">TOTAL DEPOSITS</p><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+td.toFixed(0)+'</p></div>';
  h+='<div class="stat"><p style="font-size:9px;color:#666;margin:0 0 6px;letter-spacing:1px">PENDING WDL</p><p style="color:#FBBF24;font-size:26px;font-weight:900;margin:0">'+tw+'</p></div>';
  h+='</div>';

  h+='<div style="overflow-x:auto;margin-bottom:16px;padding-bottom:4px">';
  h+='<button class="tab '+(st.tab==="dash"?"on":"")+'" onclick="sw(\'dash\')">Overview</button>';
  h+='<button class="tab '+(st.tab==="users"?"on":"")+'" onclick="sw(\'users\')">Users ('+tu+')</button>';
  h+='<button class="tab '+(st.tab==="deps"?"on":"")+'" onclick="sw(\'deps\')">Deposits ('+pd+')</button>';
  h+='<button class="tab '+(st.tab==="wd"?"on":"")+'" onclick="sw(\'wd\')">Withdrawals ('+tw+')</button>';
  h+='</div>';

  if(st.tab==="dash")h+=dashView();
  if(st.tab==="users")h+=usersView();
  if(st.tab==="deps")h+=depsView();
  if(st.tab==="wd")h+=wdView();

  h+='<button class="btn btn-gray" style="width:100%;margin-top:12px" onclick="refresh()">🔄 Refresh Data</button>';
  return h;
}

function dashView(){
  var h='<div class="card"><p style="font-size:10px;color:#666;letter-spacing:2px;margin:0 0 12px">SYSTEM STATUS</p>';
  h+='<div class="row"><span class="lbl">API Connection</span><span class="badge badge-a">ONLINE</span></div>';
  h+='<div class="row"><span class="lbl">Admin Password</span><span class="val">802301</span></div>';
  h+='<div class="row"><span class="lbl">Database</span><span class="val">Google Sheets</span></div>';
  h+='<div class="row"><span class="lbl">Platform Status</span><span class="badge badge-a">LIVE</span></div>';
  h+='</div>';
  h+='<div class="card"><p style="font-size:10px;color:#666;letter-spacing:2px;margin:0 0 12px">QUICK ACTIONS</p>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn btn-sm" onclick="sw(\'deps\')">Review Deposits</button><button class="btn btn-sm btn-yellow" onclick="sw(\'users\')">Manage Users</button></div></div>';
  return h;
}

function usersView(){
  var list=st.users.slice(1);
  if(st.search)list=list.filter(function(u){return String(u[1]||"").toLowerCase().indexOf(st.search.toLowerCase())>-1||String(u[0]||"").indexOf(st.search)>-1});
  if(list.length===0)return '<div class="card" style="text-align:center;color:#666;padding:40px">No users found</div>';
  var h='<input class="inp" placeholder="🔍 Search by username or ID" style="margin-bottom:12px" oninput="st.search=this.value;render()" value="'+esc(st.search)+'">';
  for(var i=0;i<list.length;i++){
    var u=list[i];var idx=st.users.indexOf(u);
    h+='<div class="card">';
    h+='<div class="row"><div><p style="font-weight:800;margin:0;font-size:15px">'+esc(u[1]||"?")+'</p><p class="lbl" style="margin:4px 0 0">ID: '+esc(u[0])+'</p></div><div style="text-align:right"><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+Number(u[4]||0).toFixed(2)+'</p><p class="lbl" style="margin:2px 0 0">BALANCE</p></div></div>';
    h+='<div class="divider"></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;margin-bottom:10px">';
    h+='<div><p class="lbl">Email</p><p class="val">'+esc(u[2]||"—")+'</p></div>';
    h+='<div><p class="lbl">Phone</p><p class="val">'+esc(u[3]||"—")+'</p></div>';
    h+='<div><p class="lbl">Referral Code</p><p class="val">'+esc(u[7]||"—")+'</p></div>';
    h+='<div><p class="lbl">Joined</p><p class="val">'+(u[9]?String(u[9]).slice(0,10):"—")+'</p></div>';
    h+='</div>';
    h+='<div class="divider"></div>';
    h+='<div style="display:flex;gap:6px;margin-bottom:6px">';
    h+='<input type="number" id="b'+idx+'" class="inp" style="flex:1" placeholder="Set new balance">';
    h+='<button class="btn btn-sm" onclick="setBal(\''+esc(u[0])+'\','+idx+')">SET</button>';
    h+='</div>';
    h+='<div style="display:flex;gap:6px">';
    h+='<button class="btn btn-sm btn-yellow" style="flex:1" onclick="addBonus(\''+esc(u[0])+'\','+idx+')">+ Bonus</button>';
    h+='<button class="btn btn-sm btn-gray" style="flex:1" onclick="viewUser(\''+esc(u[0])+'\')">View Details</button>';
    h+='</div>';
    h+='</div>';
  }
  return h;
}

function depsView(){
  var list=st.deps.slice(1).reverse();
  if(list.length===0)return '<div class="card" style="text-align:center;color:#666;padding:40px">No deposits yet</div>';
  var h='';
  for(var i=0;i<list.length;i++){
    var d=list[i];
    var idx=st.deps.indexOf(d);
    var s=String(d[5]||"pending");
    var badge=s==="approved"?'badge-a':s==="rejected"?'badge-r':'badge-p';
    h+='<div class="card">';
    h+='<div class="row"><div><p style="font-weight:700;margin:0;font-size:14px">'+esc(d[1]||"?")+'</p><p class="lbl" style="margin:4px 0 0">User: '+esc(d[0])+'</p></div><div style="text-align:right"><p class="g" style="font-size:22px;font-weight:900;margin:0">$'+Number(d[2]||0).toFixed(2)+'</p><span class="badge '+badge+'" style="margin-top:4px">'+s.toUpperCase()+'</span></div></div>';
    h+='<div class="divider"></div>';
    h+='<div style="font-size:11px"><p class="lbl">Method</p><p class="val">'+esc(d[3]||"—")+'</p><p class="lbl" style="margin-top:6px">UTR / TxHash</p><p class="val" style="word-break:break-all">'+esc(d[4]||"—")+'</p><p class="lbl" style="margin-top:6px">Date</p><p class="val">'+(d[6]?String(d[6]).slice(0,19).replace("T"," "):"—")+'</p></div>';
    if(s==="pending"){
      h+='<div class="divider"></div>';
      h+='<div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="appDep(\''+esc(d[0])+'\',\''+esc(d[4])+'\','+Number(d[2]||0)+','+idx+')">✅ APPROVE</button><button class="btn btn-red btn-sm" onclick="rejDep('+idx+')">REJECT</button></div>';
    }
    h+='</div>';
  }
  return h;
}

function wdView(){
  return '<div class="card" style="text-align:center;color:#666;padding:40px">No withdrawal requests yet</div>';
}

async function login(){
  var p=document.getElementById("pw").value;
  if(p!==PWD)return alert("❌ Wrong password");
  st.login=true;await refresh();render();
}

async function refresh(){
  var u=await api("getUsers");if(u.success)st.users=u.users||[];
  var d=await api("getDeposits");if(d.success)st.deps=d.deposits||[];
  var w=await api("getWithdrawals");if(w.success)st.wd=w.withdrawals||[];
  render();
}

function sw(t){st.tab=t;render()}

async function setBal(uid,i){
  var v=document.getElementById("b"+i).value;
  if(v==="")return alert("Enter amount");
  var r=await api("updateBalance",{userId:uid,newBalance:parseFloat(v)});
  if(r.success){alert("✅ Balance updated");await refresh()}else alert("❌ Failed");
}

async function addBonus(uid,i){
  var v=prompt("Enter bonus amount ($):");
  if(!v)return;
  var u=st.users.find(function(x){return String(x[0])===String(uid)});
  if(!u)return alert("User not found");
  var newBal=Number(u[4]||0)+parseFloat(v);
  var r=await api("updateBalance",{userId:uid,newBalance:newBal});
  if(r.success){alert("✅ Bonus of $"+v+" added");await refresh()}else alert("❌ Failed");
}

async function appDep(uid,ref,amt,i){
  if(!confirm("Approve deposit of $"+amt+" for user "+uid+"?"))return;
  var r=await api("approveDeposit",{userId:uid,ref:ref,amount:amt});
  if(r.success){alert("✅ Approved & Balance Credited");await refresh()}else alert("❌ Failed - Check Apps Script fix");
}

function rejDep(i){
  if(!confirm("Reject this deposit?"))return;
  alert("Reject feature - coming soon");
}

function viewUser(uid){
  alert("User ID: "+uid+"\nFull details in Google Sheet");
}

function logout(){if(confirm("Logout?")){st.login=false;render()}}
render();
</script>
</body>
</html>
